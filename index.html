/* ══════════════════════════════════════════════════════════════
   BOARD VIEW
   ══════════════════════════════════════════════════════════════ */
class BoardView {
  constructor(canvas){
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.config = null;
    this.metrics = null;
    this.baseScale = 1;
    this.zoom = 1; this.panX = 0; this.panY = 0;
    this.maxZoom = 5;
    this.pw = 1; this.ph = 1;
    this.particles = [];
    this.shake = 0;
    this.lastT = performance.now();
    this.ro = null;
    this._mineSprite = null;
    this.ownerTint   = [null, 'rgba(77,216,255,.17)', 'rgba(255,61,129,.17)'];
    this.ownerEdge   = [null, 'rgba(77,216,255,.62)', 'rgba(255,61,129,.62)'];
    this.ownerSolid  = [null, '#4dd8ff', '#ff3d81'];
    this.ownerTintMine = [null, 'rgba(77,216,255,.28)', 'rgba(255,61,129,.28)'];
  }
  setOwnerPalette(map){
    this.ownerTint     = [null, map[1].tint,     map[2].tint];
    this.ownerEdge     = [null, map[1].edge,     map[2].edge];
    this.ownerSolid    = [null, map[1].solid,    map[2].solid];
    this.ownerTintMine = [null, map[1].tintMine, map[2].tintMine];
  }
  setConfig(config, keepView){
    this.config = config;
    this.metrics = this.computeMetrics(config);
    if (!keepView){ this.zoom = 1; this.panX = 0; this.panY = 0; }
    this.resize();
    this.observeParentSize();
  }
  computeMetrics(config){
    const small = Math.min(window.innerWidth, window.innerHeight) < 720;
    const isDuel = config.mode === 'duel';
    const isTerr = config.mode === 'territory';

    if (config.style === 'hex'){
      let size = isDuel ? 22 : (isTerr ? 20 : 30);
      if (small) size = isDuel ? 15 : (isTerr ? 14 : 22);
      const pad  = isDuel ? 16 : (isTerr ? 16 : 24);
      const HW = SQ3 * size;
      return {
        style: 'hex', size, pad, HW,
        boardW: Math.round(HW * (config.cols + 0.5) + pad * 2),
        boardH: Math.round(size * 1.5 * (config.rows - 1) + size * 2 + pad * 2)
      };
    }
    let cell = isDuel ? 42 : (isTerr ? 32 : 54);
    if (small) cell = isDuel ? 28 : (isTerr ? 22 : 36);
    const gap  = isDuel ? 4 : (isTerr ? 3 : 6);
    const pad  = isDuel ? 16 : (isTerr ? 16 : 22);
    return {
      style: 'square', cell, gap, pad,
      boardW: pad * 2 + cell * config.cols + gap * (config.cols - 1),
      boardH: pad * 2 + cell * config.rows + gap * (config.rows - 1)
    };
  }
  resize(){
    const m = this.metrics;
    if (!m) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const parent = this.canvas.parentElement;
    const pw = Math.max(1, (parent && parent.clientWidth) || Math.ceil(m.boardW));
    const ph = Math.max(1, (parent && parent.clientHeight) || Math.ceil(m.boardH));
    this.pw = pw; this.ph = ph;
    const bw = Math.max(1, Math.round(pw * this.dpr));
    const bh = Math.max(1, Math.round(ph * this.dpr));
    if (this.canvas.width !== bw)  this.canvas.width  = bw;
    if (this.canvas.height !== bh) this.canvas.height = bh;
    this.canvas.style.width  = pw + 'px';
    this.canvas.style.height = ph + 'px';
    this.baseScale = Math.min(pw / m.boardW, ph / m.boardH);
    this.clampPan();
  }
  clampPan(){
    const m = this.metrics; if (!m) return;
    const z = this.zoom;
    const bw = this.baseScale * z * m.boardW;
    const bh = this.baseScale * z * m.boardH;
    if (bw <= this.pw) this.panX = (this.pw - bw) / 2;
    else this.panX = clamp(this.panX, this.pw - bw, 0);
    if (bh <= this.ph) this.panY = (this.ph - bh) / 2;
    else this.panY = clamp(this.panY, this.ph - bh, 0);
    if (!isFinite(this.panX)) this.panX = (this.pw - bw) / 2;
    if (!isFinite(this.panY)) this.panY = (this.ph - bh) / 2;
  }
  resetView(){ this.zoom = 1; this.clampPan(); }
  zoomAround(cx, cy, newZoom){
    if (!this.metrics) return;
    newZoom = clamp(newZoom, 1, this.maxZoom);
    if (Math.abs(newZoom - this.zoom) < 0.0005) return;
    const scale = this.baseScale * this.zoom;
    const bx = (cx - this.panX) / scale;
    const by = (cy - this.panY) / scale;
    this.zoom = newZoom;
    this.panX = cx - bx * this.baseScale * this.zoom;
    this.panY = cy - by * this.baseScale * this.zoom;
    if (this.zoom <= 1.0001){ this.zoom = 1; }
    this.clampPan();
  }
  panBy(dx_css, dy_css){
    if (this.zoom <= 1.0001) return;
    this.panX += dx_css;
    this.panY += dy_css;
    this.clampPan();
  }
  observeParentSize(){
    if (this.ro){ this.ro.disconnect(); this.ro = null; }
    const parent = this.canvas.parentElement; if (!parent) return;
    if (typeof ResizeObserver !== 'undefined'){
      this.ro = new ResizeObserver(() => this.resize());
      this.ro.observe(parent);
    }
  }
  destroy(){ if (this.ro){ this.ro.disconnect(); this.ro = null; } }
  hitTest(clientX, clientY){
    if (!this.metrics) return null;
    const rect = this.canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    const scale = this.baseScale * this.zoom;
    const bx = (cx - this.panX) / scale;
    const by = (cy - this.panY) / scale;
    if (this.metrics.style === 'hex') return this.hexHitTest(bx, by);
    return this.squareHitTest(bx, by);
  }
  squareHitTest(bx, by){
    const m = this.metrics;
    const { cell, gap, pad } = m;
    const { rows, cols } = this.config;
    const relX = bx - pad, relY = by - pad;
    if (relX < 0 || relY < 0) return null;
    const c = Math.floor(relX / (cell + gap));
    const r = Math.floor(relY / (cell + gap));
    if (r < 0 || r >= rows || c < 0 || c >= cols) return null;
    if (relX - c * (cell + gap) > cell) return null;
    if (relY - r * (cell + gap) > cell) return null;
    return { r, c };
  }
  hexCenter(r, c){
    const m = this.metrics;
    const { size, pad, HW } = m;
    return {
      x: pad + HW * 0.5 + HW * c + ((r & 1) ? HW * 0.5 : 0),
      y: pad + size + size * 1.5 * r
    };
  }
  hexHitTest(bx, by){
    const m = this.metrics;
    const { size } = m;
    const { rows, cols } = this.config;
    let best = null, bestDist = Infinity;
    for (let r = 0; r < rows; r++){
      const y = this.hexCenter(r, 0).y;
      if (Math.abs(by - y) > size * 1.3) continue;
      for (let c = 0; c < cols; c++){
        const x = this.hexCenter(r, c).x;
        const d = Math.hypot(bx - x, by - y);
        if (d < bestDist){ bestDist = d; best = { r, c }; }
      }
    }
    return (best && bestDist < size * 0.98) ? best : null;
  }

  getMineSprite(size){
    if (this._mineSprite && this._mineSprite._size === size) return this._mineSprite;
    const dpr = Math.max(1, this.dpr);
    const w = Math.max(2, Math.ceil(size * dpr));
    const c = document.createElement('canvas');
    c.width = w; c.height = w;
    const cx = c.getContext('2d');
    cx.scale(dpr, dpr);
    const grad = cx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size*0.55);
    grad.addColorStop(0, 'rgba(255,77,109,.55)');
    grad.addColorStop(1, 'rgba(255,77,109,0)');
    cx.fillStyle = grad; cx.fillRect(0, 0, size, size);
    cx.fillStyle = '#ff4d6d';
    cx.beginPath(); cx.arc(size/2, size/2, size * 0.24, 0, Math.PI * 2); cx.fill();
    cx.strokeStyle = '#ff4d6d';
    cx.lineWidth = Math.max(1.6, size * 0.06);
    cx.lineCap = 'round';
    for (let i = 0; i < 6; i++){
      const ang = i * Math.PI / 3;
      cx.beginPath();
      cx.moveTo(size/2 + Math.cos(ang) * size * 0.3, size/2 + Math.sin(ang) * size * 0.3);
      cx.lineTo(size/2 + Math.cos(ang) * size * 0.42, size/2 + Math.sin(ang) * size * 0.42);
      cx.stroke();
    }
    c._size = size;
    this._mineSprite = c;
    return c;
  }

  render(now, state){
    const ctx = this.ctx;
    const dt = Math.min(now - this.lastT, 50);
    this.lastT = now;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 0.0026);

    for (let i = this.particles.length - 1; i >= 0; i--){
      const p = this.particles[i];
      const s = dt / 1000;
      p.vy += 200 * s;
      p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx * s; p.y += p.vy * s;
      p.life -= p.decay * s;
      if (p.life <= 0) this.particles.splice(i, 1);
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    if (!this.metrics) return;

    let sx = 0, sy = 0;
    if (this.shake > 0.01){
      const m = this.shake * 12;
      sx = (Math.random() - 0.5) * m;
      sy = (Math.random() - 0.5) * m;
    }
    const scale = this.baseScale * this.zoom * this.dpr;
    ctx.setTransform(scale, 0, 0, scale,
      (this.panX + sx) * this.dpr,
      (this.panY + sy) * this.dpr);

    if (this.metrics.style === 'hex') this.renderHex(now, state);
    else this.renderSquare(now, state);

    if (this.particles.length){
      for (const p of this.particles){
        ctx.globalAlpha = clamp(p.life, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  boom(cx, cy, color, n, power){
    power = power || 150;
    const cap = 60;
    if (this.particles.length > cap) return;
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * power;
      this.particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.65 + Math.random() * 1.0,
        size: 1.4 + Math.random() * 3.0, color
      });
    }
  }
  triggerShake(){ this.shake = 1; }

  renderSquare(now, state){
    const ctx = this.ctx;
    const m = this.metrics;
    const { cell, gap, pad } = m;
    const { board, boardState, cursors } = state;
    const { rows, cols } = board;
    const useOwner = this.config.mode === 'territory';
    const NUM_COLORS = ['', '#4dd8ff', '#5dff9e', '#ffd166', '#ff7ad9',
                        '#b98cff', '#ff5c5c', '#ff9f43', '#7ef9ff'];
    const radius = Math.max(3, Math.floor(cell * 0.16));
    const mineSprite = this.getMineSprite(cell);
    const nowMs = now;

    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const x = pad + c * (cell + gap);
        const y = pad + r * (cell + gap);
        const rev = boardState.revealed[r][c];
        const flg = boardState.flagged[r][c];
        const isMine = board.mines.has(r + ',' + c);
        const own = (useOwner && boardState.owner) ? boardState.owner[r][c] : 0;

        if (rev && nowMs >= boardState.revealAt[r][c]){
          const t = (nowMs - boardState.revealAt[r][c]) / 200;
          const e = easeOutCubic(clamp(t, 0, 1));
          const sc = 0.68 + 0.32 * e;
          const a = clamp(t * 2.2, 0, 1);

          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(x + cell/2, y + cell/2);
          ctx.scale(sc, sc);
          ctx.translate(-cell/2, -cell/2);

          ctx.fillStyle = isMine ? '#2a0810' : '#070b14';
          this.roundRect(ctx, 0, 0, cell, cell, radius);
          ctx.fill();

          if (own){
            ctx.fillStyle = isMine ? this.ownerTintMine[own] : this.ownerTint[own];
            this.roundRect(ctx, 0, 0, cell, cell, radius);
            ctx.fill();
          }

          ctx.strokeStyle = own
            ? this.ownerEdge[own]
            : (isMine ? 'rgba(255,77,109,.55)' : 'rgba(58,96,150,.3)');
          ctx.lineWidth = own ? 2.2 : 1.4;
          this.roundRect(ctx, 0, 0, cell, cell, radius);
          ctx.stroke();

          if (isMine){
            ctx.drawImage(mineSprite, 0, 0, cell, cell);
          } else if (board.adj[r][c] > 0){
            const col = NUM_COLORS[board.adj[r][c]] || '#cfe4ff';
            ctx.font = '900 ' + (cell * 0.58) + 'px "Courier New", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = col;
            ctx.fillText(board.adj[r][c], cell/2, cell/2 + 1);
          }
          ctx.restore();
        } else {
          ctx.fillStyle = '#111a2c';
          this.roundRect(ctx, x, y, cell, cell, radius);
          ctx.fill();

          if (own && !isMine){
            ctx.fillStyle = this.ownerTint[own];
            this.roundRect(ctx, x, y, cell, cell, radius);
            ctx.fill();
          }

          const pulse = 0.22 + 0.11 * Math.sin(nowMs / 800 + (r * 0.7 + c * 0.45));
          ctx.strokeStyle = own ? this.ownerEdge[own]
            : 'rgba(90,165,255,' + pulse.toFixed(3) + ')';
          ctx.lineWidth = own ? 2 : 1.5;
          this.roundRect(ctx, x, y, cell, cell, radius);
          ctx.stroke();

          if (flg){
            const ft = clamp((nowMs - (boardState.flagAt[r][c] || nowMs)) / 240, 0, 1);
            const fs = clamp(easeOutBack(ft), 0, 1.3);
            const flagColor = (own && this.ownerSolid[own]) ? this.ownerSolid[own] : '#ff3d81';
            ctx.save();
            ctx.globalAlpha = clamp(ft * 3, 0, 1);
            ctx.translate(x + cell/2, y + cell/2);
            ctx.scale(fs, fs);
            ctx.fillStyle = flagColor; ctx.strokeStyle = flagColor;
            ctx.lineWidth = Math.max(2, cell * 0.075);
            ctx.lineCap = 'round';
            const poleH = cell * 0.72;
            ctx.beginPath();
            ctx.moveTo(-2, poleH * 0.5);
            ctx.lineTo(-2, -poleH * 0.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-2, -poleH * 0.5);
            ctx.lineTo(cell * 0.32, -cell * 0.15);
            ctx.lineTo(-2, cell * 0.08);
            ctx.closePath(); ctx.fill();
            ctx.restore();
          }
        }
      }
    }

    if (state.highlights){
      for (const h of state.highlights){
        const x = pad + h.c * (cell + gap);
        const y = pad + h.r * (cell + gap);
        const pulse = 0.5 + 0.5 * Math.sin(nowMs / 170);
        ctx.save();
        ctx.strokeStyle = h.color || '#ffe066';
        ctx.lineWidth = 3 + 1.5 * pulse;
        this.roundRect(ctx, x - 3, y - 3, cell + 6, cell + 6, radius + 4);
        ctx.stroke();
        ctx.restore();
      }
    }

    for (const cur of cursors){
      const x = pad + cur.c * (cell + gap);
      const y = pad + cur.r * (cell + gap);
      ctx.save();
      ctx.strokeStyle = cur.color;
      ctx.lineWidth = 3;
      this.roundRect(ctx, x - 2, y - 2, cell + 4, cell + 4, radius + 3);
      ctx.stroke();
      ctx.restore();
    }
  }

  renderHex(now, state){
    const ctx = this.ctx;
    const m = this.metrics;
    const { size } = m;
    const { board, boardState, cursors } = state;
    const { rows, cols } = board;
    const useOwner = this.config.mode === 'territory';
    const NUM_COLORS = ['', '#4dd8ff', '#5dff9e', '#ffd166', '#ff7ad9',
                        '#b98cff', '#ff5c5c', '#ff9f43', '#7ef9ff'];
    const mineSprite = this.getMineSprite(size * 1.6);
    const nowMs = now;

    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const p = this.hexCenter(r, c);
        const x = p.x, y = p.y;
        const rev = boardState.revealed[r][c];
        const flg = boardState.flagged[r][c];
        const isMine = board.mines.has(r + ',' + c);
        const own = (useOwner && boardState.owner) ? boardState.owner[r][c] : 0;

        if (rev && nowMs >= boardState.revealAt[r][c]){
          const t = (nowMs - boardState.revealAt[r][c]) / 240;
          const e = easeOutCubic(clamp(t, 0, 1));
          const s = 0.6 + 0.4 * e;
          const a = clamp(t * 2.2, 0, 1);
          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(x, y);
          ctx.scale(s, s);
          this.hexPath(0, 0, size - 3);
          ctx.fillStyle = '#070b14'; ctx.fill();
          if (own){
            ctx.fillStyle = isMine ? this.ownerTintMine[own] : this.ownerTint[own];
            ctx.fill();
          }
          ctx.strokeStyle = own
            ? this.ownerEdge[own]
            : (isMine ? 'rgba(255,77,109,.55)' : 'rgba(58,96,150,.32)');
          ctx.lineWidth = own ? 2.4 : 1.4;
          ctx.stroke();

          if (isMine){
            const sz = size * 1.6;
            ctx.drawImage(mineSprite, -sz/2, -sz/2, sz, sz);
          } else if (board.adj[r][c] > 0){
            const col = NUM_COLORS[board.adj[r][c]] || '#cfe4ff';
            ctx.font = '900 ' + (size * 1.0) + 'px "Courier New", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = col;
            ctx.fillText(board.adj[r][c], 0, 1);
          }
          ctx.restore();
        } else {
          const isHover = cursors.some(cur => cur.r === r && cur.c === c);
          this.hexPath(x, y, size - 3);
          if (isHover){
            ctx.fillStyle = '#1c2b4a'; ctx.fill();
            ctx.save();
            ctx.strokeStyle = '#4dd8ff';
            ctx.lineWidth = 2.4;
            ctx.stroke();
            ctx.restore();
          } else {
            ctx.fillStyle = '#111a2c'; ctx.fill();
            if (own && !isMine){ ctx.fillStyle = this.ownerTint[own]; ctx.fill(); }
            const pulse = 0.22 + 0.11 * Math.sin(nowMs / 800 + (r * 0.7 + c * 0.45));
            ctx.strokeStyle = own ? this.ownerEdge[own]
              : 'rgba(90,165,255,' + pulse.toFixed(3) + ')';
            ctx.lineWidth = own ? 2.2 : 1.5;
            ctx.stroke();
          }
          if (flg){
            const ft = clamp((nowMs - (boardState.flagAt[r][c] || nowMs)) / 240, 0, 1);
            const fs = clamp(easeOutBack(ft), 0, 1.3);
            const flagColor = (own && this.ownerSolid[own]) ? this.ownerSolid[own] : '#ff3d81';
            ctx.save();
            ctx.globalAlpha = clamp(ft * 3, 0, 1);
            ctx.translate(x, y); ctx.scale(fs, fs);
            ctx.strokeStyle = flagColor; ctx.fillStyle = flagColor;
            ctx.lineWidth = Math.max(2, size * 0.11);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const poleH = size * 0.82;
            ctx.beginPath();
            ctx.moveTo(-2, poleH * 0.55); ctx.lineTo(-2, -poleH * 0.55); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-2, -poleH * 0.55);
            ctx.lineTo(size * 0.52, -size * 0.2);
            ctx.lineTo(-2, size * 0.12);
            ctx.closePath(); ctx.fill();
            ctx.restore();
          }
        }
      }
    }

    if (state.highlights){
      for (const h of state.highlights){
        const p = this.hexCenter(h.r, h.c);
        const pulse = 0.5 + 0.5 * Math.sin(nowMs / 170);
        ctx.save();
        ctx.strokeStyle = h.color || '#ffe066';
        ctx.lineWidth = 3 + 1.5 * pulse;
        this.hexPath(p.x, p.y, size - 1);
        ctx.stroke();
        ctx.restore();
      }
    }
    for (const cur of cursors){
      const p = this.hexCenter(cur.r, cur.c);
      ctx.save();
      ctx.strokeStyle = cur.color;
      ctx.lineWidth = 3;
      this.hexPath(p.x, p.y, size - 3);
      ctx.stroke();
      ctx.restore();
    }
  }

  hexPath(cx, cy, rad){
    const ctx = this.ctx;
    ctx.beginPath();
    for (let i = 0; i < 6; i++){
      const a = (60 * i - 30) * Math.PI / 180;
      const px = cx + rad * Math.cos(a);
      const py = cy + rad * Math.sin(a);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
  roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}

function hexOrSqCenter(view, r, c){
  const m = view.metrics;
  if (m.style === 'hex') return view.hexCenter(r, c);
  const { cell, gap, pad } = m;
  return { x: pad + c * (cell + gap) + cell/2, y: pad + r * (cell + gap) + cell/2 };
}

const STUN_HTML =
  '<div class="stun">' +
    '<div class="stun-emoji">💥</div>' +
    '<div class="stun-title">FROZEN</div>' +
    '<div class="stun-timer" data-timer>10.0</div>' +
    '<div class="stun-sub">BOMB TRIGGERED</div>' +
  '</div>';

function setStunFace(el, reason){
  if (!el) return;
  const ice = (reason === 'flag');
  if (el._reason === reason) return;
  el._reason = reason;
  el.classList.toggle('ice', ice);
  const emo = el.querySelector('.stun-emoji');
  const sub = el.querySelector('.stun-sub');
  if (emo) emo.textContent = ice ? '❄️' : '💥';
  if (sub) sub.textContent = ice ? 'WRONG FLAG' : 'BOMB TRIGGERED';
}

function makePanel(cls, name, color){
  const panel = document.createElement('div');
  panel.className = 'panel ' + cls;
  panel.style.setProperty('--pc', color);
  panel.innerHTML =
    '<div class="phead">' +
      '<span class="dot"></span>' +

      '<span class="pkeys"></span>' +

      '<div class="pstat"><span class="plabel">HITS</span><span class="pval" data-hits>0</span></div>' +
    '</div>' +
    '<div class="pbar"><i></i></div>' +

      '<canvas></canvas>' +
      STUN_HTML +

}

/* ── Player-name helpers + panel header refresh ─────────────── */
function myNameText(){
  if (isGuest) return 'YOU';
  return getPlayerName() || 'YOU';
}
function theirNameText(){
  return G.theirName || 'OPPONENT';
}

function updatePanelNames(){
  const myName = myNameText();
  const theirName = theirNameText();
  const mode = G.config.mode;

  if (G.panelMe && G.panelMe._els){
    const e = G.panelMe._els;
    if (mode === 'solo'){
      if (e.nameEl) e.nameEl.textContent = 'SOLO';
    } else if (mode === 'coop'){
      if (e.nameEl){
        /* Both teammates share the blue name — team colour. */
        e.nameEl.innerHTML =
          escapeHtml(myName) +
          ' <span style="color:#6b7a94">&amp;</span> ' +
          escapeHtml(theirName);
      }
    } else if (mode === 'territory'){
      if (e.nameMeEl)   e.nameMeEl.textContent = myName;
      if (e.nameThemEl) e.nameThemEl.textContent = theirName;
      if (e.oppNameEl)  e.oppNameEl.textContent = theirName;
    } else {
      /* duel — player's own name in blue */
      if (e.nameEl) e.nameEl.textContent = myName;
    }
  }
  if (G.panelThem && G.panelThem._els && G.panelThem._els.nameEl){
    G.panelThem._els.nameEl.textContent = theirName;
  }
}

function viewConfig(){
  const d = dimsFor(G.config);
  return { mode: G.config.mode, style: G.config.style, cols: d.cols, rows: d.rows };
}

function buildArena(){
  arena.innerHTML = '';
  G.viewMe = null; G.viewThem = null; G.panelMe = null; G.panelThem = null;
  const mode = G.config.mode;
  arena.classList.toggle('solo', mode === 'solo');
  arena.classList.toggle('territory', mode === 'territory');
  if (mode === 'territory'){ buildTerritoryArena(); updatePanelNames(); return; }
  const isSolo = mode === 'solo';
  const isCoop = mode === 'coop';

  const panelA = makePanel('me', isSolo ? 'SOLO' : 'YOU', '#4dd8ff');
  arena.appendChild(panelA);
  G.viewMe = new BoardView(panelA.querySelector('canvas'));
  G.viewMe.setConfig(viewConfig());
  bindCanvasInput(G.viewMe, true);
  wireZoomBadge(panelA, G.viewMe);
  panelA._els = {
    mines: panelA.querySelector('[data-mines]'),
    time:  panelA.querySelector('[data-time]'),
    hits:  panelA.querySelector('[data-hits]'),
    bar:   panelA.querySelector('.pbar i'),
    stun:  panelA.querySelector('.stun'),
    keys:  panelA.querySelector('.pkeys'),
    nameEl: panelA.querySelector('.pname'),
    panel: panelA
  };
  if (isCoop) panelA._els.keys.textContent = 'SHARED · ' + panelKeysText();
  else        panelA._els.keys.textContent = panelKeysText();

  if (mode === 'duel'){
    const panelB = makePanel('them', 'OPPONENT', '#ff3d81');
    arena.appendChild(panelB);
    G.viewThem = new BoardView(panelB.querySelector('canvas'));
    G.viewThem.setConfig(viewConfig());
    bindCanvasInput(G.viewThem, false);
    wireZoomBadge(panelB, G.viewThem);
    panelB._els = {
      mines: panelB.querySelector('[data-mines]'),
      time:  panelB.querySelector('[data-time]'),
      hits:  panelB.querySelector('[data-hits]'),
      bar:   panelB.querySelector('.pbar i'),
      stun:  panelB.querySelector('.stun'),
      keys:  panelB.querySelector('.pkeys'),
      nameEl: panelB.querySelector('.pname'),
      panel: panelB
    };
    panelB._els.keys.textContent = 'LIVE VIEW';
    G.panelThem = panelB;
  }
  G.panelMe = panelA;
  updatePanelNames();
}

function buildTerritoryArena(){
  const panel = makeTerritoryPanel();
  arena.appendChild(panel);
  G.viewMe = new BoardView(panel.querySelector('canvas'));
  G.viewMe.setConfig(viewConfig());
  const CYAN = {
    tint: 'rgba(77,216,255,.17)', tintMine: 'rgba(77,216,255,.30)',
    edge: 'rgba(77,216,255,.72)', solid: '#4dd8ff'
  };
  const PINK = {
    tint: 'rgba(255,61,129,.17)', tintMine: 'rgba(255,61,129,.30)',
    edge: 'rgba(255,61,129,.72)', solid: '#ff3d81'
  };
  G.viewMe.setOwnerPalette(G.myOwner === 1 ? { 1: CYAN, 2: PINK } : { 1: PINK, 2: CYAN });
  bindCanvasInput(G.viewMe, true);
  wireZoomBadge(panel, G.viewMe);
  panel._els = {
    myLand:    panel.querySelector('[data-myland]'),
    theirLand: panel.querySelector('[data-theirland]'),
    time:      panel.querySelector('[data-time]'),
    myBar:     panel.querySelector('[data-mybar]'),
    theirBar:  panel.querySelector('[data-theirbar]'),
    stun:      panel.querySelector('.stun'),
    oppStun:   panel.querySelector('.oppstun'),
    nameMeEl:   panel.querySelector('[data-nameme]'),
    nameThemEl: panel.querySelector('[data-namethem]'),
    oppNameEl:  panel.querySelector('[data-oname]'),
    panel:     panel
  };
  panel.querySelector('.pkeys').textContent = panelKeysText();
  G.panelMe = panel;
}

function wireZoomBadge(panel, view){
  const badge = panel.querySelector('[data-zoombadge]');
  if (!badge) return;
  let rafId = null;
  const tick = () => {
    rafId = requestAnimationFrame(tick);
    if (view.zoom > 1.001){
      badge.classList.add('on');
      badge.textContent = '⤢ ' + view.zoom.toFixed(1) + '× · reset';
    } else {
      badge.classList.remove('on');
    }
  };
  rafId = requestAnimationFrame(tick);
  badge.addEventListener('click', e => {
    e.stopPropagation();
    view.resetView();
    SFX.clickSoft();
  });
  badge.addEventListener('pointerdown', e => e.stopPropagation());
}

/* ══════════════════════════════════════════════════════════════
   INPUT — canvas
   ══════════════════════════════════════════════════════════════ */
function interactive(){
  return G.state === 'playing' && G.me && !G.me.done;
}
function bindCanvasInput(view, gameplay){
  const canvas = view.canvas;
  const pointers = new Map();
  let pinch = null;
  let touchGesture = null;
  let mousePan = null;

  const clientToLocal = (clientX, clientY) => {
    const rect = canvas.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top, rect };
  };

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    if (!view.metrics) return;
    e.preventDefault();
    let delta = e.deltaY;
    if (e.deltaMode === 1) delta *= 16;
    else if (e.deltaMode === 2) delta *= 400;
    const factor = Math.exp(-delta * 0.0018);
    const newZoom = clamp(view.zoom * factor, 1, view.maxZoom);
    if (Math.abs(newZoom - view.zoom) < 0.001) return;
    const { x, y } = clientToLocal(e.clientX, e.clientY);
    view.zoomAround(x, y, newZoom);
  }, { passive: false });

  const cancelTouchGesture = () => {
    if (touchGesture && touchGesture.timer) clearTimeout(touchGesture.timer);
    touchGesture = null;
  };

  canvas.addEventListener('pointerdown', e => {
    if (!view.metrics) return;
    try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    pointers.set(e.pointerId, {
      x: e.clientX, y: e.clientY,
      startX: e.clientX, startY: e.clientY,
      startTime: performance.now()
    });

    if (e.pointerType === 'mouse'){
      if (e.button === 1 || (e.button === 0 && e.shiftKey)){
        e.preventDefault();
        mousePan = { id: e.pointerId, lastX: e.clientX, lastY: e.clientY };
        return;
      }
      if (!gameplay || !interactive()) return;
      const cell = view.hitTest(e.clientX, e.clientY);
      if (!cell) return;
      e.preventDefault();
      if (e.button === 0)      localDigAt(cell.r, cell.c);
      else if (e.button === 2) localFlagAt(cell.r, cell.c);
      return;
    }

    if (pointers.size >= 2){
      cancelTouchGesture();
      const pts = Array.from(pointers.values());
      const d0 = Math.hypot(pts[0].startX - pts[1].startX, pts[0].startY - pts[1].startY);
      const midX0 = (pts[0].startX + pts[1].startX) / 2;
      const midY0 = (pts[0].startY + pts[1].startY) / 2;
      const l0 = clientToLocal(midX0, midY0);
      pinch = { d0, zoom0: view.zoom, pan0X: view.panX, pan0Y: view.panY, midL0X: l0.x, midL0Y: l0.y };
      return;
    }

    touchGesture = {
      id: e.pointerId, x0: e.clientX, y0: e.clientY,
      x: e.clientX, y: e.clientY,
      time0: performance.now(),
      moved: false, longFired: false, panning: false,
      lastX: e.clientX, lastY: e.clientY, timer: null
    };
    if (gameplay && interactive()){
      const g = touchGesture;
      const cx = e.clientX, cy = e.clientY;
      g.timer = setTimeout(() => {
        if (touchGesture !== g || g.moved || g.panning || !interactive()) return;
        g.longFired = true;
        const cell = view.hitTest(cx, cy);
        if (cell) localFlagAt(cell.r, cell.c);
        vibrate(20);
      }, 400);
    }
  });

  canvas.addEventListener('pointermove', e => {
    const tracked = pointers.get(e.pointerId);
    if (!tracked) return;
    tracked.x = e.clientX; tracked.y = e.clientY;

    if (mousePan && mousePan.id === e.pointerId){
      const dx = e.clientX - mousePan.lastX;
      const dy = e.clientY - mousePan.lastY;
      mousePan.lastX = e.clientX; mousePan.lastY = e.clientY;
      view.panBy(dx, dy);
      return;
    }
    if (pinch && pointers.size >= 2){
      const pts = Array.from(pointers.values());
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const cx = (pts[0].x + pts[1].x) / 2;
      const cy = (pts[0].y + pts[1].y) / 2;
      const l = clientToLocal(cx, cy);
      const newZoom = clamp(pinch.zoom0 * (d / Math.max(pinch.d0, 1)), 1, view.maxZoom);
      const w0x = (pinch.midL0X - pinch.pan0X) / pinch.zoom0;
      const w0y = (pinch.midL0Y - pinch.pan0Y) / pinch.zoom0;
      view.zoom = newZoom;
      view.panX = l.x - w0x * newZoom;
      view.panY = l.y - w0y * newZoom;
      if (view.zoom <= 1.0001) view.zoom = 1;
      view.clampPan();
      return;
    }
    if (touchGesture && touchGesture.id === e.pointerId){
      const dxTotal = e.clientX - touchGesture.x0;
      const dyTotal = e.clientY - touchGesture.y0;
      if (!touchGesture.moved && Math.hypot(dxTotal, dyTotal) > 8){
        touchGesture.moved = true;
        if (touchGesture.timer) clearTimeout(touchGesture.timer);
        if (view.zoom > 1.001){
          touchGesture.panning = true;
          touchGesture.lastX = e.clientX;
          touchGesture.lastY = e.clientY;
        }
      }
      if (touchGesture.panning){
        const pdx = e.clientX - touchGesture.lastX;
        const pdy = e.clientY - touchGesture.lastY;
        touchGesture.lastX = e.clientX;
        touchGesture.lastY = e.clientY;
        view.panBy(pdx, pdy);
      }
    }
  });

  const finishPointer = e => {
    if (mousePan && mousePan.id === e.pointerId) mousePan = null;
    if (touchGesture && touchGesture.id === e.pointerId){
      if (touchGesture.timer) clearTimeout(touchGesture.timer);
      const g = touchGesture;
      touchGesture = null;
      if (gameplay && interactive() && !g.moved && !g.longFired && !g.panning){
        const cell = view.hitTest(e.clientX, e.clientY);
        if (cell) localDigAt(cell.r, cell.c);
      }
    }
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 1){
      const [id, p] = pointers.entries().next().value;
      touchGesture = {
        id, x0: p.x, y0: p.y, x: p.x, y: p.y,
        time0: performance.now(),
        moved: true, longFired: true, panning: false,
        lastX: p.x, lastY: p.y, timer: null
      };
    }
  };

  canvas.addEventListener('pointerup', finishPointer);
  canvas.addEventListener('pointercancel', finishPointer);
}

/* ══════════════════════════════════════════════════════════════
   INPUT — keyboard
   ══════════════════════════════════════════════════════════════ */
const heldPan = { KeyW:false, KeyA:false, KeyS:false, KeyD:false };
const heldZoom = { in:false, out:false };

function clearHeldKeys(){
  heldPan.KeyW = heldPan.KeyA = heldPan.KeyS = heldPan.KeyD = false;
  heldZoom.in = false;
  heldZoom.out = false;
}

let hotkeyCapture = null;

window.addEventListener('keydown', e => {
  if (hotkeyCapture){
    e.preventDefault();
    if (e.key === 'Escape'){ hotkeyCapture = null; renderMenu(); return; }
    const code = e.code;
    if (code && code !== 'Escape'){
      HOTKEYS[hotkeyCapture] = code;
      saveHotkeys();
      hotkeyCapture = null;
      renderMenu();
    }
    return;
  }

  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  const code = e.code || '';

  if (code === HOTKEYS.zoomIn){ heldZoom.in = true; e.preventDefault(); return; }
  if (code === HOTKEYS.zoomOut){ heldZoom.out = true; e.preventDefault(); return; }

  if ((code === 'KeyW' || code === 'KeyA' || code === 'KeyS' || code === 'KeyD') &&
      !codeBoundToAction(code)){
    const hasReview = G.reviewViews && G.reviewViews.length > 0;
    if (hasReview || (G.viewMe && G.state !== 'lobby')){
      heldPan[code] = true;
      e.preventDefault();
    }
    return;
  }

  if (G.state !== 'playing' || !G.me) return;

  let handled = true;
  if      (code === HOTKEYS.up)    moveCursor(-1, 0);
  else if (code === HOTKEYS.down)  moveCursor(1, 0);
  else if (code === HOTKEYS.left)  moveCursor(0, -1);
  else if (code === HOTKEYS.right) moveCursor(0, 1);
  else if (code === HOTKEYS.dig){ if (!e.repeat) localDig(); }
  else if (code === HOTKEYS.flag){ if (!e.repeat) localFlag(); }
  else if (code === 'KeyE' || code === 'KeyQ'){ if (!e.repeat) localChord(); }
  else if (code === 'Digit0'){ if (G.viewMe) G.viewMe.resetView(); }
  else handled = false;
  if (handled) e.preventDefault();
}, { passive:false });

window.addEventListener('keyup', e => {
  const code = e.code || '';
  if (code === HOTKEYS.zoomIn)  heldZoom.in = false;
  if (code === HOTKEYS.zoomOut) heldZoom.out = false;
  if (code === 'KeyW' || code === 'KeyA' || code === 'KeyS' || code === 'KeyD'){
    heldPan[code] = false;
  }
});
window.addEventListener('blur', clearHeldKeys);

function activeViews(){
  if (G.reviewViews && G.reviewViews.length) return G.reviewViews;
  return G.viewMe ? [G.viewMe] : [];
}

function updatePanFromKeys(dtMs){
  const targets = activeViews();
  if (!targets.length) return;
  let dx = 0, dy = 0;
  if (heldPan.KeyA) dx += 1;
  if (heldPan.KeyD) dx -= 1;
  if (heldPan.KeyW) dy += 1;
  if (heldPan.KeyS) dy -= 1;
  if (!dx && !dy) return;
  const dt = dtMs / 1000;
  for (const v of targets){
    if (v && v.metrics && v.zoom > 1.0001){
      v.panBy(dx * PAN_SPEED_CSS * dt, dy * PAN_SPEED_CSS * dt);
    }
  }
}

function updateZoomFromKeys(dtMs){
  if (!heldZoom.in && !heldZoom.out) return;
  const targets = activeViews();
  if (!targets.length) return;
  const dt = Math.min(dtMs, 100) / 1000;
  let factor = 1;
  if (heldZoom.in)  factor *= Math.exp(ZOOM_RATE * dt);
  if (heldZoom.out) factor *= Math.exp(-ZOOM_RATE * dt);
  for (const v of targets){
    if (!v || !v.metrics) continue;
    const nz = clamp(v.zoom * factor, 1, v.maxZoom);
    if (Math.abs(nz - v.zoom) < 0.0002) continue;
    v.zoomAround(v.pw / 2, v.ph / 2, nz);
  }
}

/* ══════════════════════════════════════════════════════════════
   INPUT — touch pad
   ══════════════════════════════════════════════════════════════ */
function holdButton(btn, fn){
  let t1 = null, t2 = null;
  const start = e => {
    e.preventDefault();
    if (!interactive()) return;
    fn();
    t1 = setTimeout(() => { t2 = setInterval(() => { if (interactive()) fn(); }, 110); }, 320);
  };
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
}
function buildTouchpad(){
  const pad = document.createElement('div');
  pad.className = 'touchpad';
  pad.innerHTML =
    '<div class="dpad">' +
      '<button class="u ghost" data-mv="up">▲</button>' +
      '<button class="l ghost" data-mv="left">◀</button>' +
      '<button class="r ghost" data-mv="right">▶</button>' +
      '<button class="dn ghost" data-mv="down">▼</button>' +
    '</div>' +
    '<div class="tp-actions">' +
      '<button class="primary" data-act="dig">DIG ⛏</button>' +
      '<button data-act="flag">FLAG ⚑</button>' +
    '</div>';
  const map = {
    up:    () => moveCursor(-1, 0),
    down:  () => moveCursor(1, 0),
    left:  () => moveCursor(0, -1),
    right: () => moveCursor(0, 1)
  };
  pad.querySelectorAll('[data-mv]').forEach(b => holdButton(b, map[b.dataset.mv]));
  pad.querySelector('[data-act="dig"]').addEventListener('click', () => localDig());
  pad.querySelector('[data-act="flag"]').addEventListener('click', () => localFlag());
  return pad;
}

/* ══════════════════════════════════════════════════════════════
   GAME LOGIC
   ══════════════════════════════════════════════════════════════ */
function applyReveal(boardState, board, r, c, owner){
  owner = owner || 0;
  if (boardState.revealed[r][c]) return null;
  if (boardState.flagged[r][c]){
    boardState.flagged[r][c] = false;
    boardState.flagCount = Math.max(0, boardState.flagCount - 1);
  }
  if (board.mines.has(r + ',' + c)){
    boardState.revealed[r][c] = true;
    boardState.revealAt[r][c] = performance.now();
    if (boardState.owner) boardState.owner[r][c] = 0;
    boardState.count++;
    return { type: 'mine', tiles: [[r, c]] };
  }
  const now = performance.now();
  const queue = [[r, c, 0]];
  const seen = new Set([r + ',' + c]);
  const tiles = [];
  while (queue.length){
    const item = queue.shift();
    const cr = item[0], cc = item[1], d = item[2];
    if (boardState.revealed[cr][cc]) continue;
    if (boardState.flagged[cr][cc]){
      boardState.flagged[cr][cc] = false;
      boardState.flagCount = Math.max(0, boardState.flagCount - 1);
    }
    boardState.revealed[cr][cc] = true;
    if (owner && boardState.owner) boardState.owner[cr][cc] = owner;
    boardState.revealAt[cr][cc] = now + Math.min(d, 14) * 24;
    boardState.count++;
    boardState.safeRevealed++;
    tiles.push([cr, cc]);
    if (board.adj[cr][cc] === 0){
      for (const nb of board.neighbors(cr, cc, board.rows, board.cols)){
        const nr = nb[0], nc = nb[1];
        const k = nr + ',' + nc;
        if (!seen.has(k) && !boardState.revealed[nr][nc]){
          seen.add(k);
          queue.push([nr, nc, d + 1]);
        }
      }
    }
  }
  return { type: 'ok', tiles };
}

function applyChord(boardState, board, r, c, owner){
  if (!boardState.revealed[r][c]) return null;
  if (board.adj[r][c] <= 0) return null;
  const nbs = board.neighbors(r, c, board.rows, board.cols);
  let flags = 0;
  for (const nb of nbs){
    const nr = nb[0], nc = nb[1];
    if (boardState.flagged[nr][nc]) flags++;
    else if (boardState.revealed[nr][nc] && board.mines.has(nr + ',' + nc)) flags++;
  }
  if (flags !== board.adj[r][c]) return null;
  for (const nb of nbs){
    const nr = nb[0], nc = nb[1];
    if (boardState.flagged[nr][nc] || boardState.revealed[nr][nc]) continue;
    if (board.mines.has(nr + ',' + nc)){
      const res = applyReveal(boardState, board, nr, nc, owner);
      return { type: 'mine', tiles: res ? res.tiles : [[nr, nc]] };
    }
  }
  const allTiles = [];
  for (const nb of nbs){
    const nr = nb[0], nc = nb[1];
    if (boardState.flagged[nr][nc] || boardState.revealed[nr][nc]) continue;
    const res = applyReveal(boardState, board, nr, nc, owner);
    if (res && res.tiles) allTiles.push.apply(allTiles, res.tiles);
  }
  return { type: 'ok', tiles: allTiles };
}

function revealAllMines(boardState, board, originR, originC){
  const now = performance.now();
  for (let r = 0; r < board.rows; r++){
    for (let c = 0; c < board.cols; c++){
      if (!board.mines.has(r + ',' + c)) continue;
      if (boardState.revealed[r][c] || boardState.flagged[r][c]) continue;
      const d = Math.hypot(r - originR, c - originC);
      boardState.revealed[r][c] = true;
      if (boardState.owner) boardState.owner[r][c] = 0;
      boardState.revealAt[r][c] = now + d * 35;
    }
  }
}
function checkWin(boardState, board){ return boardState.safeRevealed >= board.safeCount; }
function countLand(boardState, owner){
  let n = 0;
  if (!boardState.owner) return 0;
  for (let r = 0; r < boardState.rows; r++)
    for (let c = 0; c < boardState.cols; c++)
      if (boardState.owner[r][c] === owner) n++;
  return n;
}
function countRevealedTiles(boardState){
  if (!boardState) return 0;
  let n = 0;
  for (let r = 0; r < boardState.rows; r++)
    for (let c = 0; c < boardState.cols; c++)
      if (boardState.revealed[r][c]) n++;
  return n;
}

function mapRevealStats(){
  const mode = G.config.mode;
  if (mode === 'solo') return null;
  if (!G.board || !G.myBoard) return null;
  const total = Math.max(1, G.board.rows * G.board.cols);

  let mine, theirs;
  if (mode === 'duel'){
    mine   = countRevealedTiles(G.myBoard)    / total * 100;
    theirs = countRevealedTiles(G.theirBoard) / total * 100;
  } else {
    const c1 = countLand(G.myBoard, 1);
    const c2 = countLand(G.myBoard, 2);
    mine   = ((G.myOwner === 1) ? c1 : c2) / total * 100;
    theirs = ((G.myOwner === 1) ? c2 : c1) / total * 100;
  }
  return {
    mine:   clamp(mine, 0, 100),
    theirs: clamp(theirs, 0, 100)
  };
}

function canTouchTerritoryRaw(boardState, board, r, c, owner){
  if (!boardState || !boardState.owner || !board) return true;
  if (boardState.owner[r][c] === owner) return true;
  for (const [nr, nc] of board.neighbors(r, c, board.rows, board.cols)){
    if (boardState.owner[nr][nc] === owner) return true;
  }
  return false;
}
function canTouchTerritory(boardState, board, r, c, owner){
  if (G.territoryUnlocked) return true;
  return canTouchTerritoryRaw(boardState, board, r, c, owner);
}
function hasAvailableMove(boardState, board, owner){
  if (!boardState || !board || !boardState.owner) return true;
  for (let r = 0; r < board.rows; r++){
    for (let c = 0; c < board.cols; c++){
      if (boardState.revealed[r][c]) continue;
      if (boardState.flagged[r][c]) continue;
      if (canTouchTerritoryRaw(boardState, board, r, c, owner)) return true;
    }
  }
  return false;
}

function findSafeSwapTarget(board, boardState, r, c){
  const { rows, cols } = board;
  const candidates = [];
  for (let dr = -4; dr <= 4; dr++){
    for (let dc = -4; dc <= 4; dc++){
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      if (board.mines.has(nr + ',' + nc)) continue;
      if (boardState && boardState.revealed[nr][nc]) continue;
      candidates.push({ r: nr, c: nc });
    }
  }
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function ensureFirstDigSafe(board, boardState, playerState, r, c, syncNetwork){
  if (!playerState || playerState.digged) return false;
  playerState.digged = true;
  if (!board.mines.has(r + ',' + c)) return false;
  const swap = findSafeSwapTarget(board, boardState, r, c);
  if (!swap) return false;
  board.mines.delete(r + ',' + c);
  board.mines.add(swap.r + ',' + swap.c);
  recomputeAdjacency(board);
  if (syncNetwork) send({ t:'swapmine', r, c, sr: swap.r, sc: swap.c });
  return true;
}

/* ══════════════════════════════════════════════════════════════
   LOCAL ACTIONS
   ══════════════════════════════════════════════════════════════ */
function canAct(){
  return G.state === 'playing' && G.me && !G.me.done && performance.now() >= G.me.stunUntil;
}
function isFrozen(){ return G.me && performance.now() < G.me.stunUntil; }

let lastCursorSent = 0;
function sendCursor(){
  if (G.role === 'solo' || !G.conn) return;
  const now = performance.now();
  if (now - lastCursorSent < 110) return;
  lastCursorSent = now;
  send({ t:'cur', r: G.me.cursor.r, c: G.me.cursor.c });
}
function moveCursor(dr, dc){
  if (G.state !== 'playing' || !G.me || G.me.done) return;
  if (isFrozen()) return;
  const rows = G.board.rows, cols = G.board.cols;
  const nr = clamp(G.me.cursor.r + dr, 0, rows - 1);
  const nc = clamp(G.me.cursor.c + dc, 0, cols - 1);
  if (nr === G.me.cursor.r && nc === G.me.cursor.c) return;
  G.me.cursor = { r: nr, c: nc };
  sendCursor();
}
function localDigAt(r, c){ if (!canAct()) return; G.me.cursor = { r, c }; localDig(); }
function localFlagAt(r, c){ if (!canAct()) return; G.me.cursor = { r, c }; localFlag(); }
function localChordAt(r, c){ if (!canAct()) return; G.me.cursor = { r, c }; localChord(); }

let digBusy = false;

async function localDig(){
  if (!canAct()) return;
  if (digBusy) return;

  const r = G.me.cursor.r, c = G.me.cursor.c;
  const mode = G.config.mode;

  if (G.myBoard.flagged[r][c]){ localFlag(); return; }
  if (mode === 'territory' && !canTouchTerritory(G.myBoard, G.board, r, c, G.myOwner)) return;

  if (G.boardPending){
    digBusy = true;
    try {
      if (mode === 'solo' || mode === 'duel'){
        await ensureBoardReadyAsync(r, c);
        if (mode === 'duel' && !G.boardPending){
          send({ t:'layout', mines: Array.from(G.board.mines) });
        }
      } else if (G.role === 'host'){
        await ensureBoardReadyAsync(r, c);
        if (!G.boardPending){
          const op = G.boardOpening || { r: r, c: c };
          send({ t:'board', seed: G.boardSeed, clickR: op.r, clickC: op.c });
        }
      } else {
        send({ t:'dig', r: r, c: c });
        G.pendingDig = { r: r, c: c };
        return;
      }
    } finally {
      digBusy = false;
    }
    if (!canAct()) return;
  }
  doLocalDig(r, c);
}

function doLocalDig(r, c){
  const mode = G.config.mode;
  if (mode === 'coop' || mode === 'territory'){
    if (G.role === 'host') hostApplyDig(r, c, G.myOwner);
    else send({ t:'dig', r, c });
    return;
  }
  if (mode === 'duel'){
    const bs = G.myBoard;
    ensureFirstDigSafe(G.board, bs, G.me, r, c, true);
    const res = applyReveal(bs, G.board, r, c, 0);
    if (!res) return;
    if (res.type === 'mine'){
      G.me.hits++; G.deathTile = { r, c };
      send({ t:'hit', r, c });
      duelFreeze(r, c);
      return;
    }
    send({ t:'rev', tiles: res.tiles });
    afterRevealFeedback(res);
    if (checkWin(bs, G.board)) duelWin();
    return;
  }
  /* solo */
  const bs = G.myBoard;
  ensureFirstDigSafe(G.board, bs, G.me, r, c, false);
  const res = applyReveal(bs, G.board, r, c, 0);
  if (!res) return;
  if (res.type === 'mine'){
    G.me.hits++;
    handleLoss(r, c, G.viewMe, bs, G.board);
    return;
  }
  afterRevealFeedback(res);
  if (checkWin(bs, G.board)){
    G.me.done = true;
    endGame('win', '✨', 'CLEARED!', 'You swept every safe tile.', performance.now() - G.startTime);
  }
}
function afterRevealFeedback(res){
  if (!res || !res.tiles || res.tiles.length === 0) return;
  const r0 = res.tiles[0][0], c0 = res.tiles[0][1];
  const val = G.board.adj[r0][c0];
  SFX.reveal(val);
}
function handleLoss(r, c, view, bs, board){
  if (G.lossPending) return;
  G.lossPending = true; G.me.done = true;
  G.deathTile = { r, c };
  if (view){
    view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', 40, 280);
    view.boom(p.x, p.y, '#ffd166', 18, 150);
  }
  SFX.mine(); vibrate(180);
  revealAllMines(bs, board, r, c);
  const elapsed = performance.now() - G.startTime;
  setTimeout(() => {
    endGame('lose', '💥', 'BOOM!', 'You hit a mine. The field is lost.', elapsed);
    G.lossPending = false;
  }, 1000);
}
function handleCoopLoss(r, c, broadcast, iTriggered){
  if (iTriggered === undefined) iTriggered = true;
  if (G.lossPending) return;
  G.lossPending = true;
  if (G.me) G.me.done = true;
  G.deathTile = { r, c };
  const bs = G.myBoard;
  const view = G.viewMe;
  if (view){
    if (iTriggered) view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', 40, 280);
    view.boom(p.x, p.y, '#ffd166', 18, 150);
  }
  if (iTriggered){ SFX.mine(); vibrate(180); } else { SFX.oppStun(); }
  revealAllMines(bs, G.board, r, c);
  if (broadcast){
    send({ t:'delta', lose:true, r, c, by: iTriggered ? G.myOwner : G.theirOwner });
  }
  const elapsed = performance.now() - G.startTime;
  setTimeout(() => {
    endGame('lose', '💥', 'BOOM!', 'A mine was triggered. The field is lost.', elapsed);
    G.lossPending = false;
  }, 1000);
}
function duelFreeze(r, c){
  const now = performance.now();
  G.me.stunUntil = now + STUN_MS;
  G.me.wasStunned = true;
  G.me.stunReason = 'bomb';
  const view = G.viewMe;
  if (view){
    view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', 36, 260);
    view.boom(p.x, p.y, '#ffd166', 16, 140);
  }
  SFX.mine();
  setTimeout(() => SFX.freeze(), 150);
  vibrate(160);
}
function duelWin(){
  if (G.winSent) return;
  G.winSent = true; G.me.done = true;
  send({ t:'win' });
  const elapsed = performance.now() - G.startTime;
  endGame('win', '🏆', 'VICTORY!', 'You cleared your field first.', elapsed);
}
function applyPenalty(ownerId, reason){
  const now = performance.now();
  const r = reason || 'bomb';
  if (ownerId === G.myOwner){
    G.me.hits++;
    G.me.stunUntil = now + STUN_MS;
    G.me.wasStunned = true;
    G.me.stunReason = r;
    if (r === 'flag'){ SFX.freeze(); }
    else { SFX.mine(); setTimeout(() => SFX.freeze(), 150); }
    vibrate(160);
  } else if (G.them){
    G.them.hits++;
    G.them.stunUntil = now + STUN_MS;
    G.them.wasStunned = true;
    G.them.stunReason = r;
    SFX.oppStun();
  }
  send({ t:'stun', who: ownerId, reason: r });
}
function handleTerritoryBoom(r, c, owner){
  const bs = G.myBoard;
  const iTriggered = (owner === G.myOwner);
  if (iTriggered) G.deathTile = { r, c };
  if (bs){
    if (bs.owner) bs.owner[r][c] = owner;
    if (!bs.revealed[r][c]){
      bs.revealed[r][c] = true;
      bs.revealAt[r][c] = performance.now();
      bs.count++;
    }
  }
  applyPenalty(owner, 'bomb');
  const view = G.viewMe;
  if (view){
    if (iTriggered) view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', iTriggered ? 40 : 24, iTriggered ? 280 : 180);
    view.boom(p.x, p.y, '#ffd166', iTriggered ? 18 : 10, 140);
  }
  send({ t:'delta', mine:[r, c], own: owner, rev: [[r, c]] });
}
function afterSharedReveal(){
  if (G.config.mode === 'coop'){
    if (checkWin(G.myBoard, G.board)){
      send({ t:'win' });
      endGame('win', '🎉', 'FIELD CLEARED!', 'Together you swept every safe tile.', performance.now() - G.startTime);
    }
  } else if (G.config.mode === 'territory'){
    if (checkWin(G.myBoard, G.board)){ finishTerritory(false); return; }
    checkTerritoryUnlock();
  }
}

function finishTerritory(fromNetwork, land1, land2){
  if (G.state === 'over') return;
  if (!fromNetwork){
    const l1 = countLand(G.myBoard, 1);
    const l2 = countLand(G.myBoard, 2);
    if (G.role === 'host') send({ t:'terr_over', land1: l1, land2: l2 });
    land1 = l1; land2 = l2;
  } else if (G.role !== 'guest'){
    return;
  }
  endTerritoryScreen(land1 || 0, land2 || 0);
}

function endTerritoryScreen(land1, land2){
  if (G.state === 'over') return;
  const mine   = (G.myOwner === 1) ? land1 : land2;
  const theirs = (G.myOwner === 1) ? land2 : land1;
  const total  = Math.max(1, G.board ? (G.board.rows * G.board.cols) : (mine + theirs));
  const minePct   = (mine   / total * 100);
  const theirsPct = (theirs / total * 100);

  let result, icon, title, sub;
  if (mine > theirs){
    result = 'win';  icon = '🏆'; title = 'LAND GRAB WON!';
    sub = 'You claimed <b style="color:#4dd8ff">' + mine + '</b> tiles — opponent got <b style="color:#ff3d81">' + theirs + '</b>.';
  } else if (theirs > mine){
    result = 'lose'; icon = '💀'; title = 'LAND GRAB LOST';
    sub = 'Opponent claimed <b style="color:#ff3d81">' + theirs + '</b> tiles — you got <b style="color:#4dd8ff">' + mine + '</b>.';
  } else {
    result = 'draw'; icon = '🤝'; title = 'DEAD EVEN';
    sub = 'Both players claimed <b>' + mine + '</b> tiles.';
  }
  const cards =
    '<div class="statcard win"><div class="slabel">YOUR LAND</div><div class="sval">' + mine + '</div></div>' +
    '<div class="statcard lose"><div class="slabel">THEIR LAND</div><div class="sval">' + theirs + '</div></div>' +
    '<div class="statcard"><div class="slabel">YOU REVEALED</div><div class="sval">' + minePct.toFixed(0) + '%</div></div>' +
    '<div class="statcard"><div class="slabel">THEY REVEALED</div><div class="sval">' + theirsPct.toFixed(0) + '%</div></div>';
  const elapsed = performance.now() - G.startTime;

  if (G.config && elapsed > 0 && !isGuest){
    const partner = G.theirName || '';
    const iWon = (result === 'win');
    recordWin('territory', G.config.style, G.config.size,
              Math.max(1, Math.round(elapsed)), partner, iWon).catch(()=>{});
  }

  endGame(result, icon, title, sub, elapsed, cards, { skipRecord: true });
}

function localFlag(){
  if (!canAct()) return;
  const r = G.me.cursor.r, c = G.me.cursor.c;
  const bs = G.myBoard;
  if (bs.revealed[r][c]) return;
  const mode = G.config.mode;
  if (mode === 'territory'){
    if (!canTouchTerritory(bs, G.board, r, c, G.myOwner)) return;
    if (bs.flagged[r][c] && bs.owner[r][c] && bs.owner[r][c] !== G.myOwner){
      SFX.denied();
      return;
    }
    if (G.role === 'host') hostApplyTerritoryFlag(r, c, G.myOwner);
    else {
      bs.flagged[r][c] ? SFX.unflag() : SFX.flag();
      send({ t:'flag', r, c });
    }
    return;
  }
  if (mode === 'coop'){
    if (G.role === 'host') hostApplyFlag(r, c);
    else {
      bs.flagged[r][c] ? SFX.unflag() : SFX.flag();
      send({ t:'flag', r, c });
    }
    return;
  }
  const on = bs.flagged[r][c] ? 0 : 1;
  bs.flagged[r][c] = !!on;
  bs.flagAt[r][c] = performance.now();
  bs.flagCount += on ? 1 : -1;
  on ? SFX.flag() : SFX.unflag();
  if (mode === 'duel') send({ t:'flag', r, c, on });
}
function localChord(){
  if (!canAct()) return;
  const r = G.me.cursor.r, c = G.me.cursor.c;
  const mode = G.config.mode;
  if (mode === 'coop' || mode === 'territory'){
    if (mode === 'territory' && !canTouchTerritory(G.myBoard, G.board, r, c, G.myOwner)) return;
    if (G.role === 'host') hostApplyChord(r, c, G.myOwner);
    else send({ t:'chord', r, c });
    return;
  }
  if (mode === 'duel'){
    const bs = G.myBoard;
    const res = applyChord(bs, G.board, r, c, 0);
    if (!res) return;
    if (res.type === 'mine'){
      G.me.hits++;
      const mr = res.tiles[0][0], mc = res.tiles[0][1];
      G.deathTile = { r: mr, c: mc };
      send({ t:'hit', r: mr, c: mc });
      duelFreeze(mr, mc);
      return;
    }
    send({ t:'rev', tiles: res.tiles });
    afterRevealFeedback(res);
    if (checkWin(bs, G.board)) duelWin();
    return;
  }
  const bs = G.myBoard;
  const res = applyChord(bs, G.board, r, c, 0);
  if (!res) return;
  if (res.type === 'mine'){
    G.me.hits++;
    handleLoss(res.tiles[0][0], res.tiles[0][1], G.viewMe, bs, G.board);
    return;
  }
  afterRevealFeedback(res);
  if (checkWin(bs, G.board)){
    G.me.done = true;
    endGame('win', '✨', 'CLEARED!', 'You swept every safe tile.', performance.now() - G.startTime);
  }
}

/* ══════════════════════════════════════════════════════════════
   TERRITORY UNLOCK
   ══════════════════════════════════════════════════════════════ */
function checkTerritoryUnlock(){
  if (G.config.mode !== 'territory') return;
  if (G.territoryUnlocked) return;
  if (G.state !== 'playing') return;
  if (!G.myBoard || !G.board) return;
  const myBlocked    = !hasAvailableMove(G.myBoard, G.board, G.myOwner);
  const theirBlocked = !hasAvailableMove(G.myBoard, G.board, G.theirOwner);
  if (!myBlocked && !theirBlocked) return;
  G.territoryUnlocked = true;
  const byOwner = myBlocked ? G.myOwner : G.theirOwner;
  if (G.role === 'host' || G.role === 'solo') send({ t:'unlock', by: byOwner });
  showUnlockPopup(byOwner);
}
let lastUnlockCheck = 0;
function maybeCheckTerritoryUnlock(now){
  if (G.config.mode !== 'territory') return;
  if (G.state !== 'playing') return;
  if (G.territoryUnlocked) return;
  if (now - lastUnlockCheck < 250) return;
  lastUnlockCheck = now;
  checkTerritoryUnlock();
}
function showUnlockPopup(byOwner){
  const prev = document.querySelector('.terr-unlock');
  if (prev) prev.remove();
  const meBlocked = (byOwner === G.myOwner);
  const who = meBlocked
    ? '<b>You</b> have no legal moves left.'
    : '<i>Your opponent</i> has no legal moves left.';
  const el = document.createElement('div');
  el.className = 'terr-unlock';
  el.innerHTML =
    '<div class="terr-unlock-box">' +
      '<div class="terr-unlock-icon">🔓</div>' +
      '<div class="terr-unlock-title">TERRITORY OPENED</div>' +
      '<div class="terr-unlock-body">' + who +
        '<br>All remaining tiles can now be claimed by either player.' +
      '</div>' +
    '</div>';
  document.body.appendChild(el);
  SFX.unlock();
  vibrate([40, 60, 40]);
  setTimeout(() => {
    el.classList.add('fade');
    setTimeout(() => el.remove(), 700);
  }, 3600);
}

/* ══════════════════════════════════════════════════════════════
   HOST-AUTHORITATIVE SHARED ACTIONS
   ══════════════════════════════════════════════════════════════ */
function hostApplyDig(r, c, owner){
  if (G.state !== 'playing') return;
  const bs = G.myBoard;
  const isMyDig = (owner === G.myOwner);
  const who = isMyDig ? G.me : G.them;
  if (who && ensureFirstDigSafe(G.board, bs, who, r, c, true)){}
  if (bs.flagged[r][c]){
    if (G.config.mode === 'territory') hostApplyTerritoryFlag(r, c, owner);
    else hostApplyFlag(r, c);
    return;
  }
  const res = applyReveal(bs, G.board, r, c, owner);
  if (!res) return;
  if (res.type === 'mine'){
    if (G.config.mode === 'coop') handleCoopLoss(r, c, true, owner === G.myOwner);
    else handleTerritoryBoom(r, c, owner);
    return;
  }
  send({ t:'delta', rev: res.tiles, own: owner });
  afterRevealFeedback(res);
  afterSharedReveal();
}
function hostApplyFlag(r, c){
  if (G.state !== 'playing') return;
  const bs = G.myBoard;
  if (bs.revealed[r][c]) return;
  const on = bs.flagged[r][c] ? 0 : 1;
  bs.flagged[r][c] = !!on;
  bs.flagAt[r][c] = performance.now();
  bs.flagCount += on ? 1 : -1;
  send({ t:'delta', flg: [[r, c, on]] });
  on ? SFX.flag() : SFX.unflag();
}
function hostApplyTerritoryFlag(r, c, owner){
  if (G.state !== 'playing') return;
  const bs = G.myBoard;
  if (bs.revealed[r][c]) return;

  if (bs.flagged[r][c]){
    if (bs.owner && bs.owner[r][c] && bs.owner[r][c] !== owner){
      if (owner === G.myOwner) SFX.denied();
      return;
    }
    bs.flagged[r][c] = false;
    bs.flagAt[r][c] = performance.now();
    bs.flagCount = Math.max(0, bs.flagCount - 1);
    if (bs.owner && bs.owner[r][c] === owner) bs.owner[r][c] = 0;
    send({ t:'delta', flg: [[r, c, 0]], own: 0 });
    if (owner === G.myOwner) SFX.unflag();
    checkTerritoryUnlock();
    return;
  }

  const isMine = G.board.mines.has(r + ',' + c);
  if (isMine){
    bs.flagged[r][c] = true;
    bs.flagAt[r][c] = performance.now();
    bs.flagCount++;
    if (bs.owner) bs.owner[r][c] = owner;
    send({ t:'delta', flg: [[r, c, 1]], own: owner });
    if (owner === G.myOwner) SFX.flag();
    checkTerritoryUnlock();
  } else {
    bs.revealed[r][c] = true;
    bs.revealAt[r][c] = performance.now();
    if (bs.owner) bs.owner[r][c] = owner;
    bs.count++;
    bs.safeRevealed++;
    send({ t:'delta', rev: [[r, c]], own: owner });
    const view = G.viewMe;
    if (view){
      const p = hexOrSqCenter(view, r, c);
      if (owner === G.myOwner) view.triggerShake();
      view.boom(p.x, p.y, '#7fd8ff', 18, 160);
    }
    applyPenalty(owner, 'flag');
    if (checkWin(bs, G.board)){ finishTerritory(false); return; }
    checkTerritoryUnlock();
  }
}
function hostApplyChord(r, c, owner){
  if (G.state !== 'playing') return;
  const bs = G.myBoard;
  const res = applyChord(bs, G.board, r, c, owner);
  if (!res) return;
  if (res.type === 'mine'){
    const mr = res.tiles[0][0], mc = res.tiles[0][1];
    if (G.config.mode === 'coop') handleCoopLoss(mr, mc, true, owner === G.myOwner);
    else handleTerritoryBoom(mr, mc, owner);
    return;
  }
  send({ t:'delta', rev: res.tiles, own: owner });
  afterRevealFeedback(res);
  afterSharedReveal();
}

function hostEnsureBoardThen(r, c, action){
  if (!G.boardPending){ action(); return; }
  ensureBoardReadyAsync(r, c).then(() => {
    if (G.state !== 'playing' || G.boardPending) return;
    const op = G.boardOpening || { r: r, c: c };
    send({ t:'board', seed: G.boardSeed, clickR: op.r, clickC: op.c });
    action();
  }, () => {});
}

/* ══════════════════════════════════════════════════════════════
   NETWORK
   ══════════════════════════════════════════════════════════════ */
function send(msg){
  if (G.conn && G.conn.open){
    try { G.conn.send(msg); } catch(e){}
  }
}
let hbTimer = null;
function startHeartbeat(){
  stopHeartbeat();
  hbTimer = setInterval(() => {
    if (G.state === 'lobby' && !G.conn) return;
    if (!G.conn || !G.conn.open){ onConnClosed(); return; }
    if (G.lastRecv && (performance.now() - G.lastRecv) > HEARTBEAT_TIMEOUT){
      onConnClosed(); return;
    }
    send({ t:'ping' });
  }, HEARTBEAT_MS);
}
function stopHeartbeat(){ if (hbTimer){ clearInterval(hbTimer); hbTimer = null; } }

function onConnClosed(){
  stopHeartbeat();
  if (G.opponentGone) return;
  G.opponentGone = true;
  if (G.state === 'playing' || G.state === 'countdown'){
    endGame('disconnect', '🔌', 'OPPONENT DISCONNECTED',
            'Your opponent left the match.', performance.now() - G.startTime);
  } else if (G.state === 'over'){
    cleanupNet();
  } else {
    cleanupNet();
    idleOverlay();
  }
}
function attachConn(c){
  G.conn = c;
  G.lastRecv = performance.now();
  G.opponentGone = false;
  G.theirName = '';
  c.on('data', msg => { G.lastRecv = performance.now(); handleMessage(msg); });
  c.on('close', onConnClosed);
  c.on('error', () => {});
  startHeartbeat();
  const announce = () => {
    if (G.conn !== c) return;
    const nm = getPlayerName() || '';
    try { c.send({ t: 'name', name: nm }); } catch(e){}
  };
  if (c.open) announce();
  else c.on('open', announce);
}

function handleMessage(msg){
  if (!msg || typeof msg !== 'object') return;
  switch (msg.t){
    case 'ping': break;
    case 'bye': onConnClosed(); break;

    case 'name': {
      G.theirName = String(msg.name || '').slice(0, 32);
      updatePanelNames();
      break;
    }

    case 'seed': {
      G.config = msg.config || G.config;
      const seedHost  = (msg.seedHost  >>> 0) || newSeed();
      const seedGuest = (msg.seedGuest >>> 0) || newSeed();
      if (G.config.mode === 'duel') startMatch(seedGuest, 'guest', seedHost);
      else                          startMatch(seedHost,  'guest', seedHost);
      break;
    }

    case 'terr_board': {
      if (G.config.mode !== 'territory') break;
      if (G.role !== 'guest') break;
      if (!G.board) break;
      rebuildBoardFromMines(G.board, msg.mines || [], G.config.style);
      G.theirBoardLayout = G.board;
      if (!G.terrBoardReady){
        G.terrBoardReady = true;
        if (G.state === 'playing') revealTerritoryStart();
      }
      break;
    }

    case 'cur':
      if (G.them) G.them.cursor = { r: msg.r, c: msg.c };
      break;

    case 'layout':
      if (G.config.mode !== 'duel') break;
      if (!G.theirBoardLayout) break;
      rebuildBoardFromMines(G.theirBoardLayout, msg.mines || [], G.config.style);
      break;

    case 'board': {
      if (G.config.mode !== 'coop') break;
      if (!G.boardPending) break;
      const d = dimsFor(G.config);
      const nb = genBoardDeferred(msg.seed, G.config.style, d.cols, d.rows, d.mines,
                                  msg.clickR, msg.clickC,
                                  [{ r: (d.rows >> 1), c: (d.cols >> 1) }]);
      const wasAlias = (G.theirBoardLayout === G.board);
      G.board = nb;
      if (wasAlias) G.theirBoardLayout = nb;
      G.boardSeed = msg.seed;
      G.boardPending = false;
      G.boardOpening = { r: msg.clickR, c: msg.clickC };
      cancelPregen();
      if (G.pendingDig){
        const pd = G.pendingDig;
        G.pendingDig = null;
        G.me.cursor = { r: pd.r, c: pd.c };
        setTimeout(() => { if (G.state === 'playing') doLocalDig(pd.r, pd.c); }, 0);
      }
      break;
    }

    case 'dig': {
      if (G.role !== 'host') break;
      if (G.state !== 'playing') break;
      if (G.config.mode !== 'coop' && G.config.mode !== 'territory') break;
      if (performance.now() < G.them.stunUntil) break;
      if (G.config.mode === 'territory' &&
          !canTouchTerritory(G.myBoard, G.board, msg.r, msg.c, G.theirOwner)) break;
      const dr = msg.r, dc = msg.c;
      hostEnsureBoardThen(dr, dc, function(){ hostApplyDig(dr, dc, G.theirOwner); });
      break;
    }

    case 'flag':
      if (G.state !== 'playing') break;
      if (G.config.mode === 'coop'){
        if (G.role !== 'host') break;
        if (performance.now() < G.them.stunUntil) break;
        hostApplyFlag(msg.r, msg.c);
      } else if (G.config.mode === 'territory'){
        if (G.role !== 'host') break;
        if (performance.now() < G.them.stunUntil) break;
        if (!canTouchTerritory(G.myBoard, G.board, msg.r, msg.c, G.theirOwner)) break;
        hostApplyTerritoryFlag(msg.r, msg.c, G.theirOwner);
      } else if (G.config.mode === 'duel'){
        if (!G.theirBoard) break;
        const on = msg.on ? 1 : 0;
        if (G.theirBoard.flagged[msg.r][msg.c] !== !!on){
          G.theirBoard.flagged[msg.r][msg.c] = !!on;
          G.theirBoard.flagAt[msg.r][msg.c] = performance.now();
          G.theirBoard.flagCount += on ? 1 : -1;
        }
      }
      break;

    case 'chord': {
      if (G.role !== 'host') break;
      if (G.state !== 'playing') break;
      if (G.config.mode !== 'coop' && G.config.mode !== 'territory') break;
      if (performance.now() < G.them.stunUntil) break;
      if (G.config.mode === 'territory' &&
          !canTouchTerritory(G.myBoard, G.board, msg.r, msg.c, G.theirOwner)) break;
      const cr = msg.r, cc = msg.c;
      hostEnsureBoardThen(cr, cc, function(){ hostApplyChord(cr, cc, G.theirOwner); });
      break;
    }

    case 'rev':
      if (!G.theirBoard) break;
      {
        const now = performance.now();
        const layout = G.theirBoardLayout || G.board;
        for (const pair of (msg.tiles || [])){
          const r = pair[0], c = pair[1];
          if (G.theirBoard.revealed[r][c]) continue;
          G.theirBoard.revealed[r][c] = true;
          G.theirBoard.revealAt[r][c] = now + Math.random() * 80;
          G.theirBoard.count++;
          if (layout && !layout.mines.has(r + ',' + c)) G.theirBoard.safeRevealed++;
        }
      }
      break;

    case 'hit':
      if (G.them){
        G.them.hits++;
        G.them.stunUntil = performance.now() + STUN_MS;
        G.them.wasStunned = true;
        G.them.stunReason = 'bomb';
      }
      G.theirDeathTile = { r: msg.r, c: msg.c };
      if (G.theirBoard && msg.r !== undefined && msg.c !== undefined){
        const now = performance.now();
        if (!G.theirBoard.revealed[msg.r][msg.c]){
          G.theirBoard.revealed[msg.r][msg.c] = true;
          G.theirBoard.revealAt[msg.r][msg.c] = now;
          G.theirBoard.count++;
        }
      }
      if (G.viewThem) G.viewThem.triggerShake();
      SFX.oppStun();
      break;

    case 'swapmine': {
      const layout = (G.config.mode === 'duel') ? G.theirBoardLayout : G.board;
      if (!layout) break;
      if (layout.mines.has(msg.r + ',' + msg.c)){
        layout.mines.delete(msg.r + ',' + msg.c);
        layout.mines.add(msg.sr + ',' + msg.sc);
        recomputeAdjacency(layout);
      }
      break;
    }

    case 'delta': applyDelta(msg); break;

    case 'unlock':
      if (G.config.mode === 'territory' && !G.territoryUnlocked){
        G.territoryUnlocked = true;
        showUnlockPopup(msg.by === undefined ? G.theirOwner : msg.by);
      }
      break;

    case 'terr_over':
      if (G.config.mode === 'territory'){
        finishTerritory(true, msg.land1 || 0, msg.land2 || 0);
      }
      break;

    case 'stun': {
      const now = performance.now();
      const reason = msg.reason || 'bomb';
      if (msg.who === G.myOwner){
        G.me.hits++;
        G.me.stunUntil = now + STUN_MS;
        G.me.wasStunned = true;
        G.me.stunReason = reason;
        if (reason === 'flag'){ SFX.freeze(); }
        else { SFX.mine(); setTimeout(() => SFX.freeze(), 150); }
        vibrate(160);
      } else if (G.them){
        G.them.hits++;
        G.them.stunUntil = now + STUN_MS;
        G.them.wasStunned = true;
        G.them.stunReason = reason;
        SFX.oppStun();
      }
      break;
    }

    case 'win':
      if (G.state === 'playing' || G.state === 'countdown'){
        if (G.config.mode === 'coop'){
          endGame('win', '🎉', 'FIELD CLEARED!',
            'Together you swept every safe tile.',
            performance.now() - G.startTime);
        } else {
          endGame('lose', '💀', 'DEFEATED',
            'Your opponent cleared their field first.',
            performance.now() - G.startTime);
        }
      }
      break;

    case 'lose':
      if (G.state === 'playing' || G.state === 'countdown'){
        endGame('win', '🏆', 'VICTORY!',
          'Your opponent triggered a mine.',
          performance.now() - G.startTime);
      }
      break;
  }
}

function applyDelta(msg){
  const bs = G.myBoard;
  if (!bs || !G.board) return;
  const now = performance.now();
  if (msg.rev){
    for (const pair of msg.rev){
      const r = pair[0], c = pair[1];
      if (bs.revealed[r][c]) continue;
      bs.revealed[r][c] = true;
      bs.revealAt[r][c] = now + Math.random() * 70;
      bs.count++;
      if (!G.board.mines.has(r + ',' + c)) bs.safeRevealed++;
      if (msg.own !== undefined && bs.owner) bs.owner[r][c] = msg.own ? msg.own : 0;
    }
  }
  if (msg.flg){
    for (const tri of msg.flg){
      const r = tri[0], c = tri[1], on = tri[2];
      const wasOn = bs.flagged[r][c] ? 1 : 0;
      bs.flagged[r][c] = !!on;
      bs.flagAt[r][c] = now;
      bs.flagCount += on - wasOn;
      if (bs.owner){
        if (on && msg.own !== undefined) bs.owner[r][c] = msg.own ? msg.own : 0;
        else if (!on) bs.owner[r][c] = 0;
      }
    }
  }
  if (msg.mine && bs.owner){
    const r = msg.mine[0], c = msg.mine[1];
    bs.owner[r][c] = (msg.own !== undefined) ? msg.own : 0;
  }
  if (msg.lose){
    handleCoopLoss(msg.r, msg.c, false, msg.by === G.myOwner);
  }
}

      '<input id="nameInput" class="name-input" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false" value="' + escapeHtml(currentName) + '">' +

        : '') +
      '<div class="err" id="nameErr"></div>' +

  );

  const input = overlay.querySelector('#nameInput');
  const errEl = overlay.querySelector('#nameErr');
  const btnSubmit = overlay.querySelector('#btnSubmitName');
  const btnCancel = overlay.querySelector('#btnCancelName');
  const btnGuest  = overlay.querySelector('#btnGuest');

  if (input){ input.focus(); input.select(); }

  const finish = (name) => {
    if (opts.onSuccess) opts.onSuccess(name);
  };

  const submit = async () => {
    if (!errEl || !btnSubmit) return;
    errEl.textContent = '';
    btnSubmit.disabled = true;
    const raw = input ? input.value : '';

    const v = validateName(raw);
    if (v.error){
      errEl.textContent = v.error;
      btnSubmit.disabled = false;
      return;

    try {
      await registerName(raw, isChange);
      isGuest = false;
      finish(v.name);
    } catch(e){
      errEl.textContent = firebaseErrorMessage(e);
      btnSubmit.disabled = false;
    }
  };

  if (btnSubmit) btnSubmit.onclick = submit;
  if (btnCancel) btnCancel.onclick = () => {
    if (opts.onCancel) opts.onCancel();
    else { menuView = 'main'; renderMenu(''); }
  };
  if (btnGuest) btnGuest.onclick = () => {
    isGuest = true;
    if (opts.onGuest) opts.onGuest();
    else { menuView = 'main'; renderMenu(''); refreshLeaderboard(true); }
  };
  if (input) input.onkeydown = e => {
    if (e.key === 'Enter') submit();
    if (e.key === 'Escape' && btnCancel) btnCancel.click();
  };
}

/* ══════════════════════════════════════════════════════════════
   LINKING — FIREBASE RELAY (no WebRTC)
   ══════════════════════════════════════════════════════════════
   The old link flow used a PeerJS data channel. That works fine
   between two computers on the same LAN but breaks the moment one
   side is a phone on a different network. The linking handshake
   is tiny (a name + a key), so we route it through Firestore
   instead. No WebRTC, no ICE, no TURN, no in-app browser
   restrictions — it just works everywhere Firebase is reachable.
*/
let linkUnsub = null;

function cleanupLinkPeer(){
  if (linkUnsub){ try { linkUnsub(); } catch(e){} linkUnsub = null; }
}

function startLinking(){
  if (!db || !auth){
    menuError = 'Linking requires an online connection.';
    menuView = 'main';
    renderMenu(menuError);
    return;
  }
  const name = getPlayerName();
  const key = getPlayerNameKey();
  if (!name || !key){
    menuError = 'Set a name first.';
    menuView = 'main';
    renderMenu(menuError);
    return;
  }
  const proceed = (user) => {
    if (!user){
      menuError = 'Still connecting — try again in a moment.';
      menuView = 'main';
      renderMenu(menuError);
      return;
    }
    db.collection('names').doc(key).get().then(snap => {
      if (!snap.exists){
        menuError = 'Your name is no longer reserved. Please set it again.';
        menuView = 'main';
        renderMenu(menuError);
        return;
      }
      const nd = snap.data() || {};
      const uids = nd.linkedUids || [];
      if (uids.indexOf(user.uid) === -1){
        menuError = 'Your name is not linked to this browser.';
        menuView = 'main';
        renderMenu(menuError);
        return;
      }
      doStartLinking(name, key, user.uid);
    }).catch(err => {
      menuError = 'Could not verify name: ' + firebaseErrorMessage(err);
      menuView = 'main';
      renderMenu(menuError);
    });
  };
  if (auth.currentUser) proceed(auth.currentUser);
  else trySignIn().then(proceed);
}

function doStartLinking(name, key, hostUid){
  const code = makeCode();
  const codeEl = overlay.querySelector('#linkCode');
  const statusEl = overlay.querySelector('#linkStatus');
  if (codeEl){
    codeEl.textContent = code;
    codeEl.onclick = () => {
      SFX.clickSoft();
      copyToClipboard(code).then(ok => {
        codeEl.textContent = ok ? 'COPIED' : code;
        setTimeout(() => { codeEl.textContent = code; }, 900);
      });
    };
  }
  if (statusEl) statusEl.innerHTML = '<span class="spin"></span>Publishing code…';

  cleanupLinkPeer();

  const ref = db.collection('linkCodes').doc(code);
  let cancelled = false;

  const cleanup = () => {
    if (cancelled) return;
    cancelled = true;
    if (linkUnsub){ try { linkUnsub(); } catch(e){} linkUnsub = null; }
    ref.delete().catch(() => {});
  };

  ref.set({
    hostUid: hostUid,
    hostName: name,
    hostNameKey: key,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    status: 'waiting'
  }).then(() => {
    if (cancelled) return;
    if (statusEl) statusEl.innerHTML = '<span class="spin"></span>Waiting for other device…';

    linkUnsub = ref.onSnapshot(snap => {
      if (!snap.exists) return;
      const data = snap.data() || {};
      if (data.status === 'done'){
        if (statusEl) statusEl.innerHTML = '✅ Linked successfully!';
        SFX.win();
        setTimeout(() => {
          cleanup();
          menuView = 'main';
          renderMenu('');
          refreshLeaderboard(true);
        }, 1200);
      } else if (data.status === 'error'){
        if (statusEl) statusEl.textContent = '❌ ' + (data.error || 'Failed');
      }
    });
  }).catch(err => {
    if (statusEl) statusEl.textContent = 'Error: ' + firebaseErrorMessage(err);
  });

  const cancel = overlay.querySelector('#btnCancelLink');
  if (cancel) cancel.onclick = () => {
    cleanup();
    menuView = 'main';
    renderMenu('');
  };
}

      b.onclick = () => {
        hotkeyCapture = b.dataset.hk;
        menuError = '';
        renderMenu();
      };
    });
    const back = overlay.querySelector('#btnBackMenu');
    if (back) back.onclick = () => { hotkeyCapture = null; menuView = 'main'; renderMenu(''); };
    const rst = overlay.querySelector('#btnResetHk');
    if (rst) rst.onclick = () => {
      resetHotkeys();
      hotkeyCapture = null;
      menuError = '';
      renderMenu();
    };
    return;
  }

  if (menuView === 'howto'){
    showOverlay(howToHTML());
    const back = overlay.querySelector('#btnBackMenu');
    if (back) back.onclick = () => { menuView = 'main'; menuError = ''; renderMenu(); };
    return;
  }

  if (menuView === 'name'){
    showOverlay(nameMenuHTML());
    const btnChange = overlay.querySelector('#btnChangeName');
    if (btnChange) btnChange.onclick = () => {
      showNameEntryPopup({
        isChange: true,
        currentName: getPlayerName(),
        onSuccess: () => {
          menuView = 'main';
          renderMenu('');
          refreshLeaderboard(true);
        },
        onCancel: () => { menuView = 'main'; renderMenu(''); }
      });
    };
    const btnLink = overlay.querySelector('#btnLinkName');
    if (btnLink) btnLink.onclick = () => {
      menuView = 'link';
      menuError = '';
      renderMenu('');
    };

    const btnRemove = overlay.querySelector('#btnRemoveName');
    if (btnRemove) btnRemove.onclick = async () => {
      const ok = await confirmDialog({
        title: 'REMOVE YOUR NAME?',

          'This will release <b style="color:#4dd8ff">' + escapeHtml(getPlayerName() || '') + '</b> from this browser, ' +

          'You will be asked to pick a new name afterwards. This cannot be undone.',

      });

  G.pendingDig = null;
  G.me = null; G.them = null;
  G.theirName = '';
  G.viewMe = null; G.viewThem = null;
  G.panelMe = null; G.panelThem = null;
  G.lossPending = false;
  G.winSent = false;
  G.opponentGone = false;
  G.lastRecv = 0;
  G.deathTile = null;
  G.theirDeathTile = null;
  G.territoryUnlocked = false;
  G.terrBoardReady = true;
  G.reviewViews = [];

}
