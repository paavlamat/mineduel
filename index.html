function applyReveal(boardState, board, r, c, owner){
  owner = owner || 0;
  if (boardState.revealed[r][c]) return null;
  /* Flagged tiles are protected: only the flag action may remove a
     flag, so digging never silently clears one. */
  if (boardState.flagged[r][c]) return null;
  if (boardState.fakeFlag) boardState.fakeFlag[r][c] = false;
  if (board.mines.has(r + ',' + c)){
    boardState.revealed[r][c] = true;
    boardState.revealAt[r][c] = performance.now();
    if (boardState.owner) boardState.owner[r][c] = 0;
    boardState.count++;
    return { type: 'mine', tiles: [[r, c]] };
  }
  const now = performance.now();
  const queue = [[r, c, 0]];
  const seen = new Set([r + ',' + c]);
  const tiles = [];
  while (queue.length){
    const item = queue.shift();
    const cr = item[0], cc = item[1], d = item[2];
    if (boardState.revealed[cr][cc]) continue;
    /* Leave flagged tiles (and their surroundings) untouched. */
    if (boardState.flagged[cr][cc]) continue;
    if (boardState.fakeFlag) boardState.fakeFlag[cr][cc] = false;
    boardState.revealed[cr][cc] = true;
    if (owner && boardState.owner) boardState.owner[cr][cc] = owner;
    boardState.revealAt[cr][cc] = now + Math.min(d, 14) * 24;
    boardState.count++;
    boardState.safeRevealed++;
    tiles.push([cr, cc]);
    if (board.adj[cr][cc] === 0){
      for (const nb of board.neighbors(cr, cc, board.rows, board.cols)){
        const nr = nb[0], nc = nb[1];
        const k = nr + ',' + nc;
        if (!seen.has(k) && !boardState.revealed[nr][nc]){
          seen.add(k);
          queue.push([nr, nc, d + 1]);
        }
      }
    }
  }
  return { type: 'ok', tiles };
}

function applyChord(boardState, board, r, c, owner){
  if (!boardState.revealed[r][c]) return null;
  if (board.adj[r][c] <= 0) return null;
  const nbs = board.neighbors(r, c, board.rows, board.cols);
  let flags = 0;
  for (const nb of nbs){
    const nr = nb[0], nc = nb[1];
    if (boardState.flagged[nr][nc]) flags++;
    else if (boardState.revealed[nr][nc] && board.mines.has(nr + ',' + nc)) flags++;
  }
  if (flags !== board.adj[r][c]) return null;
  for (const nb of nbs){
    const nr = nb[0], nc = nb[1];
    if (boardState.flagged[nr][nc] || boardState.revealed[nr][nc]) continue;
    if (board.mines.has(nr + ',' + nc)){
      const res = applyReveal(boardState, board, nr, nc, owner);
      return { type: 'mine', tiles: res ? res.tiles : [[nr, nc]] };
    }
  }
  const allTiles = [];
  for (const nb of nbs){
    const nr = nb[0], nc = nb[1];
    if (boardState.flagged[nr][nc] || boardState.revealed[nr][nc]) continue;
    const res = applyReveal(boardState, board, nr, nc, owner);
    if (res && res.tiles) allTiles.push.apply(allTiles, res.tiles);
  }
  return { type: 'ok', tiles: allTiles };
}

function revealAllMines(boardState, board, originR, originC){
  const now = performance.now();
  const R = board.infinite ? INFINITE_REVEAL_RADIUS : Infinity;
  const r0 = Math.max(0, originR - R);
  const r1 = Math.min(board.rows - 1, originR + R);
  const c0 = Math.max(0, originC - R);
  const c1 = Math.min(board.cols - 1, originC + R);
  for (let r = r0; r <= r1; r++){
    for (let c = c0; c <= c1; c++){
      if (!board.mines.has(r + ',' + c)) continue;
      if (boardState.revealed[r][c] || boardState.flagged[r][c]) continue;
      const d = Math.hypot(r - originR, c - originC);
      boardState.revealed[r][c] = true;
      if (boardState.owner) boardState.owner[r][c] = 0;
      if (boardState.fakeFlag) boardState.fakeFlag[r][c] = false;
      boardState.revealAt[r][c] = now + d * 35;
    }
  }
}
function checkWin(boardState, board){ return boardState.safeRevealed >= board.safeCount; }
function countLand(boardState, owner){
  let n = 0;
  if (!boardState.owner) return 0;
  for (let r = 0; r < boardState.rows; r++)
    for (let c = 0; c < boardState.cols; c++)
      if (boardState.owner[r][c] === owner) n++;
  return n;
}
function countRealLand(boardState, owner){
  let n = 0;
  if (!boardState.owner) return 0;
  for (let r = 0; r < boardState.rows; r++){
    for (let c = 0; c < boardState.cols; c++){
      if (boardState.owner[r][c] !== owner) continue;
      if (boardState.fakeFlag && boardState.fakeFlag[r][c]) continue;
      n++;
    }
  }
  return n;
}
function countRevealedBy(boardState, owner){
  let n = 0;
  if (!boardState.owner) return 0;
  for (let r = 0; r < boardState.rows; r++)
    for (let c = 0; c < boardState.cols; c++)
      if (boardState.owner[r][c] === owner && boardState.revealed[r][c]) n++;
  return n;
}

function mapRevealStats(){
  const mode = G.config.mode;
  if (mode === 'solo') return null;
  if (!G.board || !G.myBoard) return null;

  if (mode === 'duel'){
    const myTotal = Math.max(1, G.board.safeCount || 0);
    const mine = clamp((G.myBoard.safeRevealed || 0) / myTotal * 100, 0, 100);

    const theirLayout = G.theirBoardLayout || G.board;
    const theirTotal = Math.max(1, (theirLayout && theirLayout.safeCount) || myTotal);
    const theirRevealed = G.theirBoard ? (G.theirBoard.safeRevealed || 0) : 0;
    const theirs = clamp(theirRevealed / theirTotal * 100, 0, 100);

    return { mine, theirs };
  }

  const safeTotal = Math.max(1, G.board.safeCount || (G.board.rows * G.board.cols));
  const c1 = countRevealedBy(G.myBoard, 1);
  const c2 = countRevealedBy(G.myBoard, 2);
  return {
    mine:   clamp(((G.myOwner === 1) ? c1 : c2) / safeTotal * 100, 0, 100),
    theirs: clamp(((G.myOwner === 1) ? c2 : c1) / safeTotal * 100, 0, 100)
  };
}

function canTouchTerritoryRaw(boardState, board, r, c, owner){
  if (!boardState || !boardState.owner || !board) return true;
  if (boardState.flagged && boardState.flagged[r][c] &&
      boardState.fakeFlag && boardState.fakeFlag[r][c] &&
      boardState.owner[r][c] && boardState.owner[r][c] !== owner){
    return true;
  }
  if (boardState.owner[r][c] === owner) return true;
  for (const [nr, nc] of board.neighbors(r, c, board.rows, board.cols)){
    if (boardState.owner[nr][nc] === owner) return true;
  }
  return false;
}
function canTouchTerritory(boardState, board, r, c, owner){
  if (G.territoryUnlocked) return true;
  return canTouchTerritoryRaw(boardState, board, r, c, owner);
}
function hasAvailableMove(boardState, board, owner){
  if (!boardState || !board || !boardState.owner) return true;
  for (let r = 0; r < board.rows; r++){
    for (let c = 0; c < board.cols; c++){
      if (boardState.revealed[r][c]) continue;
      if (boardState.flagged[r][c]){
        const flagOwner = boardState.owner[r][c];
        const isFake = boardState.fakeFlag && boardState.fakeFlag[r][c];
        if (!(isFake && flagOwner && flagOwner !== owner)) continue;
      }
      if (canTouchTerritoryRaw(boardState, board, r, c, owner)) return true;
    }
  }
  return false;
}

function findSafeSwapTargetExcluding(board, boardState, r, c, excludeSet){
  const { rows, cols } = board;
  let candidates = [];
  const radii = [4, 3, 2, 1];
  for (const R of radii){
    candidates = [];
    for (let dr = -R; dr <= R; dr++){
      for (let dc = -R; dc <= R; dc++){
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        if (board.mines.has(nr + ',' + nc)) continue;
        if (excludeSet && excludeSet.has(nr + ',' + nc)) continue;
        if (boardState && boardState.revealed[nr][nc]) continue;
        candidates.push({ r: nr, c: nc });
      }
    }
    if (candidates.length) break;
  }
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function ensureFirstDigSafe(board, boardState, playerState, r, c, syncNetwork){
  if (!playerState || playerState.digged) return false;
  playerState.digged = true;

  /* Collect every mine in the 3×3 window around the click (including
     the clicked tile itself), remove them ALL, then place them back
     at safe tiles that are OUTSIDE that window.  The old approach
     swapped one mine at a time and could swap a neighbour's mine
     right back onto the clicked tile, leaving the click as a mine
     and the first reveal stuck at one tile. */
  const cleared = [];
  if (board.mines.has(r + ',' + c)) cleared.push([r, c]);
  for (const [nr, nc] of board.neighbors(r, c, board.rows, board.cols)){
    if (board.mines.has(nr + ',' + nc)) cleared.push([nr, nc]);
  }
  if (!cleared.length) return false;

  /* Never re-mine inside the click's 1-ring. */
  const excl = new Set();
  excl.add(r + ',' + c);
  for (const [nr, nc] of board.neighbors(r, c, board.rows, board.cols)){
    excl.add(nr + ',' + nc);
  }

  for (const [mr, mc] of cleared){
    board.mines.delete(mr + ',' + mc);
  }

  const swaps = [];
  for (const [mr, mc] of cleared){
    const swap = findSafeSwapTargetExcluding(board, boardState, mr, mc, excl);
    if (swap){
      board.mines.add(swap.r + ',' + swap.c);
      excl.add(swap.r + ',' + swap.c);
      swaps.push({ fr: mr, fc: mc, sr: swap.r, sc: swap.c });
    }
  }

  recomputeAdjacency(board);
  if (syncNetwork){
    for (const sw of swaps){
      send({ t:'swapmine', r: sw.fr, c: sw.fc, sr: sw.sr, sc: sw.sc });
    }
  }
  return swaps.length > 0;
}

function canAct(){
  return G.state === 'playing' && G.me && !G.me.done && performance.now() >= G.me.stunUntil;
}
function isFrozen(){ return G.me && performance.now() < G.me.stunUntil; }

let lastCursorSent = 0;
function sendCursor(){
  if (G.role === 'solo' || !G.conn) return;
  const now = performance.now();
  if (now - lastCursorSent < 110) return;
  lastCursorSent = now;
  send({ t:'cur', r: G.me.cursor.r, c: G.me.cursor.c });
}
let cursorActiveUntil = 0;
function moveCursor(dr, dc){
  if (G.state !== 'playing' || !G.me || G.me.done) return;
  if (isFrozen()) return;
  const rows = G.board.rows, cols = G.board.cols;
  const nr = clamp(G.me.cursor.r + dr, 0, rows - 1);
  const nc = clamp(G.me.cursor.c + dc, 0, cols - 1);
  if (nr === G.me.cursor.r && nc === G.me.cursor.c) return;
  G.me.cursor = { r: nr, c: nc };
  cursorActiveUntil = performance.now() + 1200;
  sendCursor();
}
function localDigAt(r, c){ if (!canAct()) return; G.me.cursor = { r, c }; localDig(); }
function localFlagAt(r, c){ if (!canAct()) return; G.me.cursor = { r, c }; localFlag(); }

let digBusy = false;

async function localDig(){
  if (!canAct()) return;
  if (digBusy) return;

  const r = G.me.cursor.r, c = G.me.cursor.c;
  const mode = G.config.mode;

  /* A flagged tile can only be cleared with the flag action
     (right-click / long-press) — left-clicking it does nothing. */
  if (G.myBoard.flagged[r][c]) return;
  if (mode === 'territory' && !canTouchTerritory(G.myBoard, G.board, r, c, G.myOwner)) return;

  if (G.boardPending){
    digBusy = true;
    try {
      if (mode === 'solo' || mode === 'duel'){
        await ensureBoardReadyAsync(r, c);
        if (mode === 'duel' && !G.boardPending){
          send({ t:'layout', mines: Array.from(G.board.mines) });
        }
      } else if (G.role === 'host'){
        await ensureBoardReadyAsync(r, c);
        sendBoardToGuest();
      } else {
        G.pendingPreSnap = snapshotBoardState(G.myBoard);
        send({ t:'dig', r: r, c: c });
        G.pendingDig = { r: r, c: c };
        return;
      }
    } finally {
      digBusy = false;
    }
    if (!canAct()) return;
  }
  doLocalDig(r, c);
}

function doLocalDig(r, c){
  const mode = G.config.mode;
  const insta = !!G.config.insta;
  const isInf = isInfiniteSize(G.config.size);

  /* Never dig a flagged tile — flags must be removed explicitly. */
  if (G.myBoard && G.myBoard.flagged[r][c]) return;

  if (mode === 'coop' || mode === 'territory'){
    if (G.role === 'host') hostApplyDig(r, c, G.myOwner);
    else {
      G.pendingPreSnap = snapshotBoardState(G.myBoard);
      send({ t:'dig', r, c });
    }
    return;
  }
  if (mode === 'duel'){
    const bs = G.myBoard;
    ensureFirstDigSafe(G.board, bs, G.me, r, c, true);
    const preSnap = snapshotBoardState(bs);
    const res = applyReveal(bs, G.board, r, c, 0);
    if (!res) return;
    if (res.type === 'mine'){
      G.me.hits++; G.deathTile = { r, c };
      G.lossHintMe = computeHintForBoard(G.board, preSnap, null, false, r, c);
      send({ t:'hit', r, c });

      if (insta){
        send({ t:'lose' });
        revealAllMines(bs, G.board, r, c);
        const view = G.viewMe;
        if (view){
          view.triggerShake();
          const p = hexOrSqCenter(view, r, c);
          view.boom(p.x, p.y, '#ff4d6d', 44, 300);
          view.boom(p.x, p.y, '#ffd166', 20, 160);
        }
        SFX.mine(); vibrate(220);
        const elapsed = performance.now() - G.startTime;
        setTimeout(() => {
          endGame('lose', '💀', 'BOOM!', 'You hit a mine. Instant defeat.', elapsed);
        }, 1000);
        return;
      }

      duelFreeze(r, c);
      return;
    }
    send({ t:'rev', tiles: res.tiles });
    afterRevealFeedback(res);
    if (checkWin(bs, G.board)) duelWin();
    return;
  }
  const bs = G.myBoard;
  ensureFirstDigSafe(G.board, bs, G.me, r, c, false);
  const preSnap = snapshotBoardState(bs);
  const res = applyReveal(bs, G.board, r, c, 0);
  if (!res) return;
  if (res.type === 'mine'){
    G.me.hits++;
    if (!isInf) G.lossHintMe = computeHintForBoard(G.board, preSnap, null, false, r, c);
    handleLoss(r, c, G.viewMe, bs, G.board);
    return;
  }
  afterRevealFeedback(res);
  if (!isInf && checkWin(bs, G.board)){
    G.me.done = true;
    endGame('win', '✨', 'CLEARED!', 'You swept every safe tile.', performance.now() - G.startTime);
  }
}
function afterRevealFeedback(res){
  if (!res || !res.tiles || res.tiles.length === 0) return;
  const r0 = res.tiles[0][0], c0 = res.tiles[0][1];
  const val = G.board.adj[r0][c0];
  SFX.reveal(val);
}
function handleLoss(r, c, view, bs, board){
  if (G.lossPending) return;
  G.lossPending = true; G.me.done = true;
  G.deathTile = { r, c };
  if (view){
    view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', 40, 280);
    view.boom(p.x, p.y, '#ffd166', 18, 150);
  }
  SFX.mine(); vibrate(180);
  /* Reveal mines centred on the actual bomb position, not the cursor. */
  revealAllMines(bs, board, r, c);
  const elapsed = performance.now() - G.startTime;
  setTimeout(() => {
    endGame('lose', '💥', 'BOOM!', 'You hit a mine. The field is lost.', elapsed);
    G.lossPending = false;
  }, 1000);
}
function handleCoopLoss(r, c, broadcast, iTriggered){
  if (iTriggered === undefined) iTriggered = true;
  if (G.lossPending) return;
  G.lossPending = true;
  if (G.me) G.me.done = true;
  G.deathTile = { r, c };
  const bs = G.myBoard;
  const view = G.viewMe;
  if (view){
    if (iTriggered) view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', 40, 280);
    view.boom(p.x, p.y, '#ffd166', 18, 150);
  }
  if (iTriggered){ SFX.mine(); vibrate(180); } else { SFX.oppStun(); }
  /* Reveal centred on bomb position, not cursor. */
  revealAllMines(bs, G.board, r, c);
  if (broadcast){
    send({ t:'delta', lose:true, r, c, by: iTriggered ? G.myOwner : G.theirOwner });
  }
  const elapsed = performance.now() - G.startTime;
  setTimeout(() => {
    endGame('lose', '💥', 'BOOM!', 'A mine was triggered. The field is lost.', elapsed);
    G.lossPending = false;
  }, 1000);
}
function duelFreeze(r, c){
  const now = performance.now();
  G.me.stunUntil = now + STUN_MS;
  G.me.wasStunned = true;
  G.me.stunReason = 'bomb';
  const view = G.viewMe;
  if (view){
    view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', 36, 260);
    view.boom(p.x, p.y, '#ffd166', 16, 140);
  }
  SFX.mine();
  setTimeout(() => SFX.freeze(), 150);
  vibrate(160);
}
function duelWin(){
  if (G.winSent) return;
  G.winSent = true; G.me.done = true;
  send({ t:'win' });
  const elapsed = performance.now() - G.startTime;
  endGame('win', '🏆', 'VICTORY!', 'You cleared your field first.', elapsed);
}
function applyPenalty(ownerId, reason){
  const now = performance.now();
  const r = reason || 'bomb';
  if (ownerId === G.myOwner){
    G.me.hits++;
    G.me.stunUntil = now + STUN_MS;
    G.me.wasStunned = true;
    G.me.stunReason = r;
    if (r === 'flag'){ SFX.freeze(); }
    else { SFX.mine(); setTimeout(() => SFX.freeze(), 150); }
    vibrate(160);
  } else if (G.them){
    G.them.hits++;
    G.them.stunUntil = now + STUN_MS;
    G.them.wasStunned = true;
    G.them.stunReason = r;
    SFX.oppStun();
  }
  send({ t:'stun', who: ownerId, reason: r });
}
function handleTerritoryBoom(r, c, owner){
  const bs = G.myBoard;
  const iTriggered = (owner === G.myOwner);
  if (iTriggered) G.deathTile = { r, c };
  if (bs){
    if (bs.owner) bs.owner[r][c] = owner;
    if (bs.fakeFlag) bs.fakeFlag[r][c] = false;
    if (!bs.revealed[r][c]){
      bs.revealed[r][c] = true;
      bs.revealAt[r][c] = performance.now();
      bs.count++;
    }
  }

  const view = G.viewMe;
  if (view){
    if (iTriggered) view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', iTriggered ? 40 : 24, iTriggered ? 280 : 180);
    view.boom(p.x, p.y, '#ffd166', iTriggered ? 18 : 10, 140);
  }

  const hintPayload = {};
  if (G.lossHintMe)   hintPayload[G.myOwner]    = serializeHint(G.lossHintMe);
  if (G.lossHintThem) hintPayload[G.theirOwner] = serializeHint(G.lossHintThem);

  const deltaMsg = {
    t:'delta', mine:[r, c], own: owner, rev: [[r, c]],
    hints: (Object.keys(hintPayload).length ? hintPayload : undefined)
  };

  if (G.config.insta){
    send(deltaMsg);
    const elapsed = performance.now() - G.startTime;
    if (iTriggered){
      SFX.mine(); vibrate(220);
      revealAllMines(bs, G.board, r, c);
      send({ t:'lose' });
      setTimeout(() => {
        endGame('lose', '💀', 'BOOM!', 'You hit a mine. Instant defeat.', elapsed);
      }, 1000);
    } else {
      SFX.oppStun();
      revealAllMines(bs, G.board, r, c);
      send({ t:'win' });
      setTimeout(() => {
        endGame('win', '🏆', 'VICTORY!', 'Your opponent hit a mine.', elapsed);
      }, 1000);
    }
    return;
  }

  applyPenalty(owner, 'bomb');
  send(deltaMsg);
}
function afterSharedReveal(){
  const isInf = isInfiniteSize(G.config.size);
  if (G.config.mode === 'coop'){
    if (!isInf && checkWin(G.myBoard, G.board)){
      send({ t:'win' });
      endGame('win', '🎉', 'FIELD CLEARED!', 'Together you swept every safe tile.', performance.now() - G.startTime);
    }
  } else if (G.config.mode === 'territory'){
    if (checkWin(G.myBoard, G.board)){ finishTerritory(false); return; }
    checkTerritoryUnlock();
  }
}

function finishTerritory(fromNetwork, land1, land2, real1, real2){
  if (G.state === 'over') return;
  if (!fromNetwork){
    const l1 = countLand(G.myBoard, 1);
    const l2 = countLand(G.myBoard, 2);
    const r1 = countRealLand(G.myBoard, 1);
    const r2 = countRealLand(G.myBoard, 2);
    if (G.role === 'host'){
      send({ t:'terr_over', land1: l1, land2: l2, real1: r1, real2: r2 });
    }
    land1 = l1; land2 = l2; real1 = r1; real2 = r2;
  } else if (G.role !== 'guest'){
    return;
  }
  if (real1 === undefined || real1 === null) real1 = land1 || 0;
  if (real2 === undefined || real2 === null) real2 = land2 || 0;
  endTerritoryScreen(land1 || 0, land2 || 0, real1 || 0, real2 || 0);
}

function endTerritoryScreen(land1, land2, real1, real2){
  if (G.state === 'over') return;
  const mine   = (G.myOwner === 1) ? land1 : land2;
  const theirs = (G.myOwner === 1) ? land2 : land1;
  const myReal     = (G.myOwner === 1) ? real1 : real2;
  const theirReal  = (G.myOwner === 1) ? real2 : real1;
  const total  = Math.max(1, G.board ? (G.board.rows * G.board.cols) : (mine + theirs));
  const minePct   = (mine   / total * 100);
  const theirsPct = (theirs / total * 100);

  let result, icon, title, sub;
  if (myReal > theirReal){
    result = 'win';  icon = '🏆'; title = 'LAND GRAB WON!';
    sub = 'You claimed <b style="color:#4dd8ff">' + mine + '</b> tiles — opponent got <b style="color:#ff3d81">' + theirs + '</b>.';
  } else if (theirReal > myReal){
    result = 'lose'; icon = '💀'; title = 'LAND GRAB LOST';
    sub = 'Opponent claimed <b style="color:#ff3d81">' + theirs + '</b> tiles — you got <b style="color:#4dd8ff">' + mine + '</b>.';
  } else {
    result = 'draw'; icon = '🤝'; title = 'DEAD EVEN';
    sub = 'Both players claimed <b>' + mine + '</b> tiles.';
  }
  const cards =
    '<div class="statcard win"><div class="slabel">YOUR LAND</div><div class="sval">' + mine + '</div></div>' +
    '<div class="statcard lose"><div class="slabel">THEIR LAND</div><div class="sval">' + theirs + '</div></div>' +
    '<div class="statcard"><div class="slabel">YOU REVEALED</div><div class="sval">' + minePct.toFixed(0) + '%</div></div>' +
    '<div class="statcard"><div class="slabel">THEY REVEALED</div><div class="sval">' + theirsPct.toFixed(0) + '%</div></div>';
  const elapsed = performance.now() - G.startTime;

  if (G.config && elapsed > 0 && !isGuest && result === 'win'){
    const partner = (G.theirName && G.theirNameKey)
      ? { name: G.theirName, key: G.theirNameKey }
      : null;
    recordWin('territory', G.config.style, G.config.size, !!G.config.insta,
              Math.max(1, Math.round(elapsed)), true, partner).catch(()=>{});
  }

  endGame(result, icon, title, sub, elapsed, cards, { skipRecord: true });
}

function localFlag(){
  if (!canAct()) return;
  const r = G.me.cursor.r, c = G.me.cursor.c;
  const bs = G.myBoard;
  if (bs.revealed[r][c]) return;
  const mode = G.config.mode;
  const insta = !!G.config.insta;

  if (mode === 'territory'){
    if (!canTouchTerritory(bs, G.board, r, c, G.myOwner)) return;

    if (insta){
      if (G.role === 'host'){
        hostApplyTerritoryFlag(r, c, G.myOwner);
      } else {
        bs.flagged[r][c] ? SFX.unflag() : SFX.flag();
        send({ t:'flag', r, c });
      }
      return;
    }

    if (bs.flagged[r][c] && bs.owner[r][c] && bs.owner[r][c] !== G.myOwner){
      SFX.denied();
      return;
    }
    if (G.role === 'host') hostApplyTerritoryFlag(r, c, G.myOwner);
    else {
      bs.flagged[r][c] ? SFX.unflag() : SFX.flag();
      send({ t:'flag', r, c });
    }
    return;
  }

  if (mode === 'coop'){
    if (G.role === 'host') hostApplyFlag(r, c);
    else {
      bs.flagged[r][c] ? SFX.unflag() : SFX.flag();
      send({ t:'flag', r, c });
    }
    return;
  }

  if (mode === 'duel'){
    const isMine = G.board.mines.has(r + ',' + c);

    if (insta){
      const on = bs.flagged[r][c] ? 0 : 1;
      bs.flagged[r][c] = !!on;
      bs.flagAt[r][c] = performance.now();
      bs.flagCount += on ? 1 : -1;
      on ? SFX.flag() : SFX.unflag();
      send({ t:'flag', r, c, on });
      return;
    }

    if (isMine){
      const on = bs.flagged[r][c] ? 0 : 1;
      bs.flagged[r][c] = !!on;
      bs.flagAt[r][c] = performance.now();
      bs.flagCount += on ? 1 : -1;
      on ? SFX.flag() : SFX.unflag();
      send({ t:'flag', r, c, on });
      return;
    }

    bs.revealed[r][c] = true;
    bs.revealAt[r][c] = performance.now();
    bs.count++;
    bs.safeRevealed++;
    send({ t:'rev', tiles: [[r, c]] });

    const view = G.viewMe;
    if (view){
      const p = hexOrSqCenter(view, r, c);
      view.triggerShake();
      view.boom(p.x, p.y, '#7fd8ff', 18, 160);
    }

    const now = performance.now();
    G.me.hits++;
    G.me.stunUntil = now + STUN_MS;
    G.me.wasStunned = true;
    G.me.stunReason = 'flag';
    SFX.freeze();
    vibrate(160);
    send({ t:'stun', who: G.myOwner, reason: 'flag' });

    if (checkWin(bs, G.board)) duelWin();
    return;
  }

  const on = bs.flagged[r][c] ? 0 : 1;
  bs.flagged[r][c] = !!on;
  bs.flagAt[r][c] = performance.now();
  bs.flagCount += on ? 1 : -1;
  on ? SFX.flag() : SFX.unflag();
}

function localChord(){
  if (!canAct()) return;
  const r = G.me.cursor.r, c = G.me.cursor.c;
  const mode = G.config.mode;
  const insta = !!G.config.insta;
  const isInf = isInfiniteSize(G.config.size);

  if (mode === 'coop' || mode === 'territory'){
    if (mode === 'territory' && !canTouchTerritory(G.myBoard, G.board, r, c, G.myOwner)) return;
    if (G.role === 'host') hostApplyChord(r, c, G.myOwner);
    else {
      G.pendingPreSnap = snapshotBoardState(G.myBoard);
      send({ t:'chord', r, c });
    }
    return;
  }
  if (mode === 'duel'){
    const bs = G.myBoard;
    const preSnap = snapshotBoardState(bs);
    const res = applyChord(bs, G.board, r, c, 0);
    if (!res) return;
    if (res.type === 'mine'){
      G.me.hits++;
      const mr = res.tiles[0][0], mc = res.tiles[0][1];
      G.deathTile = { r: mr, c: mc };
      G.lossHintMe = computeHintForBoard(G.board, preSnap, null, false, mr, mc);
      send({ t:'hit', r: mr, c: mc });

      if (insta){
        send({ t:'lose' });
        revealAllMines(bs, G.board, mr, mc);
        const view = G.viewMe;
        if (view){
          view.triggerShake();
          const p = hexOrSqCenter(view, mr, mc);
          view.boom(p.x, p.y, '#ff4d6d', 44, 300);
          view.boom(p.x, p.y, '#ffd166', 20, 160);
        }
        SFX.mine(); vibrate(220);
        const elapsed = performance.now() - G.startTime;
        setTimeout(() => {
          endGame('lose', '💀', 'BOOM!', 'You hit a mine. Instant defeat.', elapsed);
        }, 1000);
        return;
      }

      duelFreeze(mr, mc);
      return;
    }
    send({ t:'rev', tiles: res.tiles });
    afterRevealFeedback(res);
    if (checkWin(bs, G.board)) duelWin();
    return;
  }
  const bs = G.myBoard;
  const preSnap = snapshotBoardState(bs);
  const res = applyChord(bs, G.board, r, c, 0);
  if (!res) return;
  if (res.type === 'mine'){
    G.me.hits++;
    if (!isInf) G.lossHintMe = computeHintForBoard(G.board, preSnap, null, false, res.tiles[0][0], res.tiles[0][1]);
    handleLoss(res.tiles[0][0], res.tiles[0][1], G.viewMe, bs, G.board);
    return;
  }
  afterRevealFeedback(res);
  if (!isInf && checkWin(bs, G.board)){
    G.me.done = true;
    endGame('win', '✨', 'CLEARED!', 'You swept every safe tile.', performance.now() - G.startTime);
  }
}

function checkTerritoryUnlock(){
  if (G.config.mode !== 'territory') return;
  if (G.territoryUnlocked) return;
  if (G.state !== 'playing') return;
  if (!G.myBoard || !G.board) return;
  const myBlocked    = !hasAvailableMove(G.myBoard, G.board, G.myOwner);
  const theirBlocked = !hasAvailableMove(G.myBoard, G.board, G.theirOwner);
  if (!myBlocked && !theirBlocked) return;
  G.territoryUnlocked = true;
  const byOwner = myBlocked ? G.myOwner : G.theirOwner;
  if (G.role === 'host' || G.role === 'solo') send({ t:'unlock', by: byOwner });
  showUnlockPopup(byOwner);
}
let lastUnlockCheck = 0;
function maybeCheckTerritoryUnlock(now){
  if (G.config.mode !== 'territory') return;
  if (G.state !== 'playing') return;
  if (G.territoryUnlocked) return;
  if (now - lastUnlockCheck < 250) return;
  lastUnlockCheck = now;
  checkTerritoryUnlock();
}
function showUnlockPopup(byOwner){
  const prev = document.querySelector('.terr-unlock');
  if (prev) prev.remove();
  const meBlocked = (byOwner === G.myOwner);
  const who = meBlocked
    ? '<b>You</b> have no legal moves left.'
    : '<i>Your opponent</i> has no legal moves left.';
  const el = document.createElement('div');
  el.className = 'terr-unlock';
  el.innerHTML =
    '<div class="terr-unlock-box">' +
      '<div class="terr-unlock-icon">🔓</div>' +
      '<div class="terr-unlock-title">TERRITORY OPENED</div>' +
      '<div class="terr-unlock-body">' + who +
        '<br>All remaining tiles can now be claimed by either player.' +
      '</div>' +
    '</div>';
  document.body.appendChild(el);
  SFX.unlock();
  vibrate([40, 60, 40]);
  setTimeout(() => {
    el.classList.add('fade');
    setTimeout(() => el.remove(), 700);
  }, 3600);
}

function hostApplyDig(r, c, owner){
  if (G.state !== 'playing') return;
  const bs = G.myBoard;
  const isMyDig = (owner === G.myOwner);
  const who = isMyDig ? G.me : G.them;

  /* Flags are removed only via the flag action — a dig request on a
     flagged tile is ignored. */
  if (bs.flagged[r][c]) return;

  if (who && ensureFirstDigSafe(G.board, bs, who, r, c, true)){}
  const preSnap = snapshotBoardState(bs);
  const res = applyReveal(bs, G.board, r, c, owner);
  if (!res) return;
  if (res.type === 'mine'){
    if (G.config.mode === 'territory'){
      G.lossHintMe   = computeHintForBoard(G.board, preSnap, G.myOwner,    G.territoryUnlocked, r, c);
      G.lossHintThem = computeHintForBoard(G.board, preSnap, G.theirOwner, G.territoryUnlocked, r, c);
    } else {
      if (owner === G.myOwner){
        G.lossHintMe = computeHintForBoard(G.board, preSnap, null, false, r, c);
      } else {
        G.lossHintThem = computeHintForBoard(G.board, preSnap, null, false, r, c);
      }
    }
    if (G.config.mode === 'coop') handleCoopLoss(r, c, true, owner === G.myOwner);
    else handleTerritoryBoom(r, c, owner);
    return;
  }
  send({ t:'delta', rev: res.tiles, own: owner });
  afterRevealFeedback(res);
  afterSharedReveal();
}
function hostApplyFlag(r, c){
  if (G.state !== 'playing') return;
  const bs = G.myBoard;
  if (bs.revealed[r][c]) return;
  const on = bs.flagged[r][c] ? 0 : 1;
  bs.flagged[r][c] = !!on;
  bs.flagAt[r][c] = performance.now();
  bs.flagCount += on ? 1 : -1;
  send({ t:'delta', flg: [[r, c, on]] });
  on ? SFX.flag() : SFX.unflag();
}
function hostApplyTerritoryFlag(r, c, owner){
  if (G.state !== 'playing') return;
  const bs = G.myBoard;
  if (bs.revealed[r][c]) return;

  if (G.config.insta){
    if (bs.flagged[r][c]){
      const flagOwner  = bs.owner ? bs.owner[r][c] : 0;
      const flagIsFake = bs.fakeFlag ? bs.fakeFlag[r][c] : false;
      const isEnemyFlag = flagOwner && flagOwner !== owner;

      if (isEnemyFlag && !flagIsFake){
        if (owner === G.myOwner) SFX.denied();
        return;
      }

      bs.flagged[r][c] = false;
      bs.flagAt[r][c] = performance.now();
      bs.flagCount = Math.max(0, bs.flagCount - 1);
      if (bs.owner && bs.owner[r][c] === flagOwner) bs.owner[r][c] = 0;
      if (bs.fakeFlag) bs.fakeFlag[r][c] = false;
      send({ t:'delta', flg: [[r, c, 0]], own: 0, fake: 0 });
      if (owner === G.myOwner) SFX.unflag();
      checkTerritoryUnlock();
      return;
    }

    const isMine = G.board.mines.has(r + ',' + c);
    bs.flagged[r][c] = true;
    bs.flagAt[r][c] = performance.now();
    bs.flagCount++;
    if (bs.owner) bs.owner[r][c] = owner;
    if (bs.fakeFlag) bs.fakeFlag[r][c] = !isMine;
    send({ t:'delta', flg: [[r, c, 1]], own: owner, fake: isMine ? 0 : 1 });
    if (owner === G.myOwner) SFX.flag();
    checkTerritoryUnlock();
    return;
  }

  if (bs.flagged[r][c]){
    if (bs.owner && bs.owner[r][c] && bs.owner[r][c] !== owner){
      if (owner === G.myOwner) SFX.denied();
      return;
    }
    bs.flagged[r][c] = false;
    bs.flagAt[r][c] = performance.now();
    bs.flagCount = Math.max(0, bs.flagCount - 1);
    if (bs.owner && bs.owner[r][c] === owner) bs.owner[r][c] = 0;
    send({ t:'delta', flg: [[r, c, 0]], own: 0 });
    if (owner === G.myOwner) SFX.unflag();
    checkTerritoryUnlock();
    return;
  }

  const isMine = G.board.mines.has(r + ',' + c);
  if (isMine){
    bs.flagged[r][c] = true;
    bs.flagAt[r][c] = performance.now();
    bs.flagCount++;
    if (bs.owner) bs.owner[r][c] = owner;
    send({ t:'delta', flg: [[r, c, 1]], own: owner });
    if (owner === G.myOwner) SFX.flag();
    checkTerritoryUnlock();
  } else {
    bs.revealed[r][c] = true;
    bs.revealAt[r][c] = performance.now();
    if (bs.owner) bs.owner[r][c] = owner;
    bs.count++;
    bs.safeRevealed++;
    send({ t:'delta', rev: [[r, c]], own: owner });
    const view = G.viewMe;
    if (view){
      const p = hexOrSqCenter(view, r, c);
      if (owner === G.myOwner) view.triggerShake();
      view.boom(p.x, p.y, '#7fd8ff', 18, 160);
    }
    applyPenalty(owner, 'flag');
    if (checkWin(bs, G.board)){ finishTerritory(false); return; }
    checkTerritoryUnlock();
  }
}
function hostApplyChord(r, c, owner){
  if (G.state !== 'playing') return;
  const bs = G.myBoard;
  const preSnap = snapshotBoardState(bs);
  const res = applyChord(bs, G.board, r, c, owner);
  if (!res) return;
  if (res.type === 'mine'){
    const mr = res.tiles[0][0], mc = res.tiles[0][1];
    if (G.config.mode === 'territory'){
      G.lossHintMe   = computeHintForBoard(G.board, preSnap, G.myOwner,    G.territoryUnlocked, mr, mc);
      G.lossHintThem = computeHintForBoard(G.board, preSnap, G.theirOwner, G.territoryUnlocked, mr, mc);
    } else {
      if (owner === G.myOwner){
        G.lossHintMe = computeHintForBoard(G.board, preSnap, null, false, mr, mc);
      } else {
        G.lossHintThem = computeHintForBoard(G.board, preSnap, null, false, mr, mc);
      }
    }
    if (G.config.mode === 'coop') handleCoopLoss(mr, mc, true, owner === G.myOwner);
    else handleTerritoryBoom(mr, mc, owner);
    return;
  }
  send({ t:'delta', rev: res.tiles, own: owner });
  afterRevealFeedback(res);
  afterSharedReveal();
}

function hostEnsureBoardThen(r, c, action){
  if (!G.boardPending){ action(); return; }
  ensureBoardReadyAsync(r, c).then(() => {
    if (G.state !== 'playing' || G.boardPending) return;
    sendBoardToGuest();
    action();
  }, () => {});
}

function send(msg){
  if (G.conn && G.conn.open){
    try { G.conn.send(msg); } catch(e){}
  }
}

function sendBoardToGuest(){
  if (G.config.mode !== 'coop') return;
  if (!G.board || G.boardPending) return;
  const op = G.boardOpening;
  const isInf = isInfiniteSize(G.config.size);
  send({
    t: 'board',
    seed: G.boardSeed,
    mines: isInf ? null : Array.from(G.board.mines),
    clickR: op ? op.r : (G.board.rows >> 1),
    clickC: op ? op.c : (G.board.cols >> 1),
    infinite: isInf
  });
}

let hbTimer = null;
function startHeartbeat(){
  stopHeartbeat();
  hbTimer = setInterval(() => {
    if (G.state === 'lobby' && !G.conn) return;
    if (!G.conn || !G.conn.open){ onConnClosed(); return; }
    const since = performance.now() - G.lastRecv;
    if (since > HEARTBEAT_TIMEOUT){
      console.warn('[net] heartbeat timeout (' + Math.round(since) + 'ms) — disconnecting opponent');
      onConnClosed();
      return;
    }
    if (since > HEARTBEAT_WARN && !G.reconnecting && G.state !== 'lobby'){
      G.reconnecting = true;
      setStatus('RECONNECTING', 'warn');
    } else if (since <= HEARTBEAT_WARN && G.reconnecting){
      G.reconnecting = false;
      if (G.state === 'playing') setStatus(G.role === 'solo' ? 'SOLO' : 'LIVE', 'live');
    }
    send({ t:'ping' });
  }, HEARTBEAT_MS);
}
function stopHeartbeat(){ if (hbTimer){ clearInterval(hbTimer); hbTimer = null; } }

function onConnClosed(){
  stopHeartbeat();
  if (G.opponentGone) return;
  G.opponentGone = true;
  G.reconnecting = false;
  if (G.state === 'playing' || G.state === 'countdown'){
    endGame('disconnect', '🔌', 'OPPONENT DISCONNECTED',
            'Your opponent left the match.', performance.now() - G.startTime);
  } else if (G.state === 'over'){
    G.rematchMe = false;
    G.rematchThem = false;
    cleanupNet();
    refreshEndUI();
  } else {
    cleanupNet();
    idleOverlay();
  }
}
function attachConn(c){
  G.conn = c;
  G.lastRecv = performance.now();
  G.opponentGone = false;
  G.reconnecting = false;
  G.theirName = '';
  G.theirNameKey = '';
  c.on('data', msg => { G.lastRecv = performance.now(); handleMessage(msg); });
  c.on('close', onConnClosed);
  c.on('error', () => {});
  startHeartbeat();
  const announce = () => {
    if (G.conn !== c) return;
    const nm = getPlayerName() || '';
    const nk = getPlayerNameKey() || '';
    try { c.send({ t: 'name', name: nm, nameKey: nk }); } catch(e){}
  };
  if (c.open) announce();
  else c.on('open', announce);
}

function handleMessage(msg){
  if (!msg || typeof msg !== 'object') return;
  switch (msg.t){
    case 'ping': break;
    case 'bye': onConnClosed(); break;

    case 'name': {
      G.theirName = String(msg.name || '').slice(0, 32);
      G.theirNameKey = String(msg.nameKey || '').slice(0, 32);
      updatePanelNames();
      break;
    }

    case 'seed': {
      G.config = msg.config || G.config;
      const seedHost  = (msg.seedHost  >>> 0) || newSeed();
      const seedGuest = (msg.seedGuest >>> 0) || newSeed();
      if (G.config.mode === 'duel') startMatch(seedGuest, 'guest', seedHost);
      else                          startMatch(seedHost,  'guest', seedHost);
      break;
    }

    case 'rematch': {
      G.rematchThem = true;
      maybeStartRematch();
      refreshEndUI();
      break;
    }

    case 'terr_board': {
      if (G.config.mode !== 'territory') break;
      if (G.role !== 'guest') break;
      if (!G.board) break;
      rebuildBoardFromMines(G.board, msg.mines || [], G.config.style);
      G.theirBoardLayout = G.board;
      if (!G.terrBoardReady){
        G.terrBoardReady = true;
        if (G.state === 'playing') revealTerritoryStart();
      }
      break;
    }

    case 'cur':
      if (G.them) G.them.cursor = { r: msg.r, c: msg.c };
      break;

    case 'layout':
      if (G.config.mode !== 'duel') break;
      if (!G.theirBoardLayout) break;
      rebuildBoardFromMines(G.theirBoardLayout, msg.mines || [], G.config.style);
      break;

    case 'board': {
      if (G.config.mode !== 'coop') break;
      if (!G.boardPending) break;
      const d = dimsFor(G.config);
      const isInf = !!msg.infinite || isInfiniteSize(G.config.size);
      const wasAlias = (G.theirBoardLayout === G.board);
      const nb = placeholderBoard(G.config.style, d.rows, d.cols);
      nb.infinite = isInf;

      if (Array.isArray(msg.mines) && msg.mines.length){
        rebuildBoardFromMines(nb, msg.mines, G.config.style);
      } else {
        const cr = (msg.clickR !== undefined) ? msg.clickR : (d.rows >> 1);
        const cc = (msg.clickC !== undefined) ? msg.clickC : (d.cols >> 1);
        const fb = genBoardDeferred(msg.seed, G.config.style, d.cols, d.rows, d.mines,
                                    cr, cc,
                                    [{ r: cr, c: cc }]);
        nb.mines = fb.mines;
        recomputeAdjacency(nb);
        nb.mineCount = nb.mines.size;
        nb.safeCount = nb.rows * nb.cols - nb.mineCount;
        nb.pending = false;
      }

      G.board = nb;
      if (wasAlias) G.theirBoardLayout = nb;
      G.boardSeed = msg.seed;
      G.boardPending = false;
      G.boardOpening = { r: msg.clickR, c: msg.clickC };
      cancelPregen();
      if (G.pendingDig){
        const pd = G.pendingDig;
        G.pendingDig = null;
        G.me.cursor = { r: pd.r, c: pd.c };
        setTimeout(() => { if (G.state === 'playing') doLocalDig(pd.r, pd.c); }, 0);
      }
      break;
    }

    case 'dig': {
      if (G.role !== 'host') break;
      if (G.state !== 'playing') break;
      if (G.config.mode !== 'coop' && G.config.mode !== 'territory') break;
      if (performance.now() < G.them.stunUntil) break;
      if (G.config.mode === 'territory' &&
          !canTouchTerritory(G.myBoard, G.board, msg.r, msg.c, G.theirOwner)) break;
      const dr = msg.r, dc = msg.c;
      hostEnsureBoardThen(dr, dc, function(){ hostApplyDig(dr, dc, G.theirOwner); });
      break;
    }

    case 'flag':
      if (G.state !== 'playing') break;
      if (G.config.mode === 'coop'){
        if (G.role !== 'host') break;
        if (performance.now() < G.them.stunUntil) break;
        hostApplyFlag(msg.r, msg.c);
      } else if (G.config.mode === 'territory'){
        if (G.role !== 'host') break;
        if (performance.now() < G.them.stunUntil) break;
        if (!canTouchTerritory(G.myBoard, G.board, msg.r, msg.c, G.theirOwner)) break;
        hostApplyTerritoryFlag(msg.r, msg.c, G.theirOwner);
      } else if (G.config.mode === 'duel'){
        if (!G.theirBoard) break;
        const on = msg.on ? 1 : 0;
        if (G.theirBoard.flagged[msg.r][msg.c] !== !!on){
          G.theirBoard.flagged[msg.r][msg.c] = !!on;
          G.theirBoard.flagAt[msg.r][msg.c] = performance.now();
          G.theirBoard.flagCount += on ? 1 : -1;
        }
      }
      break;

    case 'chord': {
      if (G.role !== 'host') break;
      if (G.state !== 'playing') break;
      if (G.config.mode !== 'coop' && G.config.mode !== 'territory') break;
      if (performance.now() < G.them.stunUntil) break;
      if (G.config.mode === 'territory' &&
          !canTouchTerritory(G.myBoard, G.board, msg.r, msg.c, G.theirOwner)) break;
      const cr = msg.r, cc = msg.c;
      hostEnsureBoardThen(cr, cc, function(){ hostApplyChord(cr, cc, G.theirOwner); });
      break;
    }

    case 'rev':
      if (!G.theirBoard) break;
      {
        const now = performance.now();
        const layout = G.theirBoardLayout || G.board;
        for (const pair of (msg.tiles || [])){
          const r = pair[0], c = pair[1];
          if (G.theirBoard.revealed[r][c]) continue;
          G.theirBoard.revealed[r][c] = true;
          G.theirBoard.revealAt[r][c] = now + Math.random() * 80;
          G.theirBoard.count++;
          if (layout && !layout.mines.has(r + ',' + c)) G.theirBoard.safeRevealed++;
        }
      }
      break;

    case 'hit': {
      if (G.config.mode === 'duel' && G.theirBoard && G.theirBoardLayout &&
          msg.r !== undefined && msg.c !== undefined &&
          !G.theirBoard.revealed[msg.r][msg.c]){
        const preSnap = snapshotBoardState(G.theirBoard);
        preSnap.revealed[msg.r][msg.c] = false;
        const hint = computeHintForBoard(G.theirBoardLayout, preSnap, null, false, msg.r, msg.c);
        if (hint){
          G.lossHintThem = hint;
        }
      }
      if (G.them){
        G.them.hits++;
        G.them.stunUntil = performance.now() + STUN_MS;
        G.them.wasStunned = true;
        G.them.stunReason = 'bomb';
      }
      G.theirDeathTile = { r: msg.r, c: msg.c };
      if (G.theirBoard && msg.r !== undefined && msg.c !== undefined){
        const now = performance.now();
        if (!G.theirBoard.revealed[msg.r][msg.c]){
          G.theirBoard.revealed[msg.r][msg.c] = true;
          G.theirBoard.revealAt[msg.r][msg.c] = now;
          G.theirBoard.count++;
        }
      }
      if (G.viewThem) G.viewThem.triggerShake();
      SFX.oppStun();
      break;
    }

    case 'swapmine': {
      const layout = (G.config.mode === 'duel') ? G.theirBoardLayout : G.board;
      if (!layout) break;
      if (layout.mines.has(msg.r + ',' + msg.c)){
        layout.mines.delete(msg.r + ',' + msg.c);
        layout.mines.add(msg.sr + ',' + msg.sc);
        recomputeAdjacency(layout);
      }
      break;
    }

    case 'delta': applyDelta(msg); break;

    case 'unlock':
      if (G.config.mode === 'territory' && !G.territoryUnlocked){
        G.territoryUnlocked = true;
        showUnlockPopup(msg.by === undefined ? G.theirOwner : msg.by);
      }
      break;

    case 'terr_over':
      if (G.config.mode === 'territory'){
        finishTerritory(true, msg.land1 || 0, msg.land2 || 0,
                        msg.real1, msg.real2);
      }
      break;

    case 'stun': {
      const now = performance.now();
      const reason = msg.reason || 'bomb';
      if (msg.who === G.myOwner){
        G.me.hits++;
        G.me.stunUntil = now + STUN_MS;
        G.me.wasStunned = true;
        G.me.stunReason = reason;
        if (reason === 'flag'){ SFX.freeze(); }
        else { SFX.mine(); setTimeout(() => SFX.freeze(), 150); }
        vibrate(160);
      } else if (G.them){
        G.them.hits++;
        G.them.stunUntil = now + STUN_MS;
        G.them.wasStunned = true;
        G.them.stunReason = reason;
        SFX.oppStun();
      }
      break;
    }

    case 'win':
      if (G.state === 'playing' || G.state === 'countdown'){
        if (G.config.mode === 'coop'){
          endGame('win', '🎉', 'FIELD CLEARED!',
            'Together you swept every safe tile.',
            performance.now() - G.startTime);
        } else {
          if (!G.lossHintMe){
            const snap = G.pendingPreSnap || snapshotBoardState(G.myBoard);
            if (snap && G.board){
              G.lossHintMe = computeHintForBoard(
                G.board, snap,
                G.config.mode === 'territory' ? G.myOwner : null,
                G.territoryUnlocked,
                G.deathTile ? G.deathTile.r : undefined,
                G.deathTile ? G.deathTile.c : undefined
              );
            }
          }
          G.pendingPreSnap = null;
          endGame('lose', '💀', 'DEFEATED',
            'Your opponent cleared their field first.',
            performance.now() - G.startTime);
        }
      }
      break;

    case 'lose':
      if (G.state === 'playing' || G.state === 'countdown'){
        endGame('win', '🏆', 'VICTORY!',
          'Your opponent triggered a mine.',
          performance.now() - G.startTime);
      }
      break;
  }
}

function applyDelta(msg){
  const bs = G.myBoard;
  if (!bs || !G.board) return;
  const now = performance.now();

  if (msg.rev){
    let revealedAny = false;
    let firstVal = 0;
    for (const pair of msg.rev){
      const r = pair[0], c = pair[1];
      if (bs.revealed[r][c]) continue;
      bs.revealed[r][c] = true;
      bs.revealAt[r][c] = now + Math.random() * 70;
      bs.count++;
      if (!G.board.mines.has(r + ',' + c)) bs.safeRevealed++;
      if (msg.own !== undefined && bs.owner) bs.owner[r][c] = msg.own ? msg.own : 0;
      if (bs.fakeFlag) bs.fakeFlag[r][c] = false;
      if (!revealedAny){
        revealedAny = true;
        if (G.board.adj && G.board.adj[r]) firstVal = G.board.adj[r][c] || 0;
      }
    }
    if (revealedAny && (msg.own === undefined || msg.own === G.myOwner)){
      SFX.reveal(firstVal);
    }
  }
  if (msg.flg){
    for (const tri of msg.flg){
      const r = tri[0], c = tri[1], on = tri[2];
      const wasOn = bs.flagged[r][c] ? 1 : 0;
      bs.flagged[r][c] = !!on;
      bs.flagAt[r][c] = now;
      bs.flagCount += on - wasOn;
      if (bs.owner){
        if (on && msg.own !== undefined) bs.owner[r][c] = msg.own ? msg.own : 0;
        else if (!on) bs.owner[r][c] = 0;
      }
      if (bs.fakeFlag){
        bs.fakeFlag[r][c] = on ? !!msg.fake : false;
      }
    }
  }
  if (msg.mine && bs.owner){
    const r = msg.mine[0], c = msg.mine[1];
    bs.owner[r][c] = (msg.own !== undefined) ? msg.own : 0;
    if (bs.fakeFlag) bs.fakeFlag[r][c] = false;
  }
  if (msg.hints && G.myOwner && G.theirOwner){
    if (msg.hints[G.myOwner])    G.lossHintMe   = deserializeHint(msg.hints[G.myOwner]);
    if (msg.hints[G.theirOwner]) G.lossHintThem = deserializeHint(msg.hints[G.theirOwner]);
  }
  if (msg.lose){
    if (!G.lossHintMe && G.pendingPreSnap && G.board){
      G.lossHintMe = computeHintForBoard(G.board, G.pendingPreSnap, null, false, msg.r, msg.c);
    }
    G.pendingPreSnap = null;
    handleCoopLoss(msg.r, msg.c, false, msg.by === G.myOwner);
  }
}

function showNameEntryPopup(opts){
  opts = opts || {};

  const currentName = opts.currentName || '';
  const canCancel = !!opts.onCancel;
  const showGuest = !isChange && !!opts.onGuest;

  showOverlay(
    '<div class="ovbox menu-pop">' +
      '<div class="big">🏷️</div>' +
      '<h2>' + (isChange ? 'CHANGE <span>NAME</span>' : 'CHOOSE YOUR <span>NAME</span>') + '</h2>' +
      '<p>' + (isChange
        ? 'Enter a new name. Your old name will be released.'
        : 'Pick a name for the leaderboards. 3–16 letters, no spaces.') + '</p>' +
      '<input id="nameInput" class="name-input" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false" value="' + escapeHtml(currentName) + '">' +
      '<div class="ovbtns" style="margin-top:20px">' +
        (canCancel ? '<button class="ghost" id="btnCancelName">CANCEL</button>' : '') +
        '<button class="primary" id="btnSubmitName">' + (isChange ? 'CHANGE NAME' : 'CONFIRM') + '</button>' +
      '</div>' +
      (showGuest
        ? '<div class="ovbtns sub"><button class="ghost" id="btnGuest">CONTINUE AS GUEST</button></div>'
        : '') +
      '<div class="err" id="nameErr"></div>' +
    '</div>'
  );

  const input = overlay.querySelector('#nameInput');
  const errEl = overlay.querySelector('#nameErr');
  const btnSubmit = overlay.querySelector('#btnSubmitName');
  const btnCancel = overlay.querySelector('#btnCancelName');
  const btnGuest  = overlay.querySelector('#btnGuest');

  if (input){ input.focus(); input.select(); }

  const finish = (name) => {
    if (opts.onSuccess) opts.onSuccess(name);
  };

  const submit = async () => {
    if (!errEl || !btnSubmit) return;
    errEl.textContent = '';
    btnSubmit.disabled = true;
    const raw = input ? input.value : '';

    const v = validateName(raw);
    if (v.error){
      errEl.textContent = v.error;
      btnSubmit.disabled = false;
      return;
    }

    try {
      await registerName(raw, isChange);
      isGuest = false;
      finish(v.name);
    } catch(e){
      errEl.textContent = firebaseErrorMessage(e);
      btnSubmit.disabled = false;
    }
  };

  if (btnSubmit) btnSubmit.onclick = submit;
  if (btnCancel) btnCancel.onclick = () => {
    if (opts.onCancel) opts.onCancel();
    else { menuView = 'main'; renderMenu(''); }
  };
  if (btnGuest) btnGuest.onclick = () => {
    isGuest = true;
    if (opts.onGuest) opts.onGuest();
    else { menuView = 'main'; renderMenu(''); refreshLeaderboard(true); }
  };
  if (input) input.onkeydown = e => {
    if (e.key === 'Enter') submit();
    if (e.key === 'Escape' && btnCancel) btnCancel.click();
  };
}

let linkUnsub = null;

function cleanupLinkPeer(){
  if (linkUnsub){ try { linkUnsub(); } catch(e){} linkUnsub = null; }
}

function startLinking(){
  if (!db || !auth){
    menuError = 'Linking requires an online connection.';
    menuView = 'main';
    renderMenu(menuError);
    return;
  }
  const name = getPlayerName();
  const key = getPlayerNameKey();
  if (!name || !key){
    menuError = 'Set a name first.';
    menuView = 'main';
    renderMenu(menuError);
    return;
  }
  const proceed = (user) => {
    if (!user){
      menuError = 'Still connecting — try again in a moment.';
      menuView = 'main';
      renderMenu(menuError);
      return;
    }
    db.collection('names').doc(key).get().then(snap => {
      if (!snap.exists){
        menuError = 'Your name is no longer reserved. Please set it again.';
        menuView = 'main';
        renderMenu(menuError);
        return;
      }
      const nd = snap.data() || {};
      const uids = nd.linkedUids || [];
      if (uids.indexOf(user.uid) === -1){
        menuError = 'Your name is not linked to this browser.';
        menuView = 'main';
        renderMenu(menuError);
        return;
      }
      doStartLinking(name, key, user.uid);
    }).catch(err => {
      menuError = 'Could not verify name: ' + firebaseErrorMessage(err);
      menuView = 'main';
      renderMenu(menuError);
    });
  };
  if (auth.currentUser) proceed(auth.currentUser);
  else trySignIn().then(proceed);
}

function doStartLinking(name, key, hostUid){
  const code = makeCode();
  const codeEl = overlay.querySelector('#linkCode');
  const statusEl = overlay.querySelector('#linkStatus');
  if (codeEl){
    codeEl.textContent = code;
    codeEl.onclick = () => {
      SFX.clickSoft();
      copyToClipboard(code).then(ok => {
        codeEl.textContent = ok ? 'COPIED' : code;
        setTimeout(() => { codeEl.textContent = code; }, 900);
      });
    };
  }
  if (statusEl) statusEl.innerHTML = '<span class="spin"></span>Publishing code…';

  cleanupLinkPeer();

  const ref = db.collection('linkCodes').doc(code);
  let cancelled = false;

  const cleanup = () => {
    if (cancelled) return;
    cancelled = true;
    if (linkUnsub){ try { linkUnsub(); } catch(e){} linkUnsub = null; }
    ref.delete().catch(() => {});
  };

  ref.set({
    hostUid: hostUid,
    hostName: name,
    hostNameKey: key,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    status: 'waiting'
  }).then(() => {
    if (cancelled) return;
    if (statusEl) statusEl.innerHTML = '<span class="spin"></span>Waiting for other device…';

    linkUnsub = ref.onSnapshot(snap => {
      if (!snap.exists) return;
      const data = snap.data() || {};
      if (data.status === 'done'){
        if (statusEl) statusEl.innerHTML = '✅ Linked successfully!';
        SFX.win();
        setTimeout(() => {
          cleanup();
          menuView = 'main';
          renderMenu('');
          refreshLeaderboard(true);
        }, 1200);
      } else if (data.status === 'error'){
        if (statusEl) statusEl.textContent = '❌ ' + (data.error || 'Failed');
      }
    });
  }).catch(err => {
    if (statusEl) statusEl.textContent = 'Error: ' + firebaseErrorMessage(err);
  });

  const cancel = overlay.querySelector('#btnCancelLink');
  if (cancel) cancel.onclick = () => {
    cleanup();
    menuView = 'main';
    renderMenu('');
  };
}

    if (!getPlayerName()){
      try { location.reload(); } catch(e){}
      return;
    }
    menuView = 'name';
    menuError = '';
    renderMenu('');
  };

  const ovBtn = overlay.querySelector('#btnLbOverview');
  if (ovBtn) ovBtn.onclick = () => {
    SFX.clickSoft();
    openLeaderboardOverview();
  };

  overlay.querySelectorAll('[data-mode]').forEach(b => {
    b.onclick = () => {
      G.config.mode = b.dataset.mode;
      if (G.config.mode === 'duel' || G.config.mode === 'territory'){
        G.config.insta = rememberedInsta;
        if (isInfiniteSize(G.config.size)) G.config.size = 'large';
      } else {
        G.config.insta = false;
      }
      menuError = '';
      renderMenu();
      refreshLeaderboard(false);
    };
  });
  overlay.querySelectorAll('[data-style]').forEach(b => {
    b.onclick = () => {
      G.config.style = b.dataset.style;
      menuError = '';
      renderMenu();
      refreshLeaderboard(false);
    };
  });
  overlay.querySelectorAll('[data-size]').forEach(b => {
    b.onclick = () => {
      G.config.size = b.dataset.size;
      menuError = '';
      renderMenu();
      refreshLeaderboard(false);
    };
  });
  overlay.querySelectorAll('[data-insta]').forEach(b => {
    b.onclick = () => {
      G.config.insta = (b.dataset.insta === '1');
      rememberedInsta = G.config.insta;
      menuError = '';
      renderMenu();
      refreshLeaderboard(false);
    };
  });

  const btnStart = overlay.querySelector('#btnStart');
  if (btnStart) btnStart.onclick = () => { menuError = ''; startMatch(newSeed(), 'solo'); };

  const btnHost = overlay.querySelector('#btnHost');
  if (btnHost) btnHost.onclick = () => { menuError = ''; hostGame(); };

  const btnJoin = overlay.querySelector('#btnJoin');
  const joinRow = overlay.querySelector('#joinRow');
  const input   = overlay.querySelector('#joinInput');
  const btnGo   = overlay.querySelector('#btnJoinGo');

  if (btnJoin) btnJoin.onclick = () => {
    joinRow.classList.toggle('hidden');
    if (!joinRow.classList.contains('hidden') && input) input.focus();
    scheduleMenuFit();
  };
  if (btnGo) btnGo.onclick = () => {
    const code = (input.value || '').trim().toUpperCase();
    if (code.length !== 4){ menuError = 'Enter the 4-character room code.'; renderMenu(); return; }
    menuError = ''; joinGame(code);
  };
  if (input) input.onkeydown = e => { if (e.key === 'Enter') btnGo.click(); };

  const btnHk = overlay.querySelector('#btnHotkeys');
  if (btnHk) btnHk.onclick = () => { hotkeyCapture = null; menuView = 'hotkeys'; menuError = ''; renderMenu(); };

  const btnHow = overlay.querySelector('#btnHowTo');
  if (btnHow) btnHow.onclick = () => { menuView = 'howto'; menuError = ''; renderMenu(); };

  attachLeaderboardHandlers();
}

function hostGame(){
  setStatus('CONNECTING', 'warn');
  showOverlay(waitHTML('📡', 'CREATING ROOM', '<span class="spin"></span>Setting up a peer connection…'));
  wireCancel();

  const code = makeCode();
  let peer;
  try { peer = new Peer(PREFIX + code, PEER_OPTS); }
  catch(e){ renderMenu('Could not start peer connection.'); return; }
  G.peer = peer;
  let started = false;

  peer.on('open', () => {
    if (G.peer !== peer) return;
    showCodeScreen(code);
    wireCancel();
  });
  peer.on('connection', c => {
    if (G.conn){ try { c.close(); } catch(e){} return; }
    attachConn(c);
    const begin = () => {
      if (started) return;
      started = true;
      const seedHost = newSeed();
      const seedGuest = newSeed();
      send({ t:'seed', seedHost, seedGuest, config: G.config });
      startMatch(seedHost, 'host', seedGuest);
    };
    c.on('open', begin);
    if (c.open) begin();
  });
  peer.on('error', err => {
    if (G.peer !== peer) return;
    cleanupNet();
    const t = err && err.type;
    if (t === 'unavailable-id') renderMenu('Room code collision — please try again.');
    else renderMenu('Connection error: ' + (t || 'unknown'));
  });
}

async function joinGame(code){
  setStatus('CONNECTING', 'warn');
  showOverlay(waitHTML('🔎', 'JOINING ' + code, '<span class="spin"></span>Looking for the room…'));
  wireCancel();

  if (db && auth){
    try {
      const linkSnap = await db.collection('linkCodes').doc(code).get();
      if (linkSnap.exists){
        const data = linkSnap.data() || {};
        if (data.status === 'waiting'){
          await handleLinkCode(code, data);
        } else {
          showOverlay(waitHTML('❌', 'CODE ALREADY USED',
            'Ask the other device to show a fresh code.'));
          wireCancel();
        }
        return;
      }
    } catch(e){
      console.warn('[link] Firestore check failed:', e);
    }
  }

  joinRoomPeerJS(code);
}

async function handleLinkCode(code, data){
  const ref = db.collection('linkCodes').doc(code);
  try {
    let user = auth.currentUser;
    if (!user) user = await trySignIn();
    if (!user) throw new Error('Not signed in — check your connection');

    const res = await applyLinkedName(data.hostName, data.hostNameKey);
    await ref.update({ status: 'done', joinerUid: user.uid });

    isGuest = false;
    showOverlay(
      '<div class="ovbox"><div class="big">✅</div><h2>LINKED!</h2>' +
      '<p>This device now uses the name <b style="color:#4dd8ff">' +
        escapeHtml(res.name) + '</b>.</p>' +
      '<div class="ovbtns"><button class="primary" id="btnLinkDone">BACK TO MENU</button></div></div>'
    );
    const b = overlay.querySelector('#btnLinkDone');
    if (b) b.onclick = () => { idleOverlay(); };
  } catch(e){
    try { await ref.update({ status: 'error', error: (e && e.message) || 'Failed' }); }
    catch(_){}
    showOverlay(
      '<div class="ovbox"><div class="big">❌</div><h2>LINK FAILED</h2>' +
      '<p>' + escapeHtml((e && e.message) || 'Failed to link') + '</p>' +
      '<div class="ovbtns"><button class="primary" id="btnLinkDone">BACK TO MENU</button></div></div>'
    );
    const b = overlay.querySelector('#btnLinkDone');
    if (b) b.onclick = () => { idleOverlay(); };
  }
}

function joinRoomPeerJS(code){
  let peer;
  try { peer = new Peer(PEER_OPTS); }
  catch(e){ renderMenu('Could not start peer connection.'); return; }
  G.peer = peer;

  let settled = false;
  let roomConn = null;
  let failTimer = 0;

  const finishFail = (msg) => {
    if (settled) return;
    settled = true;
    if (failTimer){ clearTimeout(failTimer); failTimer = 0; }
    try { if (roomConn) roomConn.close(); } catch(e){}
    if (G.peer === peer) cleanupNet();
    showOverlay(waitHTML('❌', 'NOT FOUND', msg || 'No room matched that code.'));
    wireCancel();
  };

  failTimer = setTimeout(() => {
    finishFail('No room matched that code.');
  }, 35000);

  peer.on('open', () => {
    if (G.peer !== peer || settled) return;
    try { roomConn = peer.connect(PREFIX + code, { reliable: true }); }
    catch(e){ roomConn = null; }
    if (!roomConn){ finishFail('Could not open connection.'); return; }

    roomConn.on('open', () => {
      if (settled) return;
      settled = true;
      if (failTimer){ clearTimeout(failTimer); failTimer = 0; }
      attachConn(roomConn);
      G.role = 'guest';
      setStatus('WAITING', 'warn');
      showOverlay(waitHTML('✅', 'CONNECTED',
        '<span class="spin"></span>Waiting for the host to start…'));
      wireCancel();
    });
    roomConn.on('error', () => { finishFail('No room matched that code.'); });
    roomConn.on('close', () => { if (!settled) finishFail('No room matched that code.'); });
  });

  peer.on('error', err => {
    if (G.peer !== peer) return;
    const t = err && err.type;
    if (t === 'peer-unavailable'){ finishFail('No room matched that code.'); return; }
    if (settled) return;
    if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed'){
      settled = true;
      if (failTimer){ clearTimeout(failTimer); failTimer = 0; }
      cleanupNet();
      renderMenu('Connection error: ' + t);
    }
  });
}

function startMatch(seed, role, seedGuest){
  G.role = role;
  G.seed = seed >>> 0;
  G.mySeed = seed >>> 0;
  G.theirSeed = (seedGuest >>> 0) || newSeed();
  G.boardSeed = G.mySeed;
  G.myOwner = (role === 'guest') ? 2 : 1;
  G.theirOwner = (role === 'guest') ? 1 : 2;
  G.lossPending = false; G.winSent = false; G.opponentGone = false;
  G.pendingDig = null; G.lastRecv = performance.now();
  G.reconnecting = false;
  G.deathTile = null; G.theirDeathTile = null;
  G.territoryUnlocked = false; G.reviewViews = [];
  G.boardOpening = null;
  G.rematchMe = false; G.rematchThem = false; G.rematchLock = false;
  G.lossHintMe = null;
  G.lossHintThem = null;
  G.pendingPreSnap = null;
  G.viewAnim = null;
  lastUnlockCheck = 0;
  clearHeldKeys();
  hotkeyCapture = null;

  cancelPregen();
  genInFlight = null;

  const oldPop = document.querySelector('.terr-unlock');
  if (oldPop) oldPop.remove();

  const d = dimsFor(G.config);
  const mode = G.config.mode;
  const isInf = isInfiniteSize(G.config.size);
  let starts = [{ r: (d.rows >> 1), c: (d.cols >> 1) }];
  if (mode === 'territory') starts = territoryStarts(d.rows, d.cols);

  if (mode === 'territory'){
    const opening = starts.map(s => [s.r, s.c]);
    const res = generateSolvableBoard(
      G.mySeed, G.config.style, d.cols, d.rows, d.mines,
      undefined, undefined, starts, opening, true, false
    );
    G.board = res.board;
    G.boardSeed = res.seed;
    G.boardPending = false;
    G.terrBoardReady = (role === 'host');
    if (role === 'host'){
      send({ t:'terr_board', mines: Array.from(G.board.mines) });
    }
  } else if (isInf){
    const cr = d.rows >> 1, cc = d.cols >> 1;
    let res = null;
    let attempts = 0;
    let s = G.mySeed;
    /* Regenerate until the start area passes the ±10 tile
       solvability check (or give up after a reasonable number of
       tries and accept the last one). */
    while (attempts < 25){
      res = generateSolvableBoard(
        s, G.config.style, d.cols, d.rows, d.mines,
        cr, cc, starts, [[cr, cc]], false, true
      );
      if (infiniteStartIsPlayable(res.board, cr, cc, 10)) break;
      attempts++;
      s = (G.mySeed + Math.imul(attempts, 0x9E3779B9)) >>> 0;
    }
    G.board = res.board;
    G.board.infinite = true;
    G.boardSeed = res.seed;
    G.boardPending = false;
    G.boardOpening = { r: cr, c: cc };
    G.terrBoardReady = true;
    if (role === 'host'){
      sendBoardToGuest();
    }
  } else {
    G.board = placeholderBoard(G.config.style, d.rows, d.cols);
    G.boardPending = true;
    G.terrBoardReady = true;
  }

  G.myBoard = makeBoardState(d.rows, d.cols);
  G.theirBoard = makeBoardState(d.rows, d.cols);
  G.theirBoardLayout = (mode === 'duel')
    ? placeholderBoard(G.config.style, d.rows, d.cols)
    : G.board;

  const myStart = starts.length > 1 ? starts[G.myOwner - 1] : starts[0];
  const theirStart = starts.length > 1 ? starts[G.theirOwner - 1] : starts[0];

  G.me = makePlayerState(myStart);
  G.them = (role === 'solo') ? null : makePlayerState(theirStart);

  G.myStartR = myStart.r;
  G.myStartC = myStart.c;

  buildArena();
  buildControls();
  hideOverlay();

  G.state = 'countdown';

  if (G.boardPending) setTimeout(kickPregen, 40);

  countdown(() => {
    G.state = 'playing';
    G.startTime = performance.now();
    lastCursorSent = 0;
    if (role === 'solo') setStatus('SOLO', 'live');
    else setStatus('LIVE', 'live');
    SFX.go();
    if (mode === 'territory' && G.terrBoardReady) revealTerritoryStart();
  });
}

function revealTerritoryStart(){
  if (!G.board || !G.myBoard) return;
  const d = dimsFor(G.config);
  const starts = territoryStarts(d.rows, d.cols);
  const myS = starts[G.myOwner - 1];
  const theirS = starts[G.theirOwner - 1];
  applyReveal(G.myBoard, G.board, myS.r, myS.c, G.myOwner);
  applyReveal(G.myBoard, G.board, theirS.r, theirS.c, G.theirOwner);
}

function countdown(done){
  const cfg = G.config;
  const modeName  = (MODES[cfg.mode]  || {}).name || cfg.mode;
  const styleName = (STYLES[cfg.style]|| {}).name || cfg.style;
  const sizeName  = (SIZES[cfg.size]  || {}).name || cfg.size;
  const isInf = isInfiniteSize(cfg.size);

  const styleCls = (cfg.style === 'hex') ? 'hex' : '';
  const sizeCls = isInf ? 'infinite'
                 : (cfg.size === 'small') ? 'green'
                 : (cfg.size === 'medium') ? 'yellow'
                 : (cfg.size === 'large') ? 'red' : '';

  const rulesHtml =
    '<div class="cd-rules">' +
      '<div class="cd-rule' + (cfg.insta ? ' insta' : '') + '"><span>MODE</span><b>' +
        escapeHtml(modeName) + (cfg.insta ? ' · INSTANT' : '') + '</b></div>' +
      '<div class="cd-rule"><span>STYLE</span><b class="' + styleCls + '">' +
        escapeHtml(styleName) + '</b></div>' +
      '<div class="cd-rule"><span>SIZE</span><b class="' + sizeCls + '">' +
        escapeHtml(sizeName) + '</b></div>' +
    '</div>';

  let n = 5;
  const step = () => {
    if (n > 0){
      showOverlay(
        '<div class="ovbox cd-box">' +
          '<h2>GET <span>READY</span></h2>' +
          rulesHtml +
          '<div class="cd">' + n + '</div>' +
        '</div>'
      );
      SFX.countdown(n);
      n--;
      setTimeout(step, 1000);
    } else {
      showOverlay(
        '<div class="ovbox cd-box">' +
          '<h2>GET <span>READY</span></h2>' +
          rulesHtml +
          '<div class="cd" style="color:#5dff9e;text-shadow:0 0 34px #5dff9e,0 0 80px #5dff9e">GO!</div>' +
        '</div>'
      );
      SFX.go();
      setTimeout(() => { hideOverlay(); done(); }, 550);
    }
  };
  step();
}
