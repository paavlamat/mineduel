function buildFullRevealState(baseState, board){
  const s = makeBoardState(board.rows, board.cols);
  for (let r = 0; r < board.rows; r++){
    for (let c = 0; c < board.cols; c++){
      s.revealed[r][c] = true;
      if (baseState.owner) s.owner[r][c] = baseState.owner[r][c];
      if (baseState.fakeFlag) s.fakeFlag[r][c] = baseState.fakeFlag[r][c];
    }
  }
  s.safeRevealed = board.safeCount;
  return s;
}
function buildEndReviewState(baseState, board, deathTile){
  const s = makeBoardState(board.rows, board.cols);
  for (let r = 0; r < board.rows; r++){
    for (let c = 0; c < board.cols; c++){
      const isMine = board.mines.has(r + ',' + c);
      const isDeath = deathTile && deathTile.r === r && deathTile.c === c;
      const rev = baseState.revealed[r][c] && (!isMine || isDeath);
      s.revealed[r][c] = rev;
      s.flagged[r][c]  = baseState.flagged[r][c];
      s.flagAt[r][c]   = 1;
      if (baseState.owner) s.owner[r][c] = baseState.owner[r][c];
      if (baseState.fakeFlag) s.fakeFlag[r][c] = baseState.fakeFlag[r][c];
      if (rev && !isMine) s.safeRevealed++;
    }
  }
  return s;
}

/* Copy a board-state and hide one cell (used for the "solution" view). */
function hideCellInState(state, r, c){
  if (!state || r === undefined || c === undefined) return state;
  const s = makeBoardState(state.rows, state.cols);
  for (let rr = 0; rr < state.rows; rr++){
    s.revealed[rr] = state.revealed[rr].slice();
    s.flagged[rr]  = state.flagged[rr].slice();
    s.owner[rr]    = state.owner[rr].slice();
    s.fakeFlag[rr] = state.fakeFlag[rr].slice();
    s.revealAt[rr] = state.revealAt[rr].slice();
    s.flagAt[rr]   = state.flagAt[rr].slice();
  }
  s.revealed[r][c] = false;
  s.flagged[r][c]  = false;
  if (s.owner)    s.owner[r][c]    = 0;
  if (s.fakeFlag) s.fakeFlag[r][c] = false;
  s.count        = state.count;
  s.safeRevealed = state.safeRevealed;
  s.flagCount    = state.flagCount;
  return s;
}

/* Clip a large (infinite) board + state to the given tile rectangle.
   Returns {board, state, offsetR, offsetC}. */
function clipInfiniteRegion(board, state, r0, r1, c0, c1){
  r0 = Math.max(0, r0); r1 = Math.min(board.rows - 1, r1);
  c0 = Math.max(0, c0); c1 = Math.min(board.cols - 1, c1);
  const nrows = r1 - r0 + 1;
  const ncols = c1 - c0 + 1;

  const nb = {
    style: board.style,
    cols: ncols, rows: nrows,
    mines: new Set(),
    adj: [],
    neighbors: board.neighbors,
    mineCount: 0, safeCount: 0,
    infinite: false,
    starts: [], start: null
  };
  for (let i = 0; i < nrows; i++) nb.adj.push(new Array(ncols).fill(0));

  for (let r = r0; r <= r1; r++){
    for (let c = c0; c <= c1; c++){
      const nr = r - r0, nc = c - c0;
      if (board.mines.has(r + ',' + c)){
        nb.mines.add(nr + ',' + nc);
        nb.adj[nr][nc] = -1;
        nb.mineCount++;
      } else {
        nb.adj[nr][nc] = board.adj[r][c];
      }
    }
  }
  nb.safeCount = nrows * ncols - nb.mineCount;

  const nbs = makeBoardState(nrows, ncols);
  for (let r = r0; r <= r1; r++){
    for (let c = c0; c <= c1; c++){
      const nr = r - r0, nc = c - c0;
      nbs.revealed[nr][nc] = state.revealed[r][c];
      nbs.flagged[nr][nc]  = state.flagged[r][c];
      nbs.owner[nr][nc]    = state.owner[r][c];
      nbs.fakeFlag[nr][nc] = state.fakeFlag[r][c];
      nbs.revealAt[nr][nc] = state.revealAt[r][c];
      nbs.flagAt[nr][nc]   = state.flagAt[r][c];
      if (state.revealed[r][c]) nbs.count++;
      if (state.flagged[r][c])  nbs.flagCount++;
      if (state.revealed[r][c] && !board.mines.has(r + ',' + c)) nbs.safeRevealed++;
    }
  }

  return { board: nb, state: nbs, offsetR: r0, offsetC: c0 };
}

/* Clip around a center point with a radius (the ±N view). */
function clipInfiniteReview(board, state, centerR, centerC, radius){
  return clipInfiniteRegion(board, state,
    centerR - radius, centerR + radius,
    centerC - radius, centerC + radius);
}

/* Bounding box of every revealed / flagged tile. */
function revealedBoundsOf(state){
  let r0 = Infinity, r1 = -Infinity, c0 = Infinity, c1 = -Infinity;
  for (let r = 0; r < state.rows; r++){
    for (let c = 0; c < state.cols; c++){
      if (!state.revealed[r][c] && !state.flagged[r][c]) continue;
      if (r < r0) r0 = r;
      if (r > r1) r1 = r;
      if (c < c0) c0 = c;
      if (c > c1) c1 = c;
    }
  }
  if (r0 === Infinity) return null;
  return { r0: r0, r1: r1, c0: c0, c1: c1 };
}

let reviewRafId = null;
function showMapReview(){
  if (!G.board || !G.myBoard) return;
  const isDuel = (G.config.mode === 'duel') && !!G.theirBoard;
  const isTerr = (G.config.mode === 'territory');
  const isInf  = isInfiniteSize(G.config.size);

  const theirLayout = (G.config.mode === 'duel') ? (G.theirBoardLayout || G.board) : G.board;

  /* ── Left (my) board: the ±N tile view ── */
  let smallWorld;
  if (isInf){
    const bounds = revealedBoundsOf(G.myBoard);
    let centerR = G.board.rows >> 1, centerC = G.board.cols >> 1;
    if (G.deathTile){
      centerR = G.deathTile.r; centerC = G.deathTile.c;
    } else if (bounds){
      centerR = Math.round((bounds.r0 + bounds.r1) / 2);
      centerC = Math.round((bounds.c0 + bounds.c1) / 2);
    }
    const clip = clipInfiniteReview(G.board, G.myBoard, centerR, centerC, INFINITE_REVEAL_RADIUS);
    smallWorld = {
      layout: clip.board,
      state: clip.state,
      death: G.deathTile
        ? { r: G.deathTile.r - clip.offsetR, c: G.deathTile.c - clip.offsetC }
        : null
    };
  } else {
    smallWorld = { layout: G.board, state: G.myBoard, death: G.deathTile };
  }

  /* ── Left (my) board: the whole uncovered region ── */
  let fullWorld = smallWorld;
  let hasFullWorld = false;
  if (isInf){
    const bounds = revealedBoundsOf(G.myBoard);
    if (bounds){
      const PAD = 4;
      const clip = clipInfiniteRegion(G.board, G.myBoard,
        bounds.r0 - PAD, bounds.r1 + PAD,
        bounds.c0 - PAD, bounds.c1 + PAD);
      if (clip.board.rows > smallWorld.layout.rows ||
          clip.board.cols > smallWorld.layout.cols){
        fullWorld = {
          layout: clip.board,
          state: clip.state,
          death: G.deathTile
            ? { r: G.deathTile.r - clip.offsetR, c: G.deathTile.c - clip.offsetC }
            : null
        };
        hasFullWorld = true;
      }
    }
  }

  function deriveWorld(w){
    const end  = buildEndReviewState(w.state, w.layout, w.death);
    const full = buildFullRevealState(w.state, w.layout);
    return {
      end: end,
      full: full,
      sol: w.death ? hideCellInState(end, w.death.r, w.death.c) : end,
      solFull: w.death ? hideCellInState(full, w.death.r, w.death.c) : full
    };
  }

  const smallDerived = deriveWorld(smallWorld);
  let fullDerived = null;
  const getFullDerived = () => {
    if (!fullDerived){
      fullDerived = (fullWorld === smallWorld) ? smallDerived : deriveWorld(fullWorld);
    }
    return fullDerived;
  };

  let themEnd = null, themFull = null, themSolution = null, themSolutionFull = null;
  if (isDuel){
    themEnd  = buildEndReviewState(G.theirBoard, theirLayout, G.theirDeathTile);
    themFull = buildFullRevealState(G.theirBoard, theirLayout);
    themSolution = G.theirDeathTile
      ? hideCellInState(themEnd, G.theirDeathTile.r, G.theirDeathTile.c) : themEnd;
    themSolutionFull = G.theirDeathTile
      ? hideCellInState(themFull, G.theirDeathTile.r, G.theirDeathTile.c) : themFull;
  }

  if (isDuel){
    if (!G.lossHintMe && smallWorld.layout && G.myBoard){
      G.lossHintMe = computeHintForBoard(
        smallWorld.layout, G.myBoard, null, false,
        G.deathTile ? G.deathTile.r : undefined,
        G.deathTile ? G.deathTile.c : undefined
      );
    }
    if (!G.lossHintThem && theirLayout && G.theirBoard){
      G.lossHintThem = computeHintForBoard(
        theirLayout, G.theirBoard, null, false,
        G.theirDeathTile ? G.theirDeathTile.r : undefined,
        G.theirDeathTile ? G.theirDeathTile.c : undefined
      );
    }
  }

  const hasHints = !isInf && !!(G.lossHintMe || G.lossHintThem);
  const hintBtnHtml = hasHints
    ? '<button id="btnShowHints">💡 SHOW SOLUTION</button>'
    : '';
  const fullMapBtnHtml = (isInf && hasFullWorld)
    ? '<button id="btnFullMap">🗺️ FULL MAP</button>'
    : '';

  const cells =
    '<div class="review-cell">' +
      '<canvas data-review="me"></canvas>' +
      (isDuel ? '<div class="review-label me">YOU</div>' : '') +
    '</div>' +
    (isDuel
      ? '<div class="review-cell">' +
          '<canvas data-review="them"></canvas>' +
          '<div class="review-label them">OPPONENT</div>' +
        '</div>'
      : '');

  modal.innerHTML =
    '<div class="ovbox mapreview">' +
      '<h2>MAP <span>REVIEW</span>' +
        (isInf ? ' · <span style="color:#b98cff">∞</span>' : '') + '</h2>' +
      '<div class="mapreview-canvas' + (isDuel ? ' two' : '') + '">' + cells + '</div>' +
      '<div class="mapreview-foot">' +
        hintBtnHtml +
        fullMapBtnHtml +
        '<button id="btnToggleView">🧩 REVEAL ALL</button>' +
        '<button class="ghost" id="btnCloseReview">CLOSE</button>' +
      '</div>' +
    '</div>';
  modal.classList.remove('hidden');

  const reviewConfigFor = (layout) => ({
    mode: G.config.mode,
    style: G.config.style,
    cols: layout.cols,
    rows: layout.rows,
    size: 'small'
  });

  const views = [];
  modal.querySelectorAll('canvas[data-review]').forEach(c => {
    const v = new BoardView(c);
    const cfg = reviewConfigFor(smallWorld.layout);
    v._reviewCfg = cfg;
    v.setConfig(cfg);
    if (isTerr) v.setOwnerPalette(myPalette());
    bindCanvasInput(v, false, true);
    views.push(v);
  });
  G.reviewViews = views;

  let showingFull = false;
  let showingHints = false;
  let showingFullMap = false;

  const draw = (now) => {
    reviewRafId = requestAnimationFrame(draw);
    const t = now + 60000;

    const useFullMap = isInf && showingFullMap && hasFullWorld;
    const meWorld = useFullMap ? fullWorld : smallWorld;
    const meDer   = useFullMap ? getFullDerived() : smallDerived;

    const meHints   = (showingHints && G.lossHintMe && !useFullMap)
      ? hintRenderState(G.lossHintMe) : null;
    const themHints = (showingHints && G.lossHintThem)
      ? hintRenderState(G.lossHintThem) : null;

    const meState = showingFull
      ? (showingHints ? meDer.solFull : meDer.full)
      : (showingHints ? meDer.sol     : meDer.end);

    const themState = showingFull
      ? (showingHints ? themSolutionFull : themFull)
      : (showingHints ? themSolution     : themEnd);

    const highlights = meWorld.death
      ? [{ r: meWorld.death.r, c: meWorld.death.c, color: '#ffe066' }]
      : [];

    if (views[0]){
      const combinedHints = isTerr ? mergeHintStates(meHints, themHints) : meHints;
      views[0].render(t, {
        board: meWorld.layout,
        boardState: meState,
        cursors: [],
        highlights: showingHints ? [] : highlights,
        hints: combinedHints
      });
    }
    if (views[1]){
      views[1].render(t, {
        board: theirLayout,
        boardState: themState,
        cursors: [],
        highlights: [],
        hints: themHints
      });
    }
  };
  reviewRafId = requestAnimationFrame(draw);

  const toggleBtn = modal.querySelector('#btnToggleView');
  toggleBtn.onclick = () => {
    showingFull = !showingFull;
    toggleBtn.textContent = showingFull ? '↩ END STATE' : '🧩 REVEAL ALL';
    toggleBtn.classList.toggle('primary', showingFull);
  };
  const hintBtn = modal.querySelector('#btnShowHints');
  if (hintBtn){
    hintBtn.onclick = () => {
      showingHints = !showingHints;
      hintBtn.textContent = showingHints ? '💡 HIDE SOLUTION' : '💡 SHOW SOLUTION';
      hintBtn.classList.toggle('primary', showingHints);
    };
  }
  const fullMapBtn = modal.querySelector('#btnFullMap');
  if (fullMapBtn){
    fullMapBtn.onclick = () => {
      showingFullMap = !showingFullMap;
      fullMapBtn.textContent = showingFullMap ? '🔍 ZOOM IN' : '🗺️ FULL MAP';
      fullMapBtn.classList.toggle('primary', showingFullMap);
      if (showingFullMap) getFullDerived();
      const w = (showingFullMap && hasFullWorld) ? fullWorld : smallWorld;
      const cfg = reviewConfigFor(w.layout);
      for (const v of views){
        v._reviewCfg = cfg;
        v.setConfig(cfg);
      }
    };
  }
  const closeReview = () => {
    if (reviewRafId){ cancelAnimationFrame(reviewRafId); reviewRafId = null; }
    views.forEach(v => v.destroy());
    G.reviewViews = [];
    modal.classList.add('hidden');
    modal.innerHTML = '';
    document.removeEventListener('keydown', onKey);
  };
  const onKey = e => { if (e.key === 'Escape') closeReview(); };
  modal.querySelector('#btnCloseReview').onclick = closeReview;
  modal.addEventListener('click', e => { if (e.target === modal) closeReview(); });
  document.addEventListener('keydown', onKey);
}

function maybeStartRematch(){
  if (G.state !== 'over') return;
  if (!G.rematchMe || !G.rematchThem) return;
  if (G.rematchLock) return;
  G.rematchLock = true;

  if (G.role === 'host'){
    const seedHost = newSeed();
    const seedGuest = newSeed();
    send({ t:'seed', seedHost, seedGuest, config: G.config });
    startMatch(seedHost, 'host', seedGuest);
  }
}

function refreshEndUI(){
  const msg = overlay.querySelector('#endMsg');
  if (!msg) return;
  const btn = overlay.querySelector('#btnAgain');

  if (G.opponentGone){
    msg.className = 'endmsg bad';
    msg.textContent = 'Opponent disconnected.';
    if (btn){ btn.disabled = true; }
    return;
  }
  if (G.rematchMe && !G.rematchThem){
    msg.className = 'endmsg';
    msg.innerHTML = '<span class="spin"></span>Waiting for other player…';
    if (btn){ btn.disabled = true; btn.textContent = 'WAITING…'; }
    return;
  }
  if (!G.rematchMe && G.rematchThem){
    msg.className = 'endmsg good';
    msg.textContent = 'Opponent wants a rematch!';
    if (btn){ btn.disabled = false; btn.textContent = 'REMATCH'; }
    return;
  }
  msg.className = 'endmsg';
  msg.textContent = '';
  if (btn){ btn.disabled = false; btn.textContent = 'REMATCH'; }
}

function endGame(result, icon, title, sub, elapsed, cards, opts){
  if (G.state === 'over') return;
  G.state = 'over';
  if (G.me) G.me.done = true;
  clearHeldKeys();

  opts = opts || {};
  const isInf = isInfiniteSize(G.config && G.config.size);

  G.rematchMe = false;
  G.rematchThem = false;
  G.rematchLock = false;

  const shouldRecord = !opts.skipRecord && G.config && elapsed > 0 &&
                       (result === 'win' || isInf);
  if (shouldRecord){
    const mode = G.config.mode;
    const isTeam = (mode === 'coop' || mode === 'territory');
    const partner = (isTeam && G.theirName && G.theirNameKey)
      ? { name: G.theirName, key: G.theirNameKey }
      : null;
    const tiles = G.myBoard ? G.myBoard.safeRevealed : 0;
    try {
      recordWin(
        mode,
        G.config.style,
        G.config.size,
        !!G.config.insta,
        Math.max(1, Math.round(elapsed)),
        true,
        partner,
        tiles
      ).catch(()=>{});
    } catch(e){}
  }

  const statusMap = {
    win:        ['VICTORY', 'live'],
    lose:       ['DEFEAT', 'bad'],
    draw:       ['DRAW', 'warn'],
    disconnect: ['DISCONNECTED', 'bad']
  };
  const s = statusMap[result] || ['MATCH OVER', 'warn'];
  setStatus(s[0], s[1]);

  let cardsHtml = cards;
  if (!cardsHtml){
    cardsHtml =
      '<div class="statcard"><div class="slabel">TIME</div><div class="sval">' + formatClock(elapsed) + '</div></div>';

    if (isInf){
      const tiles = G.myBoard ? G.myBoard.safeRevealed : 0;
      cardsHtml +=
        '<div class="statcard inf"><div class="slabel">TILES REVEALED</div><div class="sval">' + tiles + '</div></div>';
    } else if (usesStunPenalty()){
      cardsHtml +=
        '<div class="statcard"><div class="slabel">YOUR HITS</div><div class="sval">' + (G.me ? G.me.hits : 0) + '</div></div>';
      if (G.them){
        cardsHtml += '<div class="statcard lose"><div class="slabel">THEIR HITS</div><div class="sval">' + G.them.hits + '</div></div>';
      }
    } else {
      cardsHtml +=
        '<div class="statcard win"><div class="slabel">YOU REVEALED</div><div class="sval">' + myRevealedCount() + '</div></div>';
      if (G.them){
        cardsHtml += '<div class="statcard lose"><div class="slabel">THEY REVEALED</div><div class="sval">' + theirRevealedCount() + '</div></div>';
      }
    }

    if (!isInf){
      const pct = mapRevealStats();
      if (pct){
        cardsHtml +=
          '<div class="statcard win"><div class="slabel">YOU REVEALED</div><div class="sval">' + pct.mine.toFixed(0) + '%</div></div>' +
          '<div class="statcard lose"><div class="slabel">THEY REVEALED</div><div class="sval">' + pct.theirs.toFixed(0) + '%</div></div>';
      }
    }
  }

  const canRematch = !G.opponentGone &&
    (G.role === 'solo' || G.role === 'host' || G.role === 'guest');
  const canReview  = !!G.board && !!G.myBoard;

  const instaBadge = (G.config && G.config.insta)
    ? '<div style="margin-top:10px;font-size:11px;letter-spacing:.24em;font-weight:900;color:#ff9f43;text-shadow:0 0 12px rgba(255,159,67,.5)">INSTANT DIE MATCH</div>'
    : '';
  const infBadge = isInf
    ? '<div style="margin-top:10px;font-size:11px;letter-spacing:.24em;font-weight:900;color:#b98cff;text-shadow:0 0 14px rgba(185,140,255,.65)">INFINITE MODE</div>'
    : '';

  showOverlay(
    '<div class="ovbox">' +
      '<div class="big">' + icon + '</div>' +
      '<h2>' + title + '</h2>' +
      '<p>' + sub + '</p>' +
      instaBadge + infBadge +
      '<div class="statrow">' + cardsHtml + '</div>' +
      '<div class="ovbtns">' +
        (canRematch ? '<button class="primary" id="btnAgain">REMATCH</button>' : '') +
        (canReview ? '<button id="btnReview">VIEW MAP</button>' : '') +
        '<button class="ghost" id="btnMenu">MAIN MENU</button>' +
      '</div>' +
      '<div class="endmsg" id="endMsg"></div>' +
    '</div>'
  );

  const again = overlay.querySelector('#btnAgain');
  if (again) again.onclick = () => {
    if (G.role === 'solo'){ startMatch(newSeed(), 'solo'); return; }
    if (G.opponentGone || G.rematchMe) return;
    G.rematchMe = true;
    send({ t:'rematch' });
    maybeStartRematch();
    refreshEndUI();
  };

  const review = overlay.querySelector('#btnReview');
  if (review) review.onclick = () => showMapReview();
  overlay.querySelector('#btnMenu').onclick = () => { cleanupNet(); idleOverlay(); };

  refreshEndUI();

  if (result === 'win') SFX.win();
  else if (result === 'lose' || result === 'disconnect') SFX.lose();
}

let lastTheirBoardRender = 0;

function renderAll(now){
  if (!G.viewMe || !G.myBoard || !G.board || !G.me) return;

  /* Smooth pan-back-to-start animation. */
  if (G.viewAnim && G.viewAnim.active){
    const t = (now - G.viewAnim.startTime) / G.viewAnim.duration;
    if (t >= 1){
      G.viewMe.panX = G.viewAnim.targetPanX;
      G.viewMe.panY = G.viewAnim.targetPanY;
      G.viewAnim.active = false;
    } else {
      const e = easeOutCubic(clamp(t, 0, 1));
      G.viewMe.panX = G.viewAnim.startPanX + (G.viewAnim.targetPanX - G.viewAnim.startPanX) * e;
      G.viewMe.panY = G.viewAnim.startPanY + (G.viewAnim.targetPanY - G.viewAnim.startPanY) * e;
    }
  } else if (performance.now() < cursorActiveUntil && !isManualPanning() &&
             isInfiniteSize(G.config.size) && G.viewMe.metrics && G.viewMe.metrics.infinite){
    /* Gentle edge-based follow: only nudge the camera when the cursor
       was just moved by the arrow keys and is drifting near the edge
       of the view.  Skipped whenever WASD is held, and skipped after
       a short idle delay, so the player can freely pan with WASD to
       revisit any region of the map without the camera snapping back. */
    const p = hexOrSqCenter(G.viewMe, G.me.cursor.r, G.me.cursor.c);
    const scale = G.viewMe.baseScale * G.viewMe.zoom;
    const sx = p.x * scale + G.viewMe.panX;
    const sy = p.y * scale + G.viewMe.panY;
    const marginX = Math.min(60, G.viewMe.pw * 0.15);
    const marginY = Math.min(60, G.viewMe.ph * 0.15);
    let dx = 0, dy = 0;
    if (sx < marginX) dx = marginX - sx;
    else if (sx > G.viewMe.pw - marginX) dx = (G.viewMe.pw - marginX) - sx;
    if (sy < marginY) dy = marginY - sy;
    else if (sy > G.viewMe.ph - marginY) dy = (G.viewMe.ph - marginY) - sy;
    if (dx || dy){
      G.viewMe.panX += dx * 0.18;
      G.viewMe.panY += dy * 0.18;
      G.viewMe.clampPan();
    }
  }

  const myColor = '#4dd8ff';
  const cursors = [{ r: G.me.cursor.r, c: G.me.cursor.c, color: myColor }];
  G.viewMe.render(now, { board: G.board, boardState: G.myBoard, cursors });

  if (G.viewThem && G.theirBoard){
    if (now - lastTheirBoardRender >= OPPONENT_RENDER_MS){
      lastTheirBoardRender = now;
      const layout = (G.config.mode === 'duel')
        ? (G.theirBoardLayout || G.board)
        : G.board;
      G.viewThem.render(now, {
        board: layout,
        boardState: G.theirBoard,
        cursors: []
      });
    }
  }
  updateHUD(now);
  maybeCheckTerritoryUnlock(now);
}

function updateHUD(now){
  if (!G.board || !G.myBoard || !G.me) return;
  const mode = G.config.mode;
  const bs = G.myBoard;
  const isInf = isInfiniteSize(G.config.size);
  const elapsed = (G.state === 'playing' || G.state === 'over')
    ? Math.max(0, now - G.startTime) : 0;

  const els = G.panelMe && G.panelMe._els;
  if (els){
    if (mode === 'territory'){
      const mine   = countLand(bs, G.myOwner);
      const theirs = countLand(bs, G.theirOwner);
      const total  = Math.max(1, mine + theirs);
      setText(els.myLand, mine);
      setText(els.theirLand, theirs);
      setText(els.time, formatClock(elapsed));
      setText(els.hits, G.me.hits);
      if (els.myBar)    els.myBar.style.width    = (mine / total * 100).toFixed(1) + '%';
      if (els.theirBar) els.theirBar.style.width = (theirs / total * 100).toFixed(1) + '%';
    } else {
      if (!isInf) setText(els.mines, Math.max(0, G.board.mineCount - bs.flagCount));
      setText(els.time, formatClock(elapsed));
      setText(els.hits, G.me.hits);
      setText(els.revealed, myRevealedCount());
      if (els.bar && !isInf){
        els.bar.style.width = (bs.safeRevealed / Math.max(1, G.board.safeCount) * 100).toFixed(1) + '%';
      }
    }
    if (els.stun){
      const rem = G.me.stunUntil - now;
      if (rem > 0 && G.state === 'playing'){
        els.stun.classList.add('on');
        setStunFace(els.stun, G.me.stunReason);
        setText(els.stun.querySelector('[data-timer]'), (rem / 1000).toFixed(1));
      } else {
        els.stun.classList.remove('on');
      }
    }
    if (els.oppStun){
      const rem = G.them ? (G.them.stunUntil - now) : 0;
      if (rem > 0 && G.state === 'playing'){
        const ice = G.them && G.them.stunReason === 'flag';
        els.oppStun.classList.add('on');
        els.oppStun.classList.toggle('ice', !!ice);
        const oe = els.oppStun.querySelector('[data-oemoji]');
        if (oe) setText(oe, ice ? '❄️' : '💥');
        setText(els.oppStun.querySelector('b'), (rem / 1000).toFixed(1));
      } else {
        els.oppStun.classList.remove('on');
      }
    }
  }
  if (G.panelThem && G.panelThem._els && G.theirBoard){
    const layout = (G.config.mode === 'duel') ? (G.theirBoardLayout || G.board) : G.board;
    const te = G.panelThem._els;
    setText(te.mines, Math.max(0, (layout ? layout.mineCount : 0) - G.theirBoard.flagCount));
    setText(te.time, formatClock(elapsed));
    setText(te.hits, G.them ? G.them.hits : 0);
    setText(te.revealed, theirRevealedCount());
    if (te.bar && layout) {
      te.bar.style.width = (G.theirBoard.safeRevealed / Math.max(1, layout.safeCount) * 100).toFixed(1) + '%';
    }
    if (te.stun){
      const rem = G.them ? (G.them.stunUntil - now) : 0;
      if (rem > 0 && G.state === 'playing'){
        te.stun.classList.add('on');
        setStunFace(te.stun, G.them ? G.them.stunReason : 'bomb');
        setText(te.stun.querySelector('[data-timer]'), (rem / 1000).toFixed(1));
      } else {
        te.stun.classList.remove('on');
      }
    }
  }
}

let lastFrameTime = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (!lastFrameTime) lastFrameTime = now;
  const elapsed = now - lastFrameTime;
  if (elapsed < FRAME_MIN_MS) return;
  lastFrameTime = now - (elapsed % FRAME_MIN_MS);
  const dt = Math.min(elapsed, 100);
  try { updatePanFromKeys(dt); } catch(e){}
  try { updateZoomFromKeys(dt); } catch(e){}
  try { renderAll(now); } catch(e){}
}
requestAnimationFrame(loop);

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => {
  if (e.target && e.target.tagName === 'CANVAS') e.preventDefault();
}, { passive:false });
window.addEventListener('pointerdown', function unlock(){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch(e){}
  window.removeEventListener('pointerdown', unlock);
}, { once:true });
window.addEventListener('beforeunload', e => {
  if (G.conn && G.conn.open && G.state !== 'lobby'){
    try { G.conn.send({ t:'bye' }); } catch(err){}
  }
  if (G.state === 'playing' || G.state === 'countdown'){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
window.addEventListener('pagehide', () => {
  if (G.conn && G.conn.open && G.state !== 'lobby'){
    try { G.conn.send({ t:'bye' }); } catch(err){}
  }
});

idleOverlay();

(async function boot(){
  try {
    await fbReadyPromise;
    const ok = await ensurePlayerName();

    booted = true;

    if (G.state !== 'lobby') return;

    if (ok){
      isGuest = false;
      renderMenu('');
      refreshLeaderboard(true);
    } else {
      showNameEntryPopup({
        onSuccess: () => {
          menuView = 'main';
          renderMenu('');
          refreshLeaderboard(true);
        },
        onGuest: () => {
          isGuest = true;
          menuView = 'main';
          renderMenu('');
          refreshLeaderboard(true);
        }
      });
    }
  } catch(e){
    console.warn('[boot] failed:', e);
    booted = true;
    renderMenu('');
  }
})();

})();
</script>
</body>
</html>
