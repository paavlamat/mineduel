async function reserveName(rawName, uid){
  if (!db) throw new Error('Not connected');
  if (!uid) throw new Error('Not signed in');
  const v = validateName(rawName);
  if (v.error) throw new Error(v.error);
  const { name, key } = v;
  const nameRef = db.collection('names').doc(key);
  const userRef = db.collection('users').doc(uid);

  await db.runTransaction(async tx => {
    const nameSnap = await tx.get(nameRef);
    if (nameSnap.exists){
      const data = nameSnap.data() || {};
      const uids = data.linkedUids || [];
      if (uids.indexOf(uid) === -1) throw new Error('That name is already taken');
      tx.set(userRef, {
        name: data.displayName || name,
        nameKey: key,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      return;
    }
    tx.set(nameRef, {
      displayName: name,
      count: 1,
      linkedUids: [uid],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    tx.set(userRef, {
      name: name,
      nameKey: key,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  });

  console.log('[fb] reserved name "' + name + '" for uid', uid);
  return { name, key };
}

async function migrateLeaderboardEntry(oldKey, newKey, newName){
  if (!db || !oldKey || !newKey || oldKey === newKey) return;
  if (!auth || !auth.currentUser) return;

  let touched = false;
  for (const configKey of LB_CONFIG_KEYS){
    const oldRef = db.collection('leaderboards').doc(configKey).collection('entries').doc(oldKey);
    const newRef = db.collection('leaderboards').doc(configKey).collection('entries').doc(newKey);

    let oldSnap;
    try { oldSnap = await oldRef.get(); }
    catch(e){ continue; }
    if (!oldSnap.exists) continue;
    const oldData = oldSnap.data() || {};

    let newSnap = null;
    try { newSnap = await newRef.get(); }
    catch(e){ newSnap = null; }

    const doc = {
      name: newName,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (typeof oldData.wins === 'number') doc.wins = oldData.wins;
    if (typeof oldData.bestTime === 'number') doc.bestTime = oldData.bestTime;
    if (typeof oldData.bestTiles === 'number') doc.bestTiles = oldData.bestTiles;
    if (oldData.partnerName) doc.partnerName = oldData.partnerName;

    if (newSnap && newSnap.exists){
      const nd = newSnap.data() || {};
      doc.wins = (nd.wins || 0) + (oldData.wins || 0);
      const times = [nd.bestTime, oldData.bestTime]
        .filter(t => typeof t === 'number' && t > 0);
      if (times.length) doc.bestTime = Math.min.apply(null, times);
      else delete doc.bestTime;
      const tilesArr = [nd.bestTiles, oldData.bestTiles]
        .filter(t => typeof t === 'number' && t > 0);
      if (tilesArr.length) doc.bestTiles = Math.max.apply(null, tilesArr);
      else delete doc.bestTiles;
      if (!doc.partnerName && nd.partnerName) doc.partnerName = nd.partnerName;
    }

    try {
      await newRef.set(doc);
      await oldRef.delete();
      touched = true;
    } catch(e){
      console.warn('[fb] migrate entry failed for', configKey,
                   e && (e.code || e.message));
    }
  }

  if (touched) lbCache.clear();
}

async function migrateTeamEntries(oldKey, newKey, newName){
  if (!db || !auth || !auth.currentUser) return false;
  if (!oldKey || !newKey || oldKey === newKey) return false;

  let touched = false;

  for (const configKey of LB_CONFIG_KEYS){
    let snap;
    try {
      snap = await db.collection('leaderboards').doc(configKey)
        .collection('entries')
        .where('nameKeys', 'array-contains', oldKey)
        .get();
    } catch(e){
      console.warn('[fb] team entry lookup failed for', configKey,
                   e && (e.code || e.message));
      continue;
    }
    if (snap.empty) continue;

    const items = [];
    snap.forEach(d => {
      const data = d.data() || {};
      if (!Array.isArray(data.nameKeys)) return;
      items.push({ ref: d.ref, data });
    });

    for (const item of items){
      const ref  = item.ref;
      const data = item.data;
      const oldKeys  = data.nameKeys.slice();
      const oldNames = (Array.isArray(data.names) && data.names.length === oldKeys.length)
        ? data.names.slice()
        : oldKeys.slice();

      const idx = oldKeys.indexOf(oldKey);
      if (idx === -1) continue;

      const newKeys  = oldKeys.slice();
      const newNames = oldNames.slice();
      newKeys[idx]  = newKey;
      newNames[idx] = newName;

      const pairs = newKeys.map((k, i) => ({ k, n: newNames[i] }));
      pairs.sort((a, b) => a.k < b.k ? -1 : a.k > b.k ? 1 : 0);
      const sortedKeys  = pairs.map(p => p.k);
      const sortedNames = pairs.map(p => p.n);
      const newPairId = sortedKeys.join('__');

      const oldSortedKeys = oldKeys.slice().sort();
      const oldPairId = oldSortedKeys.join('__');

      if (newPairId === oldPairId){
        try {
          await ref.update({
            names: sortedNames,
            nameKeys: sortedKeys,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          touched = true;
        } catch(e){
          console.warn('[fb] team entry update failed:', e && (e.code || e.message));
        }
        continue;
      }

      const newRef = db.collection('leaderboards').doc(configKey)
                       .collection('entries').doc(newPairId);

      let newSnap = null;
      try { newSnap = await newRef.get(); }
      catch(e){ newSnap = null; }

      const doc = {
        names:    sortedNames,
        nameKeys: sortedKeys,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (typeof data.bestTime === 'number' && data.bestTime > 0){
        doc.bestTime = data.bestTime;
      }
      if (typeof data.bestTiles === 'number' && data.bestTiles > 0){
        doc.bestTiles = data.bestTiles;
      }
      if (typeof data.wins === 'number') doc.wins = data.wins;

      if (newSnap && newSnap.exists){
        const nd = newSnap.data() || {};
        if (typeof nd.wins === 'number' || typeof data.wins === 'number'){
          doc.wins = (nd.wins || 0) + (data.wins || 0);
        }
        const times = [nd.bestTime, data.bestTime]
          .filter(t => typeof t === 'number' && t > 0);
        if (times.length) doc.bestTime = Math.min.apply(null, times);
        else delete doc.bestTime;
        const tilesArr = [nd.bestTiles, data.bestTiles]
          .filter(t => typeof t === 'number' && t > 0);
        if (tilesArr.length) doc.bestTiles = Math.max.apply(null, tilesArr);
        else delete doc.bestTiles;
      }

      try {
        await newRef.set(doc);
        await ref.delete();
        touched = true;
      } catch(e){
        console.warn('[fb] team entry migrate failed for', configKey,
                     e && (e.code || e.message));
      }
    }
  }

  return touched;
}

async function changePlayerName(newRaw){
  const v = validateName(newRaw);
  if (v.error) throw new Error(v.error);
  const newName = v.name;
  const newKey = v.key;
  if (!auth || !auth.currentUser) throw new Error('Not signed in');
  const uid = auth.currentUser.uid;
  const oldKey = getPlayerNameKey();
  const oldName = getPlayerName();

  if (newKey === oldKey){
    setPlayerName(newName);
    setPlayerNameKey(newKey);
    await db.collection('users').doc(uid).set({
      name: newName, nameKey: newKey,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    return { name: newName, oldName };
  }

  const newRef = db.collection('names').doc(newKey);
  const userRef = db.collection('users').doc(uid);
  const oldRef = oldKey ? db.collection('names').doc(oldKey) : null;

  await db.runTransaction(async tx => {
    const newSnap = await tx.get(newRef);
    if (newSnap.exists){
      const nd = newSnap.data() || {};
      const uids = nd.linkedUids || [];
      if (uids.indexOf(uid) === -1) throw new Error('That name is already taken');
    } else {
      tx.set(newRef, {
        displayName: newName,
        count: 1,
        linkedUids: [uid],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    tx.set(userRef, {
      name: newName, nameKey: newKey,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  });

  let oldBecameEmpty = false;
  if (oldRef){
    try {
      const check = await oldRef.get();
      if (!check.exists){
        oldBecameEmpty = true;
      } else {
        const data = check.data() || {};
        const others = (data.linkedUids || []).filter(u => u !== uid);
        oldBecameEmpty = (others.length === 0);
      }
    } catch(e){}
  }

  if (oldBecameEmpty && oldKey){
    await migrateLeaderboardEntry(oldKey, newKey, newName).catch(()=>{});
    await migrateTeamEntries(oldKey, newKey, newName).catch(()=>{});
    lbCache.clear();
  }

  if (oldRef){
    try {
      await db.runTransaction(async tx => {
        const oldSnap = await tx.get(oldRef);
        if (oldSnap && oldSnap.exists){
          const data = oldSnap.data() || {};
          const uids = (data.linkedUids || []).filter(u => u !== uid);
          if (uids.length === 0) tx.delete(oldRef);
          else tx.update(oldRef, { count: uids.length, linkedUids: uids });
        }
      });
    } catch(e){
      console.warn('[fb] release old name failed:', e && (e.code || e.message));
    }
  }

  setPlayerName(newName);
  setPlayerNameKey(newKey);
  return { name: newName, oldName };
}

async function applyLinkedName(hostName, hostKey){
  if (!auth){
    throw new Error('Auth not available');
  }
  if (!auth.currentUser){
    const u = await trySignIn();
    if (!u) throw new Error('Not signed in — check your connection');
  }
  const uid = auth.currentUser.uid;
  const newRef = db.collection('names').doc(hostKey);
  const userRef = db.collection('users').doc(uid);
  const oldKey = getPlayerNameKey();
  const oldName = getPlayerName();
  const oldRef = (oldKey && oldKey !== hostKey) ? db.collection('names').doc(oldKey) : null;

  let displayName = hostName;

  await db.runTransaction(async tx => {
    const newSnap = await tx.get(newRef);
    if (!newSnap.exists) throw new Error('That name is no longer available');
    const nd = newSnap.data() || {};
    displayName = nd.displayName || hostName;
    const uids = nd.linkedUids || [];

    if (uids.indexOf(uid) === -1){
      tx.update(newRef, {
        count: (nd.count || 0) + 1,
        linkedUids: uids.concat([uid])
      });
    }
    tx.set(userRef, {
      name: displayName, nameKey: hostKey,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  });

  let oldBecameEmpty = false;
  if (oldRef){
    try {
      const check = await oldRef.get();
      if (!check.exists) oldBecameEmpty = true;
      else {
        const data = check.data() || {};
        const others = (data.linkedUids || []).filter(u => u !== uid);
        oldBecameEmpty = (others.length === 0);
      }
    } catch(e){}
  }

  if (oldBecameEmpty && oldKey){
    await migrateLeaderboardEntry(oldKey, hostKey, displayName).catch(()=>{});
    await migrateTeamEntries(oldKey, hostKey, displayName).catch(()=>{});
    lbCache.clear();
  }

  if (oldRef){
    try {
      await db.runTransaction(async tx => {
        const oldSnap = await tx.get(oldRef);
        if (oldSnap && oldSnap.exists){
          const data = oldSnap.data() || {};
          const uids = (data.linkedUids || []).filter(u => u !== uid);
          if (uids.length === 0) tx.delete(oldRef);
          else tx.update(oldRef, { count: uids.length, linkedUids: uids });
        }
      });
    } catch(e){}
  }

  setPlayerName(displayName);
  setPlayerNameKey(hostKey);
  return { name: displayName, oldName };
}

async function removeLeaderboardEntries(nameKey){
  if (!db || !nameKey) return;

  const CHUNK = 8;
  for (let i = 0; i < LB_CONFIG_KEYS.length; i += CHUNK){
    const slice = LB_CONFIG_KEYS.slice(i, i + CHUNK);
    const batch = db.batch();
    for (const key of slice){
      batch.delete(
        db.collection('leaderboards').doc(key).collection('entries').doc(nameKey)
      );
    }
    try {
      await batch.commit();
    } catch(e){
      console.warn('[fb] remove entries chunk failed:', e && (e.code || e.message));
    }
  }

  for (const configKey of LB_CONFIG_KEYS){
    let snap;
    try {
      snap = await db.collection('leaderboards').doc(configKey)
        .collection('entries')
        .where('nameKeys', 'array-contains', nameKey)
        .get();
    } catch(e){
      console.warn('[fb] team entry lookup failed for', configKey,
                   e && (e.code || e.message));
      continue;
    }
    if (snap.empty) continue;

    const batch = db.batch();
    let n = 0;
    snap.forEach(d => {
      const data = d.data() || {};
      if (!Array.isArray(data.nameKeys)) return;
      batch.delete(d.ref);
      n++;
    });
    if (!n) continue;
    try {
      await batch.commit();
    } catch(e){
      console.warn('[fb] remove team entries failed for', configKey,
                   e && (e.code || e.message));
    }
  }

  lbCache.clear();
}

async function removePlayerName(){
  const nameKey = getPlayerNameKey();
  const oldName = getPlayerName();

  await fbReadyPromise;

  if (db && auth && nameKey){
    let user = auth.currentUser;
    if (!user) user = await trySignIn();

    if (user){
      const uid = user.uid;
      const nameRef = db.collection('names').doc(nameKey);
      const userRef = db.collection('users').doc(uid);

      let nameFullyReleased = false;
      try {
        const snap = await nameRef.get();
        if (snap.exists){
          const data = snap.data() || {};
          const linked = data.linkedUids || [];
          nameFullyReleased = (linked.filter(u => u !== uid).length === 0);
        }
      } catch(e){}

      if (nameFullyReleased){
        await removeLeaderboardEntries(nameKey);
      }

      try {
        await db.runTransaction(async tx => {
          const snap = await tx.get(nameRef);
          if (snap.exists){
            const data = snap.data() || {};
            const linked = data.linkedUids || [];
            const uids = linked.filter(u => u !== uid);
            if (uids.length === 0){
              tx.delete(nameRef);
            } else {
              tx.update(nameRef, { count: uids.length, linkedUids: uids });
            }
          }
          tx.set(userRef, {
            name: '',
            nameKey: '',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        });
        console.log('[fb] released name "' + oldName + '" from uid', uid);
      } catch(e){
        console.warn('[fb] removePlayerName:', e && (e.code || e.message));
      }
    }
  }

  clearPlayerName();
  return { name: oldName };
}

function renderLeaderboardRows(mode, cat){
  if (LB_STATE.loading){
    return '<div class="lb-empty"><span class="spin"></span>Loading…</div>';
  }
  if (LB_STATE.error){
    return '<div class="lb-empty">' + escapeHtml(LB_STATE.error) + '</div>';
  }
  if (!LB_STATE.data.length){
    return '<div class="lb-empty">No scores yet.<br>Be the first!</div>';
  }
  const joint = (mode === 'coop' || mode === 'territory');
  const myKey = getPlayerNameKey();
  const myName = getPlayerName();

  return LB_STATE.data.map((e, i) => {
    let nm = 'Anon';
    let isMe = false;

    if (Array.isArray(e.nameKeys) && e.nameKeys.length){
      const names = (Array.isArray(e.names) && e.names.length) ? e.names : e.nameKeys;
      nm = names.join(' & ');
      if (!isGuest && myKey) isMe = e.nameKeys.indexOf(myKey) !== -1;
    } else {
      nm = e.name || 'Anon';
      if (joint && e.partnerName) nm = nm + ' & ' + e.partnerName;
      if (!isGuest && myKey){
        if (e.id === myKey) isMe = true;
        else if (joint && e.partnerName && e.partnerName.toLowerCase() === myKey) isMe = true;
        else if (joint && myName && e.partnerName === myName) isMe = true;
      }
    }

    let val, cls = '', title = '';
    if (cat === 'tiles'){
      val = formatTiles(e.bestTiles);
      cls = ' tiles';
      title = tilesTitle(e);
    }
    else if (cat === 'time'){ val = formatTime(e.bestTime); }
    else { val = formatWins(e.wins); cls = ' wins'; }

    return '<div class="lb-row' + (isMe ? ' me' : '') + cls + '"' + title + '>' +
      '<span class="lb-rank">' + (i + 1) + '</span>' +
      '<span class="lb-name">' + escapeHtml(nm) + '</span>' +
      '<span class="lb-val">' + val + '</span>' +
    '</div>';
  }).join('');
}

let lbSeq = 0;

async function refreshLeaderboard(force){
  const mode = G.config.mode;
  const style = G.config.style;
  const size = G.config.size;
  const insta = !!G.config.insta;
  const cat = currentLbCategory();
  const key = lbKey(mode, style, size, insta) + '_' + cat;

  const seq = ++lbSeq;
  LB_STATE.currentKey = key;
  LB_STATE.error = null;

  if (!db){
    LB_STATE.loading = false;
    LB_STATE.data = [];
    LB_STATE.error = 'Leaderboard offline';
    if (overlay.querySelector('.menu-lb')) updateLeaderboardDOM();
    return;
  }

  if (!force){
    const cached = lbCache.get(key);
    if (cached && (Date.now() - cached.ts < LB_TTL)){
      LB_STATE.loading = false;
      LB_STATE.data = cached.data;
      if (overlay.querySelector('.menu-lb')) updateLeaderboardDOM();
      return;
    }
  }

  LB_STATE.loading = true;
  LB_STATE.data = [];
  if (overlay.querySelector('.menu-lb')) updateLeaderboardDOM();

  try {
    const data = await fetchLeaderboard(mode, style, size, cat, insta);
    if (seq !== lbSeq || LB_STATE.currentKey !== key) return;
    lbCache.set(key, { data, ts: Date.now() });
    LB_STATE.loading = false;
    LB_STATE.data = data;
    LB_STATE.error = null;
    if (overlay.querySelector('.menu-lb')) updateLeaderboardDOM();
  } catch(e){
    console.warn('[fb] fetch leaderboard failed:', e && (e.code || e.message || e));
    if (seq !== lbSeq || LB_STATE.currentKey !== key) return;
    LB_STATE.loading = false;
    LB_STATE.error = 'Could not load';
    LB_STATE.data = [];
    if (overlay.querySelector('.menu-lb')) updateLeaderboardDOM();
  }
}

const OV_GROUPS = [
  { mode:'solo',      insta:false, label:'SOLO' },
  { mode:'coop',      insta:false, label:'CO-OP' },
  { mode:'duel',      insta:false, label:'DUEL' },
  { mode:'duel',      insta:true,  label:'DUEL · INSTANT' },
  { mode:'territory', insta:false, label:'TERRITORIAL' },
  { mode:'territory', insta:true,  label:'TERRITORIAL · INSTANT' },
  { mode:'solo',      insta:false, label:'SOLO · INFINITE', sizeFilter:'infinite' },
  { mode:'coop',      insta:false, label:'CO-OP · INFINITE', sizeFilter:'infinite' }
];

async function fetchTopForConfig(g, style, size, cat, limit){
  const key = lbKey(g.mode, style, size, g.insta);
  const col = db.collection('leaderboards').doc(key).collection('entries');
  let q;
  if (cat === 'tiles'){
    q = col.orderBy('bestTiles', 'desc').limit(limit);
  } else if (cat === 'time'){
    if (g.mode === 'duel' || g.mode === 'territory') return [];
    q = col.orderBy('bestTime', 'asc').limit(limit);
  } else {
    q = col.orderBy('wins', 'desc').limit(limit);
  }
  const snap = await q.get();
  const out = [];
  snap.forEach(d => out.push(Object.assign({ id: d.id }, d.data())));
  return out;
}

async function fetchOverviewData(cat){
  const all = [];
  for (const g of OV_GROUPS){
    if (cat === 'time' && (g.mode === 'duel' || g.mode === 'territory')) continue;
    if (cat === 'tiles' && !g.sizeFilter) continue;
    if (cat !== 'tiles' && g.sizeFilter) continue;
    const sizes = g.sizeFilter ? [g.sizeFilter] : ['small','medium','large'];
    for (const style of ['square','hex']){
      for (const size of sizes){
        all.push({ g, style, size });
      }
    }
  }
  const results = [];
  const CHUNK = 6;
  for (let i = 0; i < all.length; i += CHUNK){
    const slice = all.slice(i, i + CHUNK);
    const chunkRes = await Promise.all(slice.map(item =>
      fetchTopForConfig(item.g, item.style, item.size, cat, 3)
        .then(entries => ({ g: item.g, style: item.style, size: item.size, entries }))
        .catch(() => ({ g: item.g, style: item.style, size: item.size, entries: [] }))
    ));
    for (const r of chunkRes) results.push(r);
  }
  return results;
}

function renderOverviewData(cat, data){
  const body = overlay.querySelector('#lbOvBody');
  if (!body) return;

  const grouped = new Map();
  for (const item of data){
    const k = item.g.label;
    if (!grouped.has(k)) grouped.set(k, []);
    grouped.get(k).push(item);
  }

  const myKey = getPlayerNameKey();
  const rankCls = ['', ' r1', ' r2', ' r3'];

  function renderCard(item){
    const styleName = (STYLES[item.style] || {}).name || item.style;
    const sizeName  = (SIZES[item.size] || {}).name || item.size;
    const styleCls  = (item.style === 'hex') ? ' hex' : '';
    const sizeCls   = (item.size === 'small') ? ' green'
                    : (item.size === 'medium') ? ' yellow'
                    : (item.size === 'large') ? ' red'
                    : (item.size === 'infinite') ? ' infinite' : '';

    let html = '<div class="lb-ov-card">';
    html += '<div class="lb-ov-card-title">' +
              '<span class="sty' + styleCls + '">' + escapeHtml(styleName) + '</span>' +
              '<span class="sep">·</span>' +
              '<span class="sz' + sizeCls + '">' + escapeHtml(sizeName) + '</span>' +
            '</div>';

    if (!item.entries.length){
      html += '<div class="lb-ov-empty">— no scores yet —</div>';
    } else {
      item.entries.forEach((e, i) => {
        let nm;
        if (Array.isArray(e.nameKeys) && e.nameKeys.length){
          const names = (Array.isArray(e.names) && e.names.length) ? e.names : e.nameKeys;
          nm = names.join(' & ');
        } else {
          nm = e.name || 'Anon';
        }
        let val, title = '';
        if (cat === 'tiles'){
          val = formatTiles(e.bestTiles);
          title = tilesTitle(e);
        }
        else if (cat === 'time') val = formatTime(e.bestTime);
        else val = formatWins(e.wins);

        const isMe = !isGuest && myKey && (
          e.id === myKey ||
          (Array.isArray(e.nameKeys) && e.nameKeys.indexOf(myKey) !== -1)
        );

        html += '<div class="lb-ov-row' + (rankCls[i + 1] || '') + (isMe ? ' me' : '') + '"' + title + '>' +
          '<span class="lb-ov-rank">' + (i + 1) + '</span>' +
          '<span class="lb-ov-name">' + escapeHtml(nm) + '</span>' +
          '<span class="lb-ov-val">' + val + '</span>' +
        '</div>';
      });
    }
    html += '</div>';
    return html;
  }

  let html = '';

  grouped.forEach((items, label) => {
    const isInsta = label.indexOf('INSTA') !== -1;
    const isInf = label.indexOf('INFINITE') !== -1;
    let cls = '';
    if (isInsta) cls = ' insta';
    else if (isInf) cls = ' inf';

    const squareItems = items.filter(it => it.style === 'square');
    const hexItems = items.filter(it => it.style === 'hex');

    html += '<div class="lb-ov-group">';
    html += '<div class="lb-ov-group-title' + cls + '">' +
              '<span class="lb-ov-group-name">' + escapeHtml(label) + '</span>' +
            '</div>';

    if (squareItems.length){
      html += '<div class="lb-ov-grid">';
      for (const item of squareItems) html += renderCard(item);
      html += '</div>';
    }

    if (hexItems.length){
      html += '<div class="lb-ov-grid" style="margin-top:clamp(10px,1.5vh,16px)">';
      for (const item of hexItems) html += renderCard(item);
      html += '</div>';
    }

    html += '</div>';
  });

  body.innerHTML = html;
  scheduleMenuFit();
}

let fitRaf1 = 0, fitRaf2 = 0;
function fitMenuBox(){
  const box = overlay.querySelector('.ovbox.menu-pop');
  if (!box || !box.parentElement) return;

  box.style.zoom = '';
  box.style.maxHeight = 'none';
  box.style.overflowY = 'hidden';
  void box.offsetHeight;

  const ovStyle = getComputedStyle(overlay);
  const padTop    = parseFloat(ovStyle.paddingTop)    || 0;
  const padBottom = parseFloat(ovStyle.paddingBottom) || 0;
  const padLeft   = parseFloat(ovStyle.paddingLeft)   || 0;
  const padRight  = parseFloat(ovStyle.paddingRight)  || 0;

  const availH = Math.max(120, overlay.clientHeight - padTop - padBottom);
  const availW = Math.max(120, overlay.clientWidth  - padLeft - padRight);

  const h = box.offsetHeight;
  const w = box.offsetWidth;

  let scale = 1;
  if (h > availH) scale = Math.min(scale, availH / h);
  if (w > availW) scale = Math.min(scale, availW / w);
  scale = Math.max(scale, 0.55);

  let maxH;
  if (scale < 0.999 && supportsZoom()){
    box.style.zoom = scale.toFixed(3);
    maxH = Math.ceil(availH / scale);
  } else {
    maxH = Math.floor(availH);
  }
  box.style.maxHeight = maxH + 'px';
  box.style.overflowY = (h > maxH + 8) ? 'auto' : 'hidden';
}

function scheduleMenuFit(){
  if (fitRaf1) cancelAnimationFrame(fitRaf1);
  if (fitRaf2) clearTimeout(fitRaf2);
  fitRaf1 = requestAnimationFrame(() => { fitRaf1 = 0; fitMenuBox(); });
  fitRaf2 = setTimeout(() => { fitRaf2 = 0; fitMenuBox(); }, 90);
}

let zoomSupported = null;
function supportsZoom(){
  if (zoomSupported !== null) return zoomSupported;
  try {
    zoomSupported = !!(window.CSS && CSS.supports && CSS.supports('zoom', '0.5'));
  } catch(e){ zoomSupported = false; }
  return zoomSupported;
}

function showOverlay(html){
  overlay.innerHTML = html;
  overlay.classList.remove('hidden');
  document.body.classList.add('menu-open');
  scheduleMenuFit();

function hideOverlay(){

}

let confirmOpen = false;
function confirmDialog(opts){
  const o = opts || {};
  return new Promise(resolve => {
    if (confirmOpen){ resolve(false); return; }
    confirmOpen = true;
    modal.innerHTML =
      '<div class="ovbox confirm">' +
        '<h2>' + (o.title || 'ARE YOU SURE?') + '</h2>' +
        '<p>' + (o.message || '') + '</p>' +
        '<div class="ovbtns">' +
          '<button class="ghost" data-cf="no">' + (o.cancel || 'CANCEL') + '</button>' +
          '<button class="danger" data-cf="yes">' + (o.ok || 'CONFIRM') + '</button>' +
        '</div>' +
      '</div>';
    modal.classList.remove('hidden');
    let settled = false;
    const finish = v => {
      if (settled) return;
      settled = true; confirmOpen = false;
      modal.classList.add('hidden'); modal.innerHTML = '';
      document.removeEventListener('keydown', onKey);
      resolve(v);
    };
    const onKey = e => {
      if (e.key === 'Escape') finish(false);
      if (e.key === 'Enter')  finish(true);
    };
    modal.querySelector('[data-cf="yes"]').onclick = () => finish(true);
    modal.querySelector('[data-cf="no"]').onclick  = () => finish(false);
    modal.addEventListener('click', e => { if (e.target === modal) finish(false); });
    document.addEventListener('keydown', onKey);
  });
}

class BoardView {
  constructor(canvas){
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.config = null;
    this.metrics = null;
    this.baseScale = 1;
    this.zoom = 1; this.panX = 0; this.panY = 0;
    this.maxZoom = 5;
    this.minZoom = 1;
    this.pw = 1; this.ph = 1;
    this.particles = [];
    this.shake = 0;
    this.lastT = performance.now();
    this.ro = null;
    this._mineSprite = null;
    this.ownerTint   = [null, 'rgba(77,216,255,.17)', 'rgba(255,61,129,.17)'];
    this.ownerEdge   = [null, 'rgba(77,216,255,.62)', 'rgba(255,61,129,.62)'];
    this.ownerSolid  = [null, '#4dd8ff', '#ff3d81'];
    this.ownerTintMine = [null, 'rgba(77,216,255,.28)', 'rgba(255,61,129,.28)'];
  }
  setOwnerPalette(map){
    this.ownerTint     = [null, map[1].tint,     map[2].tint];
    this.ownerEdge     = [null, map[1].edge,     map[2].edge];
    this.ownerSolid    = [null, map[1].solid,    map[2].solid];
    this.ownerTintMine = [null, map[1].tintMine, map[2].tintMine];
  }
  setConfig(config, keepView){
    this.config = config;
    this.metrics = this.computeMetrics(config);
    this.minZoom = this.metrics.infinite ? INFINITE_MIN_ZOOM : 1;
    if (!keepView){ this.zoom = 1; this.panX = 0; this.panY = 0; }
    this.resize();
    this.observeParentSize();
  }
  computeMetrics(config){
    const small = Math.min(window.innerWidth, window.innerHeight) < 720;
    const isDuel = config.mode === 'duel';
    const isTerr = config.mode === 'territory';
    const isInf  = isInfiniteSize(config.size);

    if (config.style === 'hex'){
      let size = isDuel ? 22 : (isTerr ? 20 : (isInf ? 26 : 30));
      if (small) size = isDuel ? 15 : (isTerr ? 14 : (isInf ? 20 : 22));
      const pad  = isDuel ? 16 : (isTerr ? 16 : (isInf ? 20 : 24));
      const HW = SQ3 * size;
      return {
        style: 'hex', size, pad, HW, infinite: isInf,
        boardW: Math.round(HW * (config.cols + 0.5) + pad * 2),
        boardH: Math.round(size * 1.5 * (config.rows - 1) + size * 2 + pad * 2)
      };
    }
    let cell = isDuel ? 42 : (isTerr ? 32 : (isInf ? 42 : 54));
    if (small) cell = isDuel ? 28 : (isTerr ? 22 : (isInf ? 32 : 36));
    const gap  = isDuel ? 4 : (isTerr ? 3 : (isInf ? 4 : 6));
    const pad  = isDuel ? 16 : (isTerr ? 16 : (isInf ? 20 : 22));
    return {
      style: 'square', cell, gap, pad, infinite: isInf,
      boardW: pad * 2 + cell * config.cols + gap * (config.cols - 1),
      boardH: pad * 2 + cell * config.rows + gap * (config.rows - 1)
    };
  }
  resize(){
    const m = this.metrics;
    if (!m) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const parent = this.canvas.parentElement;
    const pw = Math.max(1, (parent && parent.clientWidth) || Math.ceil(m.boardW));
    const ph = Math.max(1, (parent && parent.clientHeight) || Math.ceil(m.boardH));
    this.pw = pw; this.ph = ph;
    const bw = Math.max(1, Math.round(pw * this.dpr));
    const bh = Math.max(1, Math.round(ph * this.dpr));
    if (this.canvas.width !== bw)  this.canvas.width  = bw;
    if (this.canvas.height !== bh) this.canvas.height = bh;
    this.canvas.style.width  = pw + 'px';
    this.canvas.style.height = ph + 'px';
    if (m.infinite){
      if (m.style === 'hex'){
        this.baseScale = Math.min(pw, ph) / (16 * (m.HW));
      } else {
        this.baseScale = Math.min(pw, ph) / (16 * (m.cell + m.gap));
      }
    } else {
      this.baseScale = Math.min(pw / m.boardW, ph / m.boardH);
    }
    this.clampPan();
  }
  /* Compute the world-space bounding box of all currently revealed
     tiles, expanded by 25 tile-widths in every direction. The camera
     will be clamped so its viewport never leaves this box. */
  revealedWorldBounds(){
    if (!G.myBoard || !this.metrics) return null;
    const bs = G.myBoard;
    const m = this.metrics;
    const rows = bs.rows, cols = bs.cols;
    let minX = Infinity, maxX = -Infinity;
    let minY = Infinity, maxY = -Infinity;
    let found = false;

    if (m.style === 'hex'){
      const { size, HW, pad } = m;
      const halfW = HW * 0.5;
      const halfH = size;
      for (let r = 0; r < rows; r++){
        const rowY = pad + size + size * 1.5 * r;
        const rowXBase = pad + HW * 0.5 + ((r & 1) ? HW * 0.5 : 0);
        for (let c = 0; c < cols; c++){
          if (!bs.revealed[r][c]) continue;
          found = true;
          const x = rowXBase + HW * c;
          if (x - halfW < minX) minX = x - halfW;
          if (x + halfW > maxX) maxX = x + halfW;
          if (rowY - halfH < minY) minY = rowY - halfH;
          if (rowY + halfH > maxY) maxY = rowY + halfH;
        }
      }
    } else {
      const { cell, gap, pad } = m;
      const step = cell + gap;
      for (let r = 0; r < rows; r++){
        const rowY = pad + r * step;
        for (let c = 0; c < cols; c++){
          if (!bs.revealed[r][c]) continue;
          found = true;
          const x = pad + c * step;
          if (x < minX) minX = x;
          if (x + cell > maxX) maxX = x + cell;
          if (rowY < minY) minY = rowY;
          if (rowY + cell > maxY) maxY = rowY + cell;
        }
      }
    }
    if (!found) return null;

    const EXPAND = 25;
    let expX, expY;
    if (m.style === 'hex'){
      expX = EXPAND * m.HW;
      expY = EXPAND * m.size * 1.5;
    } else {
      const step = m.cell + m.gap;
      expX = EXPAND * step;
      expY = EXPAND * step;
    }
    return {
      left:   minX - expX,
      right:  maxX + expX,
      top:    minY - expY,
      bottom: maxY + expY
    };
  }
  clampPan(){
    const m = this.metrics; if (!m) return;
    if (m.infinite){
      /* Infinite mode: the viewport may only extend 25 tiles past
         the closest revealed tile. */
      const b = this.revealedWorldBounds();
      if (!b) return;
      const scale = this.baseScale * this.zoom;
      const minPanX = this.pw - b.right * scale;
      const maxPanX = -b.left * scale;
      if (minPanX > maxPanX) this.panX = (minPanX + maxPanX) / 2;
      else this.panX = clamp(this.panX, minPanX, maxPanX);

      const minPanY = this.ph - b.bottom * scale;
      const maxPanY = -b.top * scale;
      if (minPanY > maxPanY) this.panY = (minPanY + maxPanY) / 2;
      else this.panY = clamp(this.panY, minPanY, maxPanY);

      if (!isFinite(this.panX)) this.panX = 0;
      if (!isFinite(this.panY)) this.panY = 0;
      return;
    }
    const z = this.zoom;
    const bw = this.baseScale * z * m.boardW;
    const bh = this.baseScale * z * m.boardH;
    if (bw <= this.pw) this.panX = (this.pw - bw) / 2;
    else this.panX = clamp(this.panX, this.pw - bw, 0);
    if (bh <= this.ph) this.panY = (this.ph - bh) / 2;
    else this.panY = clamp(this.panY, this.ph - bh, 0);
    if (!isFinite(this.panX)) this.panX = (this.pw - bw) / 2;
    if (!isFinite(this.panY)) this.panY = (this.ph - bh) / 2;
  }
  centerOn(worldX, worldY){
    const scale = this.baseScale * this.zoom;
    this.panX = this.pw / 2 - worldX * scale;
    this.panY = this.ph / 2 - worldY * scale;
  }
  resetView(){
    this.zoom = 1;
    if (this.metrics && this.metrics.infinite && G.me){
      const p = hexOrSqCenter(this, G.me.cursor.r, G.me.cursor.c);
      this.centerOn(p.x, p.y);
    } else {
      this.clampPan();
    }
  }
  zoomAround(cx, cy, newZoom){
    if (!this.metrics) return;
    newZoom = clamp(newZoom, this.minZoom, this.maxZoom);
    if (Math.abs(newZoom - this.zoom) < 0.0005) return;
    const scale = this.baseScale * this.zoom;
    const bx = (cx - this.panX) / scale;
    const by = (cy - this.panY) / scale;
    this.zoom = newZoom;
    this.panX = cx - bx * this.baseScale * this.zoom;
    this.panY = cy - by * this.baseScale * this.zoom;
    if (this.zoom <= this.minZoom + 0.0001) this.zoom = this.minZoom;
    this.clampPan();
  }
  panBy(dx_css, dy_css){
    if (!this.metrics) return;
    if (this.zoom <= this.minZoom + 0.0001 && !this.metrics.infinite) return;
    if (G.viewAnim) G.viewAnim.active = false;
    this.panX += dx_css;
    this.panY += dy_css;
    this.clampPan();
  }
  observeParentSize(){
    if (this.ro){ this.ro.disconnect(); this.ro = null; }
    const parent = this.canvas.parentElement; if (!parent) return;
    if (typeof ResizeObserver !== 'undefined'){
      this.ro = new ResizeObserver(() => this.resize());
      this.ro.observe(parent);
    }
  }
  destroy(){ if (this.ro){ this.ro.disconnect(); this.ro = null; } }
  hitTest(clientX, clientY){
    if (!this.metrics) return null;
    const rect = this.canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    const scale = this.baseScale * this.zoom;
    const bx = (cx - this.panX) / scale;
    const by = (cy - this.panY) / scale;
    if (this.metrics.style === 'hex') return this.hexHitTest(bx, by);
    return this.squareHitTest(bx, by);
  }
  squareHitTest(bx, by){
    const m = this.metrics;
    const { cell, gap, pad } = m;
    const { rows, cols } = this.config;
    const relX = bx - pad, relY = by - pad;
    if (relX < 0 || relY < 0) return null;
    const c = Math.floor(relX / (cell + gap));
    const r = Math.floor(relY / (cell + gap));
    if (r < 0 || r >= rows || c < 0 || c >= cols) return null;
    if (relX - c * (cell + gap) > cell) return null;
    if (relY - r * (cell + gap) > cell) return null;
    return { r, c };
  }
  hexCenter(r, c){
    const m = this.metrics;
    const { size, pad, HW } = m;
    return {
      x: pad + HW * 0.5 + HW * c + ((r & 1) ? HW * 0.5 : 0),
      y: pad + size + size * 1.5 * r
    };
  }
  hexHitTest(bx, by){
    const m = this.metrics;
    const { size } = m;
    const { rows, cols } = this.config;
    let best = null, bestDist = Infinity;
    for (let r = 0; r < rows; r++){
      const y = this.hexCenter(r, 0).y;
      if (Math.abs(by - y) > size * 1.3) continue;
      for (let c = 0; c < cols; c++){
        const x = this.hexCenter(r, c).x;
        const d = Math.hypot(bx - x, by - y);
        if (d < bestDist){ bestDist = d; best = { r, c }; }
      }
    }
    return (best && bestDist < size * 0.98) ? best : null;
  }

  getMineSprite(size){
    if (this._mineSprite && this._mineSprite._size === size) return this._mineSprite;
    const dpr = Math.max(1, this.dpr);
    const w = Math.max(2, Math.ceil(size * dpr));
    const c = document.createElement('canvas');
    c.width = w; c.height = w;
    const cx = c.getContext('2d');
    cx.scale(dpr, dpr);
    const grad = cx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size*0.55);
    grad.addColorStop(0, 'rgba(255,77,109,.55)');
    grad.addColorStop(1, 'rgba(255,77,109,0)');
    cx.fillStyle = grad; cx.fillRect(0, 0, size, size);
    cx.fillStyle = '#ff4d6d';
    cx.beginPath(); cx.arc(size/2, size/2, size * 0.24, 0, Math.PI * 2); cx.fill();
    cx.strokeStyle = '#ff4d6d';
    cx.lineWidth = Math.max(1.6, size * 0.06);
    cx.lineCap = 'round';
    for (let i = 0; i < 6; i++){
      const ang = i * Math.PI / 3;
      cx.beginPath();
      cx.moveTo(size/2 + Math.cos(ang) * size * 0.3, size/2 + Math.sin(ang) * size * 0.3);
      cx.lineTo(size/2 + Math.cos(ang) * size * 0.42, size/2 + Math.sin(ang) * size * 0.42);
      cx.stroke();
    }
    c._size = size;
    this._mineSprite = c;
    return c;
  }

  visibleSquareRange(cell, gap, pad, rows, cols){
    const scale = this.baseScale * this.zoom;
    const step = cell + gap;
    const worldLeft = -this.panX / scale;
    const worldTop = -this.panY / scale;
    const worldRight = (this.pw - this.panX) / scale;
    const worldBottom = (this.ph - this.panY) / scale;
    const c0 = Math.max(0, Math.floor((worldLeft - pad) / step) - 1);
    const c1 = Math.min(cols - 1, Math.ceil((worldRight - pad) / step) + 1);
    const r0 = Math.max(0, Math.floor((worldTop - pad) / step) - 1);
    const r1 = Math.min(rows - 1, Math.ceil((worldBottom - pad) / step) + 1);
    return { r0, r1, c0, c1 };
  }
  visibleHexRange(size, HW, pad, rows, cols){
    const scale = this.baseScale * this.zoom;
    const worldLeft = -this.panX / scale;
    const worldTop = -this.panY / scale;
    const worldRight = (this.pw - this.panX) / scale;
    const worldBottom = (this.ph - this.panY) / scale;
    const rowStep = size * 1.5;
    const r0 = Math.max(0, Math.floor((worldTop - pad - size) / rowStep) - 1);
    const r1 = Math.min(rows - 1, Math.ceil((worldBottom - pad) / rowStep) + 1);
    const c0 = Math.max(0, Math.floor((worldLeft - pad - HW * 1.5) / HW) - 1);
    const c1 = Math.min(cols - 1, Math.ceil((worldRight - pad) / HW) + 1);
    return { r0, r1, c0, c1 };
  }

  render(now, state){
    const ctx = this.ctx;
    const dt = Math.min(now - this.lastT, 50);
    this.lastT = now;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 0.0026);

    for (let i = this.particles.length - 1; i >= 0; i--){
      const p = this.particles[i];
      const s = dt / 1000;
      p.vy += 200 * s;
      p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx * s; p.y += p.vy * s;
      p.life -= p.decay * s;
      if (p.life <= 0) this.particles.splice(i, 1);
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    if (!this.metrics) return;

    let sx = 0, sy = 0;
    if (this.shake > 0.01){
      const m = this.shake * 12;
      sx = (Math.random() - 0.5) * m;
      sy = (Math.random() - 0.5) * m;
    }
    const scale = this.baseScale * this.zoom * this.dpr;
    ctx.setTransform(scale, 0, 0, scale,
      (this.panX + sx) * this.dpr,
      (this.panY + sy) * this.dpr);

    if (this.metrics.style === 'hex') this.renderHex(now, state);
    else this.renderSquare(now, state);

    if (this.particles.length){
      for (const p of this.particles){
        ctx.globalAlpha = clamp(p.life, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  boom(cx, cy, color, n, power){
    power = power || 150;
    const cap = 60;
    if (this.particles.length > cap) return;
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * power;
      this.particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.65 + Math.random() * 1.0,
        size: 1.4 + Math.random() * 3.0, color
      });
    }
  }
  triggerShake(){ this.shake = 1; }

  renderSquare(now, state){
    const ctx = this.ctx;
    const m = this.metrics;
    const { cell, gap, pad } = m;
    const { board, boardState, cursors } = state;
    const { rows, cols } = board;
    const useOwner = this.config.mode === 'territory';
    const NUM_COLORS = ['', '#4dd8ff', '#5dff9e', '#ffd166', '#ff7ad9',
                        '#b98cff', '#ff5c5c', '#ff9f43', '#7ef9ff'];
    const radius = Math.max(3, Math.floor(cell * 0.16));
    const mineSprite = this.getMineSprite(cell);
    const nowMs = now;
    const hints = state.hints;

    const range = this.visibleSquareRange(cell, gap, pad, rows, cols);
    const r0 = range.r0, r1 = range.r1, c0 = range.c0, c1 = range.c1;

    for (let r = r0; r <= r1; r++){
      for (let c = c0; c <= c1; c++){
        const x = pad + c * (cell + gap);
        const y = pad + r * (cell + gap);
        const rev = boardState.revealed[r][c];
        const flg = boardState.flagged[r][c];
        const isMine = board.mines.has(r + ',' + c);
        const own = (useOwner && boardState.owner) ? boardState.owner[r][c] : 0;
        const isSupport = hints && hints.supports && hints.supports.has(r + ',' + c);

        if (rev && nowMs >= boardState.revealAt[r][c]){
          const t = (nowMs - boardState.revealAt[r][c]) / 200;
          const e = easeOutCubic(clamp(t, 0, 1));
          const sc = 0.68 + 0.32 * e;
          const a = clamp(t * 2.2, 0, 1);

          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(x + cell/2, y + cell/2);
          ctx.scale(sc, sc);
          ctx.translate(-cell/2, -cell/2);

          ctx.fillStyle = isMine ? '#2a0810' : '#070b14';
          this.roundRect(ctx, 0, 0, cell, cell, radius);
          ctx.fill();

          if (own){
            ctx.fillStyle = isMine ? this.ownerTintMine[own] : this.ownerTint[own];
            this.roundRect(ctx, 0, 0, cell, cell, radius);
            ctx.fill();
          }

          ctx.strokeStyle = own
            ? this.ownerEdge[own]
            : (isMine ? 'rgba(255,77,109,.55)' : 'rgba(58,96,150,.3)');
          ctx.lineWidth = own ? 2.2 : 1.4;
          this.roundRect(ctx, 0, 0, cell, cell, radius);
          ctx.stroke();

          if (isMine){
            ctx.drawImage(mineSprite, 0, 0, cell, cell);
          } else if (board.adj[r][c] > 0){
            const col = isSupport ? '#ffd166' : (NUM_COLORS[board.adj[r][c]] || '#cfe4ff');
            ctx.font = '900 ' + (cell * 0.58) + 'px "Courier New", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = col;
            ctx.fillText(board.adj[r][c], cell/2, cell/2 + 1);
          }
          ctx.restore();
        } else {
          const hiddenBase = (useOwner && own) ? '#070b14' : '#111a2c';
          ctx.fillStyle = hiddenBase;
          this.roundRect(ctx, x, y, cell, cell, radius);
          ctx.fill();

          if (own){
            ctx.fillStyle = this.ownerTint[own];
            this.roundRect(ctx, x, y, cell, cell, radius);
            ctx.fill();
          }

          const pulse = 0.22 + 0.11 * Math.sin(nowMs / 800 + (r * 0.7 + c * 0.45));
          ctx.strokeStyle = own ? this.ownerEdge[own]
            : 'rgba(90,165,255,' + pulse.toFixed(3) + ')';
          ctx.lineWidth = own ? 2 : 1.5;
          this.roundRect(ctx, x, y, cell, cell, radius);
          ctx.stroke();

          if (flg){
            const ft = clamp((nowMs - (boardState.flagAt[r][c] || nowMs)) / 240, 0, 1);
            const fs = clamp(easeOutBack(ft), 0, 1.3);
            const flagColor = (own && this.ownerSolid[own]) ? this.ownerSolid[own] : '#ff3d81';
            ctx.save();
            ctx.globalAlpha = clamp(ft * 3, 0, 1);
            ctx.translate(x + cell/2, y + cell/2);
            ctx.scale(fs, fs);
            ctx.fillStyle = flagColor; ctx.strokeStyle = flagColor;
            ctx.lineWidth = Math.max(2, cell * 0.075);
            ctx.lineCap = 'round';
            const poleH = cell * 0.72;
            ctx.beginPath();
            ctx.moveTo(-2, poleH * 0.5);
            ctx.lineTo(-2, -poleH * 0.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-2, -poleH * 0.5);
            ctx.lineTo(cell * 0.32, -cell * 0.15);
            ctx.lineTo(-2, cell * 0.08);
            ctx.closePath(); ctx.fill();
            ctx.restore();
          }
        }
      }
    }

    if (hints){
      const pulse = 0.5 + 0.5 * Math.sin(nowMs / 200);

      if (hints.supports){
        hints.supports.forEach(function(key){
          const parts = key.split(',');
          const hr = +parts[0], hc = +parts[1];
          if (hr < r0 || hr > r1 || hc < c0 || hc > c1) return;
          const hx = pad + hc * (cell + gap);
          const hy = pad + hr * (cell + gap);
          ctx.save();
          ctx.strokeStyle = 'rgba(255,209,102,' + (0.55 + 0.4 * pulse).toFixed(3) + ')';
          ctx.lineWidth = 3.5;
          ctx.shadowColor = '#ffd166';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(hx + radius, hy);
          ctx.arcTo(hx + cell, hy, hx + cell, hy + cell, radius);
          ctx.arcTo(hx + cell, hy + cell, hx, hy + cell, radius);
          ctx.arcTo(hx, hy + cell, hx, hy, radius);
          ctx.arcTo(hx, hy, hx + cell, hy, radius);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        });
      }

      if (hints.reveal){
        hints.reveal.forEach(function(key){
          const parts = key.split(',');
          const hr = +parts[0], hc = +parts[1];
          if (hr < r0 || hr > r1 || hc < c0 || hc > c1) return;
          const hx = pad + hc * (cell + gap);
          const hy = pad + hr * (cell + gap);
          ctx.save();
          ctx.strokeStyle = 'rgba(93,255,158,' + (0.65 + 0.35 * pulse).toFixed(3) + ')';
          ctx.lineWidth = 3.5 + 2 * pulse;
          ctx.shadowColor = '#5dff9e';
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.moveTo(hx - 3 + radius, hy - 3);
          ctx.arcTo(hx + cell + 3, hy - 3, hx + cell + 3, hy + cell + 3, radius + 4);
          ctx.arcTo(hx + cell + 3, hy + cell + 3, hx - 3, hy + cell + 3, radius + 4);
          ctx.arcTo(hx - 3, hy + cell + 3, hx - 3, hy - 3, radius + 4);
          ctx.arcTo(hx - 3, hy - 3, hx + cell + 3, hy - 3, radius + 4);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        });
      }

      if (hints.flag){
        hints.flag.forEach(function(key){
          const parts = key.split(',');
          const hr = +parts[0], hc = +parts[1];
          if (hr < r0 || hr > r1 || hc < c0 || hc > c1) return;
          const hx = pad + hc * (cell + gap);
          const hy = pad + hr * (cell + gap);
          ctx.save();
          ctx.strokeStyle = 'rgba(255,77,109,' + (0.65 + 0.35 * pulse).toFixed(3) + ')';
          ctx.lineWidth = 3.5 + 2 * pulse;
          ctx.shadowColor = '#ff4d6d';
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.moveTo(hx - 3 + radius, hy - 3);
          ctx.arcTo(hx + cell + 3, hy - 3, hx + cell + 3, hy + cell + 3, radius + 4);
          ctx.arcTo(hx + cell + 3, hy + cell + 3, hx - 3, hy + cell + 3, radius + 4);
          ctx.arcTo(hx - 3, hy + cell + 3, hx - 3, hy - 3, radius + 4);
          ctx.arcTo(hx - 3, hy - 3, hx + cell + 3, hy - 3, radius + 4);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        });
      }

      if (hints.wrong){
        hints.wrong.forEach(function(key){
          const parts = key.split(',');
          const hr = +parts[0], hc = +parts[1];
          if (hr < r0 || hr > r1 || hc < c0 || hc > c1) return;
          const hx = pad + hc * (cell + gap);
          const hy = pad + hr * (cell + gap);
          ctx.save();
          ctx.strokeStyle = 'rgba(255,77,109,' + (0.75 + 0.25 * pulse).toFixed(3) + ')';
          ctx.lineWidth = 3.5;
          ctx.shadowColor = '#ff4d6d';
          ctx.shadowBlur = 16;
          const inset = Math.max(3, cell * 0.24);
          ctx.beginPath();
          ctx.moveTo(hx + inset, hy + inset);
          ctx.lineTo(hx + cell - inset, hy + cell - inset);
          ctx.moveTo(hx + cell - inset, hy + inset);
          ctx.lineTo(hx + inset, hy + cell - inset);
          ctx.stroke();
          ctx.restore();
        });
      }
    }

    if (state.highlights){
      for (const h of state.highlights){
        if (h.r < r0 || h.r > r1 || h.c < c0 || h.c > c1) continue;
        const x = pad + h.c * (cell + gap);
        const y = pad + h.r * (cell + gap);
        const pulse = 0.5 + 0.5 * Math.sin(nowMs / 170);
        ctx.save();
        ctx.strokeStyle = h.color || '#ffe066';
        ctx.lineWidth = 3 + 1.5 * pulse;
        this.roundRect(ctx, x - 3, y - 3, cell + 6, cell + 6, radius + 4);
        ctx.stroke();
        ctx.restore();
      }
    }

    for (const cur of cursors){
      if (cur.r < r0 || cur.r > r1 || cur.c < c0 || cur.c > c1) continue;
      const x = pad + cur.c * (cell + gap);
      const y = pad + cur.r * (cell + gap);
      ctx.save();
      ctx.strokeStyle = cur.color;
      ctx.lineWidth = 3;
      this.roundRect(ctx, x - 2, y - 2, cell + 4, cell + 4, radius + 3);
      ctx.stroke();
      ctx.restore();
    }
  }

  renderHex(now, state){
    const ctx = this.ctx;
    const m = this.metrics;
    const { size } = m;
    const { board, boardState, cursors } = state;
    const { rows, cols } = board;
    const useOwner = this.config.mode === 'territory';
    const NUM_COLORS = ['', '#4dd8ff', '#5dff9e', '#ffd166', '#ff7ad9',
                        '#b98cff', '#ff5c5c', '#ff9f43', '#7ef9ff'];
    const mineSprite = this.getMineSprite(size * 1.6);
    const nowMs = now;
    const hints = state.hints;

    const range = this.visibleHexRange(size, m.HW, m.pad, rows, cols);
    const r0 = range.r0, r1 = range.r1, c0 = range.c0, c1 = range.c1;

    for (let r = r0; r <= r1; r++){
      for (let c = c0; c <= c1; c++){
        const p = this.hexCenter(r, c);
        const x = p.x, y = p.y;
        const rev = boardState.revealed[r][c];
        const flg = boardState.flagged[r][c];
        const isMine = board.mines.has(r + ',' + c);
        const own = (useOwner && boardState.owner) ? boardState.owner[r][c] : 0;
        const isSupport = hints && hints.supports && hints.supports.has(r + ',' + c);

        if (rev && nowMs >= boardState.revealAt[r][c]){
          const t = (nowMs - boardState.revealAt[r][c]) / 240;
          const e = easeOutCubic(clamp(t, 0, 1));
          const s = 0.6 + 0.4 * e;
          const a = clamp(t * 2.2, 0, 1);
          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(x, y);
          ctx.scale(s, s);
          this.hexPath(0, 0, size - 3);
          ctx.fillStyle = '#070b14'; ctx.fill();
          if (own){
            ctx.fillStyle = isMine ? this.ownerTintMine[own] : this.ownerTint[own];
            ctx.fill();
          }
          ctx.strokeStyle = own
            ? this.ownerEdge[own]
            : (isMine ? 'rgba(255,77,109,.55)' : 'rgba(58,96,150,.32)');
          ctx.lineWidth = own ? 2.4 : 1.4;
          ctx.stroke();

          if (isMine){
            const sz = size * 1.6;
            ctx.drawImage(mineSprite, -sz/2, -sz/2, sz, sz);
          } else if (board.adj[r][c] > 0){
            const col = isSupport ? '#ffd166' : (NUM_COLORS[board.adj[r][c]] || '#cfe4ff');
            ctx.font = '900 ' + (size * 1.0) + 'px "Courier New", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = col;
            ctx.fillText(board.adj[r][c], 0, 1);
          }
          ctx.restore();
        } else {
          const isHover = cursors.some(cur => cur.r === r && cur.c === c);
          this.hexPath(x, y, size - 3);
          if (isHover){
            ctx.fillStyle = '#1c2b4a'; ctx.fill();
            ctx.save();
            ctx.strokeStyle = '#4dd8ff';
            ctx.lineWidth = 2.4;
            ctx.stroke();
            ctx.restore();
          } else {
            const hiddenBase = (useOwner && own) ? '#070b14' : '#111a2c';
            ctx.fillStyle = hiddenBase; ctx.fill();
            if (own){ ctx.fillStyle = this.ownerTint[own]; ctx.fill(); }
            const pulse = 0.22 + 0.11 * Math.sin(nowMs / 800 + (r * 0.7 + c * 0.45));
            ctx.strokeStyle = own ? this.ownerEdge[own]
              : 'rgba(90,165,255,' + pulse.toFixed(3) + ')';
            ctx.lineWidth = own ? 2.2 : 1.5;
            ctx.stroke();
          }
          if (flg){
            const ft = clamp((nowMs - (boardState.flagAt[r][c] || nowMs)) / 240, 0, 1);
            const fs = clamp(easeOutBack(ft), 0, 1.3);
            const flagColor = (own && this.ownerSolid[own]) ? this.ownerSolid[own] : '#ff3d81';
            ctx.save();
            ctx.globalAlpha = clamp(ft * 3, 0, 1);
            ctx.translate(x, y); ctx.scale(fs, fs);
            ctx.strokeStyle = flagColor; ctx.fillStyle = flagColor;
            ctx.lineWidth = Math.max(2, size * 0.11);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const poleH = size * 0.82;
            ctx.beginPath();
            ctx.moveTo(-2, poleH * 0.55); ctx.lineTo(-2, -poleH * 0.55); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-2, -poleH * 0.55);
            ctx.lineTo(size * 0.52, -size * 0.2);
            ctx.lineTo(-2, size * 0.12);
            ctx.closePath(); ctx.fill();
            ctx.restore();
          }
        }
      }
    }

    if (hints){
      const pulse = 0.5 + 0.5 * Math.sin(nowMs / 200);

      if (hints.supports){
        hints.supports.forEach(function(key){
          const parts = key.split(',');
          const hr = +parts[0], hc = +parts[1];
          if (hr < r0 || hr > r1 || hc < c0 || hc > c1) return;
          const hp = this.hexCenter(hr, hc);
          ctx.save();
          ctx.strokeStyle = 'rgba(255,209,102,' + (0.55 + 0.4 * pulse).toFixed(3) + ')';
          ctx.lineWidth = 3.5;
          ctx.shadowColor = '#ffd166';
          ctx.shadowBlur = 12;
          this.hexPath(hp.x, hp.y, size - 4);
          ctx.stroke();
          ctx.restore();
        }.bind(this));
      }

      if (hints.reveal){
        hints.reveal.forEach(function(key){
          const parts = key.split(',');
          const hr = +parts[0], hc = +parts[1];
          if (hr < r0 || hr > r1 || hc < c0 || hc > c1) return;
          const hp = this.hexCenter(hr, hc);
          ctx.save();
          ctx.strokeStyle = 'rgba(93,255,158,' + (0.65 + 0.35 * pulse).toFixed(3) + ')';
          ctx.lineWidth = 3.5 + 2 * pulse;
          ctx.shadowColor = '#5dff9e';
          ctx.shadowBlur = 16;
          this.hexPath(hp.x, hp.y, size - 1);
          ctx.stroke();
          ctx.restore();
        }.bind(this));
      }

      if (hints.flag){
        hints.flag.forEach(function(key){
          const parts = key.split(',');
          const hr = +parts[0], hc = +parts[1];
          if (hr < r0 || hr > r1 || hc < c0 || hc > c1) return;
          const hp = this.hexCenter(hr, hc);
          ctx.save();
          ctx.strokeStyle = 'rgba(255,77,109,' + (0.65 + 0.35 * pulse).toFixed(3) + ')';
          ctx.lineWidth = 3.5 + 2 * pulse;
          ctx.shadowColor = '#ff4d6d';
          ctx.shadowBlur = 16;
          this.hexPath(hp.x, hp.y, size - 1);
          ctx.stroke();
          ctx.restore();
        }.bind(this));
      }

      if (hints.wrong){
        hints.wrong.forEach(function(key){
          const parts = key.split(',');
          const hr = +parts[0], hc = +parts[1];
          if (hr < r0 || hr > r1 || hc < c0 || hc > c1) return;
          const hp = this.hexCenter(hr, hc);
          ctx.save();
          ctx.strokeStyle = 'rgba(255,77,109,' + (0.75 + 0.25 * pulse).toFixed(3) + ')';
          ctx.lineWidth = 3.5;
          ctx.shadowColor = '#ff4d6d';
          ctx.shadowBlur = 16;
          const inset = Math.max(3, size * 0.42);
          ctx.beginPath();
          ctx.moveTo(hp.x - inset, hp.y - inset);
          ctx.lineTo(hp.x + inset, hp.y + inset);
          ctx.moveTo(hp.x + inset, hp.y - inset);
          ctx.lineTo(hp.x - inset, hp.y + inset);
          ctx.stroke();
          ctx.restore();
        }.bind(this));
      }
    }

    if (state.highlights){
      for (const h of state.highlights){
        if (h.r < r0 || h.r > r1 || h.c < c0 || h.c > c1) continue;
        const p = this.hexCenter(h.r, h.c);
        const pulse = 0.5 + 0.5 * Math.sin(nowMs / 170);
        ctx.save();
        ctx.strokeStyle = h.color || '#ffe066';
        ctx.lineWidth = 3 + 1.5 * pulse;
        this.hexPath(p.x, p.y, size - 1);
        ctx.stroke();
        ctx.restore();
      }
    }
    for (const cur of cursors){
      if (cur.r < r0 || cur.r > r1 || cur.c < c0 || cur.c > c1) continue;
      const p = this.hexCenter(cur.r, cur.c);
      ctx.save();
      ctx.strokeStyle = cur.color;
      ctx.lineWidth = 3;
      this.hexPath(p.x, p.y, size - 3);
      ctx.stroke();
      ctx.restore();
    }
  }

  hexPath(cx, cy, rad){
    const ctx = this.ctx;
    ctx.beginPath();
    for (let i = 0; i < 6; i++){
      const a = (60 * i - 30) * Math.PI / 180;
      const px = cx + rad * Math.cos(a);
      const py = cy + rad * Math.sin(a);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
  roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}

const PALETTE_CYAN = {
  tint:     'rgba(77,216,255,.17)',
  tintMine: 'rgba(77,216,255,.30)',
  edge:     'rgba(77,216,255,.72)',
  solid:    '#4dd8ff'
};
const PALETTE_PINK = {
  tint:     'rgba(255,61,129,.17)',
  tintMine: 'rgba(255,61,129,.30)',
  edge:     'rgba(255,61,129,.72)',
  solid:    '#ff3d81'
};
function myPalette(){
  return (G.myOwner === 1)
    ? { 1: PALETTE_CYAN, 2: PALETTE_PINK }
    : { 1: PALETTE_PINK, 2: PALETTE_CYAN };
}

function hexOrSqCenter(view, r, c){
  const m = view.metrics;
  if (!m) return { x: 0, y: 0 };
  if (m.style === 'hex') return view.hexCenter(r, c);
  const { cell, gap, pad } = m;
  return { x: pad + c * (cell + gap) + cell/2, y: pad + r * (cell + gap) + cell/2 };
}

const STUN_HTML =
  '<div class="stun">' +
    '<div class="stun-emoji">💥</div>' +
    '<div class="stun-title">FROZEN</div>' +
    '<div class="stun-timer" data-timer>10.0</div>' +
    '<div class="stun-sub">BOMB TRIGGERED</div>' +
  '</div>';

function setStunFace(el, reason){
  if (!el) return;
  const ice = (reason === 'flag');
  if (el._reason === reason) return;
  el._reason = reason;
  el.classList.toggle('ice', ice);
  const emo = el.querySelector('.stun-emoji');
  const sub = el.querySelector('.stun-sub');
  if (emo) emo.textContent = ice ? '❄️' : '💥';
  if (sub) sub.textContent = ice ? 'WRONG FLAG' : 'BOMB TRIGGERED';
}

function usesStunPenalty(){
  if (G.config.insta) return false;
  const m = G.config.mode;
  return m === 'duel' || m === 'territory';
}

function myRevealedCount(){
  if (!G.myBoard) return 0;
  const mode = G.config.mode;
  if (mode === 'coop' || mode === 'territory'){
    return countRevealedBy(G.myBoard, G.myOwner);
  }
  return G.myBoard.safeRevealed || 0;
}

function theirRevealedCount(){
  if (!G.myBoard) return 0;
  const mode = G.config.mode;
  if (mode === 'duel'){
    return G.theirBoard ? (G.theirBoard.safeRevealed || 0) : 0;
  }
  if (mode === 'coop' || mode === 'territory'){
    return countRevealedBy(G.myBoard, G.theirOwner);
  }
  return 0;
}

function updatePanelNames(){
  const myName = myNameText();
  const theirName = theirNameText();
  const mode = G.config.mode;

  if (G.panelMe && G.panelMe._els){
    const e = G.panelMe._els;
    if (mode === 'solo'){
      if (e.nameEl) e.nameEl.textContent = 'SOLO';
    } else if (mode === 'coop'){
      if (e.nameEl){
        e.nameEl.innerHTML =
          escapeHtml(myName) +
          ' <span style="color:#6b7a94">&amp;</span> ' +
          escapeHtml(theirName);
      }
    } else if (mode === 'territory'){
      if (e.nameMeEl)   e.nameMeEl.textContent = myName;
      if (e.nameThemEl) e.nameThemEl.textContent = theirName;
      if (e.oppNameEl)  e.oppNameEl.textContent = theirName;
    } else {
      if (e.nameEl) e.nameEl.textContent = myName;
    }
  }
  if (G.panelThem && G.panelThem._els && G.panelThem._els.nameEl){
    G.panelThem._els.nameEl.textContent = theirName;
  }
}

function viewConfig(){

function buildArena(){
  arena.innerHTML = '';
  G.viewMe = null; G.viewThem = null; G.panelMe = null; G.panelThem = null;
  const mode = G.config.mode;
  const insta = !!G.config.insta;
  const isInf = isInfiniteSize(G.config.size);
  const showHits = usesStunPenalty();
  arena.classList.toggle('solo', mode === 'solo');
  arena.classList.toggle('territory', mode === 'territory');
  if (mode === 'territory'){ buildTerritoryArena(); updatePanelNames(); return; }
  const isSolo = mode === 'solo';
  const isCoop = mode === 'coop';

  const panelA = makePanel('me', isSolo ? 'SOLO' : 'YOU', '#4dd8ff');
  arena.appendChild(panelA);
  G.viewMe = new BoardView(panelA.querySelector('canvas'));
  G.viewMe.setConfig(viewConfig());
  bindCanvasInput(G.viewMe, true, true);
  wireZoomBadge(panelA, G.viewMe);
  panelA._els = {
    mines: panelA.querySelector('[data-mines]'),
    time:  panelA.querySelector('[data-time]'),
    hits:  panelA.querySelector('[data-hits]'),
    hitsStat: panelA.querySelector('[data-hitsstat]'),
    revealed: panelA.querySelector('[data-revealed]'),
    bar:   panelA.querySelector('.pbar i'),
    stun:  panelA.querySelector('.stun'),
    keys:  panelA.querySelector('.pkeys'),
    nameEl: panelA.querySelector('.pname'),
    panel: panelA
  };
  if (!showHits && panelA._els.hitsStat) panelA._els.hitsStat.style.display = 'none';
  if (insta) panelA._els.keys.classList.add('insta');
  if (isCoop) panelA._els.keys.textContent = 'SHARED · ' + panelKeysText();
  else        panelA._els.keys.textContent = panelKeysText();

  if (isInf){
    /* Hide the mines stat & progress bar in infinite mode. */
    const minesBox = panelA.querySelector('[data-minesstat]');
    if (minesBox) minesBox.style.display = 'none';
    const pbar = panelA.querySelector('.pbar');
    if (pbar) pbar.style.display = 'none';
    /* Show the return-to-start button. */
    const retBtn = panelA.querySelector('[data-returnstart]');
    if (retBtn){
      retBtn.style.display = 'flex';
      retBtn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        returnToStart();
      });
      retBtn.addEventListener('pointerdown', e => e.stopPropagation());
    }
    /* Center the camera on the player's starting position. */
    if (G.me){
      const p = hexOrSqCenter(G.viewMe, G.me.cursor.r, G.me.cursor.c);
      G.viewMe.centerOn(p.x, p.y);
    }
  }

  if (mode === 'duel'){
    const panelB = makePanel('them', 'OPPONENT', '#ff3d81');
    arena.appendChild(panelB);
    G.viewThem = new BoardView(panelB.querySelector('canvas'));
    G.viewThem.setConfig(viewConfig());
    bindCanvasInput(G.viewThem, false, false);
    panelB._els = {
      mines: panelB.querySelector('[data-mines]'),
      time:  panelB.querySelector('[data-time]'),
      hits:  panelB.querySelector('[data-hits]'),
      hitsStat: panelB.querySelector('[data-hitsstat]'),
      revealed: panelB.querySelector('[data-revealed]'),
      bar:   panelB.querySelector('.pbar i'),
      stun:  panelB.querySelector('.stun'),
      keys:  panelB.querySelector('.pkeys'),
      nameEl: panelB.querySelector('.pname'),
      panel: panelB
    };
    if (!showHits && panelB._els.hitsStat) panelB._els.hitsStat.style.display = 'none';
    panelB._els.keys.textContent = 'LIVE VIEW · NO ZOOM';
    G.panelThem = panelB;
  }
  G.panelMe = panelA;
  updatePanelNames();
}

function wireZoomBadge(panel, view){
  const badge = panel.querySelector('[data-zoombadge]');
  if (!badge) return;
  let rafId = null;
  const tick = () => {
    rafId = requestAnimationFrame(tick);
    if (Math.abs(view.zoom - 1) > 0.001){
      badge.classList.add('on');
      badge.textContent = '⤢ ' + view.zoom.toFixed(1) + '× · reset';
    } else {
      badge.classList.remove('on');
    }
  };
  rafId = requestAnimationFrame(tick);
  badge.addEventListener('click', e => {
    e.stopPropagation();
    view.resetView();
    SFX.clickSoft();
  });
  badge.addEventListener('pointerdown', e => e.stopPropagation());
}

function interactive(){
  return G.state === 'playing' && G.me && !G.me.done;
}

function returnToStart(){
  if (!G.viewMe || !G.board || !G.me) return;
  const v = G.viewMe;
  const p = hexOrSqCenter(v, G.myStartR, G.myStartC);
  const scale = v.baseScale * v.zoom;
  G.viewAnim = {
    active: true,
    startTime: performance.now(),
    duration: 550,
    startPanX: v.panX,
    startPanY: v.panY,
    targetPanX: v.pw / 2 - p.x * scale,
    targetPanY: v.ph / 2 - p.y * scale
  };
  SFX.zoom();
}

function bindCanvasInput(view, gameplay, allowZoom){
  if (allowZoom === undefined) allowZoom = true;
  const canvas = view.canvas;
  const pointers = new Map();
  let pinch = null;
  let touchGesture = null;
  let mousePan = null;

  const clientToLocal = (clientX, clientY) => {
    const rect = canvas.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top, rect };
  };

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    if (!view.metrics) return;
    if (!allowZoom) return;
    e.preventDefault();
    let delta = e.deltaY;
    if (e.deltaMode === 1) delta *= 16;
    else if (e.deltaMode === 2) delta *= 400;
    const factor = Math.exp(-delta * 0.0018);
    const newZoom = clamp(view.zoom * factor, view.minZoom, view.maxZoom);
    if (Math.abs(newZoom - view.zoom) < 0.001) return;
    if (G.viewAnim) G.viewAnim.active = false;
    const { x, y } = clientToLocal(e.clientX, e.clientY);
    view.zoomAround(x, y, newZoom);
  }, { passive: false });

  const cancelTouchGesture = () => {
    if (touchGesture && touchGesture.timer) clearTimeout(touchGesture.timer);
    touchGesture = null;
  };

  canvas.addEventListener('pointerdown', e => {
    if (!view.metrics) return;
    try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    pointers.set(e.pointerId, {
      x: e.clientX, y: e.clientY,
      startX: e.clientX, startY: e.clientY,
      startTime: performance.now()
    });

    if (e.pointerType === 'mouse'){
      if (e.button === 1 || (e.button === 0 && e.shiftKey)){
        e.preventDefault();
        mousePan = { id: e.pointerId, lastX: e.clientX, lastY: e.clientY };
        return;
      }
      if (!gameplay || !interactive()) return;
      const cell = view.hitTest(e.clientX, e.clientY);
      if (!cell) return;
      e.preventDefault();
      if (e.button === 0)      localDigAt(cell.r, cell.c);
      else if (e.button === 2) localFlagAt(cell.r, cell.c);
      return;
    }

    if (pointers.size >= 2){
      cancelTouchGesture();
      if (allowZoom){
        const pts = Array.from(pointers.values());
        const d0 = Math.hypot(pts[0].startX - pts[1].startX, pts[0].startY - pts[1].startY);
        const midX0 = (pts[0].startX + pts[1].startX) / 2;
        const midY0 = (pts[0].startY + pts[1].startY) / 2;
        const l0 = clientToLocal(midX0, midY0);
        pinch = { d0, zoom0: view.zoom, pan0X: view.panX, pan0Y: view.panY, midL0X: l0.x, midL0Y: l0.y };
      }
      return;
    }

    touchGesture = {
      id: e.pointerId, x0: e.clientX, y0: e.clientY,
      x: e.clientX, y: e.clientY,
      time0: performance.now(),
      moved: false, longFired: false, panning: false,
      lastX: e.clientX, lastY: e.clientY, timer: null
    };
    if (gameplay && interactive()){
      const g = touchGesture;
      const cx = e.clientX, cy = e.clientY;
      g.timer = setTimeout(() => {
        if (touchGesture !== g || g.moved || g.panning || !interactive()) return;
        g.longFired = true;
        const cell = view.hitTest(cx, cy);
        if (cell) localFlagAt(cell.r, cell.c);
        vibrate(20);
      }, 400);
    }
  });

  canvas.addEventListener('pointermove', e => {
    const tracked = pointers.get(e.pointerId);
    if (!tracked) return;
    tracked.x = e.clientX; tracked.y = e.clientY;

    if (mousePan && mousePan.id === e.pointerId){
      const dx = e.clientX - mousePan.lastX;
      const dy = e.clientY - mousePan.lastY;
      mousePan.lastX = e.clientX; mousePan.lastY = e.clientY;
      view.panBy(dx, dy);
      return;
    }
    if (pinch && pointers.size >= 2){
      const pts = Array.from(pointers.values());
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const cx = (pts[0].x + pts[1].x) / 2;
      const cy = (pts[0].y + pts[1].y) / 2;
      const l = clientToLocal(cx, cy);
      const newZoom = clamp(pinch.zoom0 * (d / Math.max(pinch.d0, 1)), view.minZoom, view.maxZoom);
      const w0x = (pinch.midL0X - pinch.pan0X) / pinch.zoom0;
      const w0y = (pinch.midL0Y - pinch.pan0Y) / pinch.zoom0;
      view.zoom = newZoom;
      view.panX = l.x - w0x * newZoom;
      view.panY = l.y - w0y * newZoom;
      if (view.zoom <= view.minZoom + 0.0001) view.zoom = view.minZoom;
      view.clampPan();
      return;
    }
    if (touchGesture && touchGesture.id === e.pointerId){
      const dxTotal = e.clientX - touchGesture.x0;
      const dyTotal = e.clientY - touchGesture.y0;
      if (!touchGesture.moved && Math.hypot(dxTotal, dyTotal) > 8){
        touchGesture.moved = true;
        if (touchGesture.timer) clearTimeout(touchGesture.timer);
        if (view.zoom > view.minZoom + 0.001 || view.metrics.infinite){
          touchGesture.panning = true;
          touchGesture.lastX = e.clientX;
          touchGesture.lastY = e.clientY;
        }
      }
      if (touchGesture.panning){
        const pdx = e.clientX - touchGesture.lastX;
        const pdy = e.clientY - touchGesture.lastY;
        touchGesture.lastX = e.clientX;
        touchGesture.lastY = e.clientY;
        view.panBy(pdx, pdy);
      }
    }
  });

  const finishPointer = e => {
    if (mousePan && mousePan.id === e.pointerId) mousePan = null;
    if (touchGesture && touchGesture.id === e.pointerId){
      if (touchGesture.timer) clearTimeout(touchGesture.timer);
      const g = touchGesture;
      touchGesture = null;
      if (gameplay && interactive() && !g.moved && !g.longFired && !g.panning){
        const cell = view.hitTest(e.clientX, e.clientY);
        if (cell) localDigAt(cell.r, cell.c);
      }
    }
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 1){
      const [id, p] = pointers.entries().next().value;
      touchGesture = {
        id, x0: p.x, y0: p.y, x: p.x, y: p.y,
        time0: performance.now(),
        moved: true, longFired: true, panning: false,
        lastX: p.x, lastY: p.y, timer: null
      };
    }
  };

  canvas.addEventListener('pointerup', finishPointer);
  canvas.addEventListener('pointercancel', finishPointer);
}

const heldPan = { KeyW:false, KeyA:false, KeyS:false, KeyD:false };
const heldZoom = { in:false, out:false };

function clearHeldKeys(){
  heldPan.KeyW = heldPan.KeyA = heldPan.KeyS = heldPan.KeyD = false;
  heldZoom.in = false;
  heldZoom.out = false;
}
function isManualPanning(){
  return heldPan.KeyW || heldPan.KeyA || heldPan.KeyS || heldPan.KeyD;
}

let hotkeyCapture = null;

window.addEventListener('keydown', e => {
  if (hotkeyCapture){
    e.preventDefault();
    if (e.key === 'Escape'){ hotkeyCapture = null; renderMenu(); return; }
    const code = e.code;
    if (code && code !== 'Escape'){
      HOTKEYS[hotkeyCapture] = code;
      saveHotkeys();
      hotkeyCapture = null;
      renderMenu();
    }
    return;
  }

  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  const code = e.code || '';

  if (code === HOTKEYS.zoomIn){ heldZoom.in = true; e.preventDefault(); return; }
  if (code === HOTKEYS.zoomOut){ heldZoom.out = true; e.preventDefault(); return; }

  if ((code === 'KeyW' || code === 'KeyA' || code === 'KeyS' || code === 'KeyD') &&
      !codeBoundToAction(code)){
    const hasReview = G.reviewViews && G.reviewViews.length > 0;
    if (hasReview || (G.viewMe && G.state !== 'lobby')){
      heldPan[code] = true;
      cursorActiveUntil = 0;
      e.preventDefault();
    }
    return;
  }

  if (G.state !== 'playing' || !G.me) return;

  let handled = true;
  if      (code === HOTKEYS.up)    moveCursor(-1, 0);
  else if (code === HOTKEYS.down)  moveCursor(1, 0);
  else if (code === HOTKEYS.left)  moveCursor(0, -1);
  else if (code === HOTKEYS.right) moveCursor(0, 1);
  else if (code === HOTKEYS.dig){ if (!e.repeat) localDig(); }
  else if (code === HOTKEYS.flag){ if (!e.repeat) localFlag(); }
  else if (code === 'KeyE' || code === 'KeyQ'){ if (!e.repeat) localChord(); }
  else if (code === 'Digit0'){ if (G.viewMe) G.viewMe.resetView(); }
  else if (code === 'KeyR'){ returnToStart(); }
  else handled = false;
  if (handled) e.preventDefault();
}, { passive:false });

window.addEventListener('keyup', e => {
  const code = e.code || '';
  if (code === HOTKEYS.zoomIn)  heldZoom.in = false;
  if (code === HOTKEYS.zoomOut) heldZoom.out = false;
  if (code === 'KeyW' || code === 'KeyA' || code === 'KeyS' || code === 'KeyD'){
    heldPan[code] = false;
  }
});
window.addEventListener('blur', clearHeldKeys);

function activeViews(){
  if (G.reviewViews && G.reviewViews.length) return G.reviewViews;
  return G.viewMe ? [G.viewMe] : [];
}

function updatePanFromKeys(dtMs){
  const targets = activeViews();
  if (!targets.length) return;
  let dx = 0, dy = 0;
  if (heldPan.KeyA) dx += 1;
  if (heldPan.KeyD) dx -= 1;
  if (heldPan.KeyW) dy += 1;
  if (heldPan.KeyS) dy -= 1;
  if (!dx && !dy) return;
  const dt = dtMs / 1000;
  for (const v of targets){
    if (!v || !v.metrics) continue;
    if (v.zoom > v.minZoom + 0.0001 || v.metrics.infinite){
      v.panBy(dx * PAN_SPEED_CSS * dt, dy * PAN_SPEED_CSS * dt);
    }
  }
}

function updateZoomFromKeys(dtMs){
  if (!heldZoom.in && !heldZoom.out) return;
  const targets = activeViews();
  if (!targets.length) return;
  const dt = Math.min(dtMs, 100) / 1000;
  let factor = 1;
  if (heldZoom.in)  factor *= Math.exp(ZOOM_RATE * dt);
  if (heldZoom.out) factor *= Math.exp(-ZOOM_RATE * dt);
  for (const v of targets){
    if (!v || !v.metrics) continue;
    const nz = clamp(v.zoom * factor, v.minZoom, v.maxZoom);
    if (Math.abs(nz - v.zoom) < 0.0002) continue;
    v.zoomAround(v.pw / 2, v.ph / 2, nz);
  }
}

function holdButton(btn, fn){
  let t1 = null, t2 = null;
  const start = e => {
    e.preventDefault();
    if (!interactive()) return;
    fn();
    t1 = setTimeout(() => { t2 = setInterval(() => { if (interactive()) fn(); }, 110); }, 320);
  };
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
}
